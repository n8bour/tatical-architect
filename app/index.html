<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM27 Tactical Bible</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
:root{
  --bg:#f3f5f2; --panel:#ffffff; --panel2:#eef1ec; --line:#d9ded6; --text:#17201a; --muted:#5d6b61;
  --accent:#0f7b4f; --accent2:#0a5c3a; --accent-ink:#ffffff; --pitch:#2f7d4f; --pitch2:#2a7248; --pitchline:rgba(255,255,255,.75);
  --good:#1c8a4d; --warn:#b7791f; --crit:#c2412d; --info:#3b6ea8; --chip:#e4eae1;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --panel:#151d18; --panel2:#1b251f; --line:#27342c; --text:#e4ece6; --muted:#90a196;
    --accent:#2fbf7f; --accent2:#5fd6a0; --accent-ink:#06130c; --pitch:#1d4d33; --pitch2:#1a452e; --pitchline:rgba(255,255,255,.55);
    --good:#3cc47b; --warn:#e0a640; --crit:#ef6a55; --info:#6fa3e0; --chip:#223028;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --panel:#151d18; --panel2:#1b251f; --line:#27342c; --text:#e4ece6; --muted:#90a196;
  --accent:#2fbf7f; --accent2:#5fd6a0; --accent-ink:#06130c; --pitch:#1d4d33; --pitch2:#1a452e; --pitchline:rgba(255,255,255,.55);
  --good:#3cc47b; --warn:#e0a640; --crit:#ef6a55; --info:#6fa3e0; --chip:#223028;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
h1{font-size:28px} h2{font-size:21px} h3{font-size:16px} h4{font-size:14px}
p{margin:.3em 0 .7em}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:230px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:4px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:10.5px;letter-spacing:-.02em}
.brand b{display:block;font-size:14px}.brand span{font-size:11px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted)}
.nav-btn:hover{background:var(--panel2);color:var(--text)}
.nav-btn.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav-sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 12px 4px}
.aside-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px 12px}
main{overflow:auto;padding:22px 28px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.muted{color:var(--muted)} .small{font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:16px;align-items:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
select,input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:160px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f select,label.f input{color:var(--text);font-size:14px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
.chip.ip{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.chip.oop{background:color-mix(in srgb,var(--info) 20%,transparent)}
.chip.new{background:color-mix(in srgb,var(--warn) 25%,transparent)}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle}
.tag.v{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.tag.e{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pitch-wrap{position:relative}
svg.pitch{width:100%;height:auto;display:block;border-radius:10px}
.pitch .slot{cursor:pointer}
.pitch .slot:hover circle.dot{stroke:#fff;stroke-width:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.score-ring{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.bars{flex:1;display:grid;gap:6px}
.bar{display:grid;grid-template-columns:100px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.bar .t{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:9px}
.finding{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.sev{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.sev.crit{background:var(--crit)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}.sev.good{background:var(--good)}
.finding b{display:block}.finding .fix{font-size:12px;color:var(--accent);margin-top:2px}
.ti-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ti{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.ti.changed{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ti .h{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:13px}
.ti select{width:100%;margin:6px 0 4px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
details p{font-size:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.table-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
.fit{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 5px;font-weight:700;font-size:12px;color:#fff}
.role-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.role-card .attrs{font-size:12px;margin-top:6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--panel2)}
.drop.over{border-color:var(--accent)}
.notice{border-left:3px solid var(--info);background:color-mix(in srgb,var(--info) 9%,transparent);padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0}
.notice.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px}
.kv span{color:var(--muted)}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.step{display:flex;gap:12px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
ul.clean{margin:.3em 0;padding-left:18px} ul.clean li{margin:.25em 0}
@media (max-width:1100px){.split,.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{display:none}.g2,.g3,.g4{grid-template-columns:1fr}main{padding:14px}}
@media print{aside,.no-print{display:none!important}.app{display:block;height:auto}main{overflow:visible}}

/* ---------- campo animado ---------- */
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.simwrap{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:var(--pitch)}
svg.simpitch{display:block;width:100%;height:auto}
.simp{cursor:pointer}
.simp:focus-visible{outline:none}
.simbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;justify-content:space-between}
.phases{display:flex;flex:1 1 100%;order:3;gap:4px}
.phases .ph{flex:1;position:relative;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 4px 9px;cursor:pointer;font-size:12px;overflow:hidden;text-align:center;line-height:1.25}
.phases .ph i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent)}
.phases .ph.OOP i{background:var(--info)} .phases .ph.T i{background:var(--warn)}
.phases .ph.on{border-color:var(--accent);font-weight:600}
.simcap h3{font-size:17px}
.simside label.f.hl{outline:2px solid var(--warn);outline-offset:3px;border-radius:6px}
@media (max-width:1180px){.simgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.phases .ph i{transition:none}}
.simgrid>div{min-width:0}
.phases .ph{min-width:0}
@media (max-width:760px){.phases{flex-wrap:wrap}.phases .ph{flex:1 1 30%}}

.sheet td:first-child{width:24px}
.sheet input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
@media print{.sheet{grid-template-columns:1fr 1fr!important}.panel{box-shadow:none;break-inside:avoid}}

/* ---------- v3: navegação, estado, cartões guiados ---------- */
.nav-btn .ic{width:18px;text-align:center}
.aside-status{margin-top:18px;padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle}
.dot.ok{background:var(--good)}
.step-card .n{width:30px;height:30px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.step-card.done .n{background:var(--good);color:#fff}
.step-card{display:flex;flex-direction:column}
.step-card .row:last-child{margin-top:auto}
.recs{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--panel2)}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btnchip{border:1px dashed var(--accent);background:transparent;cursor:pointer;color:var(--text)}
.btnchip:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.oppbar{display:grid;grid-template-columns:170px 1fr 38px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.oppbar .t{position:relative;height:9px;background:var(--panel2);border-radius:9px}
.oppbar .t i{display:block;height:100%;border-radius:9px}
.oppbar .t em{position:absolute;top:-4px;width:3px;height:17px;background:var(--text);border-radius:2px;transform:translateX(-1px)}
#dropov{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 22%,transparent);border:3px dashed var(--accent);display:none;place-items:center;z-index:20;pointer-events:none;font-size:22px;font-weight:700;color:var(--text)}
#dropov.on{display:grid}
main>.tabs{position:sticky;top:-22px;background:var(--bg);z-index:3;padding-top:4px}
.panel.grid{align-content:start}

</style>
</head>
<body>
<div class="app"><aside id="nav"></aside><main id="main"></main></div>
<div id="dropov">Largue o ficheiro — plantel (CSV/HTML/JSON), tática .fmf ou cópia .json</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// ---- core/roles.js
// ============================================================
// FM27 Tactical Bible — Base de conhecimento: atributos e papéis
// src: 'v' = confirmado em fontes públicas FM26/FM27; 'e' = estimado
// (pesos derivados da lógica FM; confirmar no jogo e ajustar aqui).
// ============================================================

const ATTRS = {
  // técnicos
  cor:{n:'Cantos',c:'T',a:['cor','corners']}, cro:{n:'Cruzamentos',c:'T',a:['cro','crossing','crossing']},
  dri:{n:'Drible',c:'T',a:['dri','dribbling']}, fin:{n:'Finalização',c:'T',a:['fin','finishing']},
  fir:{n:'Primeiro Toque',c:'T',a:['fir','first touch','firsttouch']}, fre:{n:'Livres',c:'T',a:['fre','free kick taking','free kicks']},
  hea:{n:'Cabeceamento',c:'T',a:['hea','heading']}, lon:{n:'Remates de Longe',c:'T',a:['lon','long shots']},
  lth:{n:'Lançamentos Longos',c:'T',a:['l th','lth','long throws']}, mar:{n:'Marcação',c:'T',a:['mar','marking']},
  pas:{n:'Passe',c:'T',a:['pas','passing']}, pen:{n:'Penáltis',c:'T',a:['pen','penalty taking']},
  tck:{n:'Desarme',c:'T',a:['tck','tackling']}, tec:{n:'Técnica',c:'T',a:['tec','technique']},
  // mentais
  agg:{n:'Agressividade',c:'M',a:['agg','aggression']}, ant:{n:'Antecipação',c:'M',a:['ant','anticipation']},
  bra:{n:'Bravura',c:'M',a:['bra','bravery']}, cmp:{n:'Compostura',c:'M',a:['cmp','composure']},
  cnt:{n:'Concentração',c:'M',a:['cnt','concentration']}, dec:{n:'Decisões',c:'M',a:['dec','decisions']},
  det:{n:'Determinação',c:'M',a:['det','determination']}, fla:{n:'Talento',c:'M',a:['fla','flair']},
  ldr:{n:'Liderança',c:'M',a:['ldr','leadership']}, otb:{n:'Sem Bola',c:'M',a:['otb','off the ball']},
  pos:{n:'Posicionamento',c:'M',a:['pos','positioning']}, tea:{n:'Trabalho de Equipa',c:'M',a:['tea','teamwork','team work']},
  vis:{n:'Visão',c:'M',a:['vis','vision']}, wor:{n:'Índice de Trabalho',c:'M',a:['wor','work rate','workrate']},
  // físicos
  acc:{n:'Aceleração',c:'F',a:['acc','acceleration']}, agi:{n:'Agilidade',c:'F',a:['agi','agility']},
  bal:{n:'Equilíbrio',c:'F',a:['bal','balance']}, jum:{n:'Impulsão',c:'F',a:['jum','jumping reach','jumping']},
  nat:{n:'Aptidão Natural',c:'F',a:['nat','natural fitness']}, pac:{n:'Velocidade',c:'F',a:['pac','pace']},
  sta:{n:'Resistência',c:'F',a:['sta','stamina']}, str:{n:'Força',c:'F',a:['str','strength']},
  // guarda-redes
  aer:{n:'Alcance Aéreo',c:'G',a:['aer','aerial reach','aerial ability']}, cmd:{n:'Domínio da Área',c:'G',a:['cmd','command of area']},
  com:{n:'Comunicação',c:'G',a:['com','communication']}, ecc:{n:'Excentricidade',c:'G',a:['ecc','eccentricity']},
  han:{n:'Jogo de Mãos',c:'G',a:['han','handling']}, kic:{n:'Pontapé',c:'G',a:['kic','kicking']},
  ovo:{n:'Um para Um',c:'G',a:['1v1','ovo','one on ones']}, pun:{n:'Socos',c:'G',a:['pun','punching (tendency)','punching']},
  ref:{n:'Reflexos',c:'G',a:['ref','reflexes']}, tro:{n:'Saídas',c:'G',a:['tro','rushing out (tendency)','rushing out']},
  thr:{n:'Reposição à Mão',c:'G',a:['thr','throwing']},
};

// Grupos de posição
const GROUPS = {
  GK:'Guarda-redes', DC:'Defesa central', D_LR:'Lateral (D E/D)', WB_LR:'Ala (WB E/D)', DM:'Médio defensivo',
  MC:'Médio centro', M_LR:'Médio ala (M E/D)', AMC:'Médio ofensivo centro', AM_LR:'Extremo (AM E/D)', ST:'Avançado',
};

// Etiquetas de comportamento (usadas pelo motor de auditoria)
// IP: W=dá largura, IN=entra por dentro, RD=fica atrás (rest-defence), BOX=ataca a área/golo,
//     CR=criativo/expressivo, LINK=liga jogo, RUN=ataca a profundidade, DROP=baixa no terreno,
//     AIR=referência aérea, ADV=sobe de linha, TOCB=passa a central, TODM=passa a médio defensivo
// OOP: HP=pressão alta/assertivo, LOW=cauteloso, OUT=outlet (fica na frente), CW=cobre o flanco, TRK=acompanha recuo
const T = (s) => s.split(' ').filter(Boolean);

function R(id, ab, name, phase, groups, tags, key, pref, desc, tip, src, extra) {
  return Object.assign({ id, ab, name, phase, groups, tags: T(tags), key: T(key), pref: T(pref), desc, tip, src: src || 'e' }, extra || {});
}

const ROLES = [
  // ---------------- GUARDA-REDES ----------------
  R('gk_ip','GK','Goalkeeper','IP',['GK'],'RD','han ref pos cnt ovo agi aer','kic thr com dec ant cmd',
    'Guarda-redes equilibrado na posse: distribui de forma segura conforme as instruções de equipa.',
    'Base sólida quando o GR não é bom com os pés; combina com Goal Kicks "Mixed".'),
  R('bpgk','BPG','Ball-Playing Goalkeeper','IP',['GK'],'RD CR','pas fir kic thr cmp dec vis','han ref tec ant cnt pos',
    'Participa activamente na construção, assume riscos no passe e pode sair da baliza para servir de apoio.',
    'Essencial com "Play Through Press". Sem Passe/Compostura ≥ 12 é uma fonte de perdas de bola perigosas.'),
  R('nngk','NNG','No-Nonsense Goalkeeper','IP',['GK'],'RD','kic han ref aer pos cnt','com cmd str',
    'Joga pelo seguro: alivia, bate longo, evita riscos na construção.',
    'Bom par para "Bypass Press" e Goal Kicks "Long" com um Target Forward.'),
  R('gk_oop','GK','Goalkeeper','OOP',['GK'],'','han ref pos cnt ovo agi','aer cmd com ant dec',
    'Comportamento defensivo padrão: alterna entre ficar na linha e sair consoante a situação.',
    'Escolha segura com linha defensiva média.'),
  R('lhk','LHK','Line-Holding Keeper','OOP',['GK'],'LOW','pos cnt ref han agi','ovo dec',
    'Fica na linha de golo e reage. Bom para equipas que defendem a área em bloco baixo.',
    'Funciona melhor com linha defensiva baixa; com linha alta deixa espaço enorme nas costas.','v'),
  R('swk','SK','Sweeper Keeper','OOP',['GK'],'HP','cmd ovo tro ref ant dec cmp acc','aer han pas fir kic pos agi',
    'Sai da baliza para varrer bolas nas costas da defesa.',
    'Obrigatório com linha defensiva alta. Exige Antecipação, Decisões e Saídas.'),

  // ---------------- DEFESAS CENTRAIS ----------------
  R('cb_ip','CB','Centre-Back','IP',['DC'],'RD','hea mar tck pos str jum','cmp dec cnt ant pac',
    'Mantém a posição na construção, passes simples para o médio ou lateral.',
    'O "default" que nunca compromete a rest-defence.'),
  R('bpcb','BPD','Ball-Playing Centre-Back','IP',['DC'],'RD CR','pas cmp dec hea mar tck pos str','vis fir tec ant cnt jum',
    'Mantém posição mas é expressivo com bola: procura passes progressivos e mudanças de flanco.',
    'Um BPD + um DC simples é a dupla mais estável. Dois BPD só com médio defensivo seguro.'),
  R('nncb','NCB','No-Nonsense Centre-Back','IP',['DC'],'RD','hea mar tck pos str jum bra','agg cnt ant',
    'Cuidadoso: alivia sem hesitar, não arrisca na construção.',
    'Contradiz "Play Through Press". Use em bloco baixo / jogo directo.'),

  if (code.startsWith('AMC')) return 'AMC';
  if (code.startsWith('ST')) return 'ST';
  return 'MC';
}
function isWideCB(code, formation) {
  const slots = FORMATIONS[formation] || [];
  const nCB = slots.filter(s => s.code.startsWith('DC')).length;
  return nCB >= 3 && (code === 'DCL' || code === 'DCR');
}
function sideOf(x) { return x < 33 ? 'L' : x > 67 ? 'R' : 'C'; }

// ---------- Algoritmo húngaro (minimização, n linhas ≤ m colunas) ----------
function hungarian(cost) {
  const n = cost.length; if (!n) return [];
  const m = cost[0].length;
  const INF = 1e18, u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0);
  const p = new Array(m + 1).fill(0), way = new Array(m + 1).fill(0);
  for (let i = 1; i <= n; i++) {
    p[0] = i; let j0 = 0;
    const minv = new Array(m + 1).fill(INF), used = new Array(m + 1).fill(false);
    do {
      used[j0] = true; const i0 = p[j0]; let delta = INF, j1 = 0;
      for (let j = 1; j <= m; j++) if (!used[j]) {
        const cur = cost[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      for (let j = 0; j <= m; j++) { if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta; }
      j0 = j1;
    } while (p[j0] !== 0);
    do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
  }
  const res = new Array(n).fill(-1);
  for (let j = 1; j <= m; j++) if (p[j]) res[p[j] - 1] = j - 1;
  return res;
}

// ---------- Papéis válidos ----------
function rolesFor(group, phase, wideCB) {
  return ROLES.filter(r => r.phase === phase && r.groups.includes(group) && (r.wideCB ? wideCB : true));
}
const DEFAULT_ROLE = {
  IP:{ GK:'gk_ip', DC:'cb_ip', D_LR:'fb_ip', WB_LR:'wb_ip', DM:'dm_ip', MC:'cm_ip', M_LR:'wm_ip', AMC:'am_ip', AM_LR:'w_ip', ST:'cf_ip' },
  OOP:{ GK:'gk_oop', DC:'cb_oop', D_LR:'fb_oop', WB_LR:'wb_oop', DM:'dm_oop', MC:'cm_oop', M_LR:'wm_oop', AMC:'am_oop', AM_LR:'w_oop', ST:'cf_oop' },
};
function validRole(id, group, phase, wideCB) {
  const r = ROLE_BY_ID[id];
  return !!r && r.phase === phase && r.groups.includes(group) && (!r.wideCB || wideCB);
}

// ---------- Tática ----------
function slotInfo(formation, code) {
  const s = (FORMATIONS[formation] || []).find(z => z.code === code);
  return s ? { ...s, group: groupOf(code), side: sideOf(s.x), wideCB: isWideCB(code, formation) } : null;
}

// Emparelha cada posição IP com a posição OOP mais próxima (custo total mínimo)
function matchFormations(ipForm, oopForm) {
  const A = FORMATIONS[ipForm], B = FORMATIONS[oopForm];
  const cost = A.map(a => B.map(b => {
    if ((a.code === 'GK') !== (b.code === 'GK')) return 1e6;
    return Math.hypot(a.x - b.x, (a.y - b.y) * 1.1);
  }));
  const asg = hungarian(cost);
  return A.map((a, i) => ({ ipCode: a.code, oopCode: B[asg[i]].code }));
}

function newTactic(ipForm = '4-3-3 DM Wide', oopForm = '4-1-4-1 DM Wide') {
  const pairs = matchFormations(ipForm, oopForm);
  return {
    name: 'Nova tática', ment: 'Balanced', ipForm, oopForm,
    slots: pairs.map(p => {
      const a = slotInfo(ipForm, p.ipCode), b = slotInfo(oopForm, p.oopCode);
      return { ipCode: p.ipCode, oopCode: p.oopCode, ip: DEFAULT_ROLE.IP[a.group], oop: DEFAULT_ROLE.OOP[b.group], pid: null, pis: [] };
    }),
    ti: {}, ois: 0, source: 'manual',
  };
}

// Mudar formação mantendo papéis/jogadores quando possível
function retargetTactic(t, ipForm, oopForm) {
  const nt = newTactic(ipForm, oopForm);
  nt.name = t.name; nt.ment = t.ment; nt.ti = { ...t.ti }; nt.ois = t.ois; nt.source = t.source;
  const oldIP = FORMATIONS[t.ipForm];
  const newIP = FORMATIONS[ipForm];
  // emparelhar slots antigos → novos por proximidade da posição IP
  const cost = newIP.map(a => oldIP.map(b => ((a.code === 'GK') !== (b.code === 'GK')) ? 1e6 : Math.hypot(a.x - b.x, a.y - b.y)));
  const asg = hungarian(cost);
  nt.slots.forEach((s, i) => {
    const old = t.slots.find(o => o.ipCode === oldIP[asg[i]].code); if (!old) return;
    const a = slotInfo(ipForm, s.ipCode), b = slotInfo(oopForm, s.oopCode);
    if (validRole(old.ip, a.group, 'IP', a.wideCB)) s.ip = old.ip;
    if (validRole(old.oop, b.group, 'OOP', b.wideCB)) s.oop = old.oop;
    s.pid = old.pid; s.pis = old.pis || [];
  });
  return nt;
}

function tacticFromTemplate(tp) {
  const t = newTactic(tp.ip, tp.oop);
  t.name = tp.n; t.ment = tp.ment; t.ti = { ...tp.ti }; t.source = 'template';
  t.slots.forEach(s => {
    const r = tp.roles[s.ipCode]; if (!r) return;
    const a = slotInfo(tp.ip, s.ipCode), b = slotInfo(tp.oop, s.oopCode);
    if (validRole(r[0], a.group, 'IP', a.wideCB)) s.ip = r[0];
    if (validRole(r[1], b.group, 'OOP', b.wideCB)) s.oop = r[1];
  });
  return t;
}

const POS_ALIASES = ['position','positions','posição','posicao','posições','pos.'];

// Colunas extra do FM View Exporter (FM27): guardadas para mostrar, não entram nos cálculos

function normHeader(h) {
  return String(h || '').trim().toLowerCase().replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').replace(/[.:]$/, '')
    .replace(/^(attributes?|technical|mental|physical|goalkeeping|goalkeeper|gk attributes) /, '');
}
const POS_RATING = { gk:['GK'], dl:['D_LR','D_LR:L'], dc:['DC'], dr:['D_LR','D_LR:R'], wbl:['WB_LR','WB_LR:L'], wbr:['WB_LR','WB_LR:R'], dm:['DM'], dmc:['DM'],
  ml:['M_LR','M_LR:L'], mc:['MC'], mr:['M_LR','M_LR:R'], aml:['AM_LR','AM_LR:L'], amc:['AMC'], amr:['AM_LR','AM_LR:R'], st:['ST'], sc:['ST'] };

function headerToKey(h) {
  const n = normHeader(h);
  if (!n) return null;
  if (NAME_ALIASES.includes(n)) return 'name';
  if (POS_ALIASES.includes(n)) return 'position';
  if (AGE_ALIASES.includes(n)) return 'age';
  if (META_ALIASES[n]) return 'meta:' + META_ALIASES[n];
  if (/ code$/.test(n)) return null;                                      // colunas *_code do fmsave (há uma coluna de texto ao lado)
  const pr = n.match(/^(?:positions?|position rating|proficienc(?:y|ies)|pos) (gk|dl|dc|dr|wbl|wbr|dm|dmc|ml|mc|mr|aml|amc|amr|st|sc)$/);
  if (pr) return 'posr:' + pr[1];
  for (const [k, a] of Object.entries(ATTRS)) if (a.a.includes(n) || normHeader(a.n) === n) return k;
  return null;
}

function parseAttrValue(v) {
  const s = String(v ?? '').trim();
  if (!s || s === '-' || s === '–') return null;
  const m = s.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})$/);
  if (m) return (+m[1] + +m[2]) / 2;
  const n = parseFloat(s.replace(',', '.'));
  return isFinite(n) ? n : null;
}

// "D (RL), WB (R)", "AM (RLC), ST (C)", "DM, M (C)", "M/AM (R)", "GK"
function parsePositions(str) {
  const out = new Set();
  const s = String(str || '').toUpperCase().replace(/\s+/g, ' ');
  // dividir em partes no nível de topo (vírgulas fora de parênteses)
  const parts = []; let depth = 0, cur = '';
  for (const ch of s) { if (ch === '(') depth++; if (ch === ')') depth--; if (ch === ',' && depth === 0) { parts.push(cur); cur = ''; } else cur += ch; }
  if (cur.trim()) parts.push(cur);
  for (const part of parts) {
    const code = part.trim();
    const SHORT = { GK:['GK'], DC:['DC'], DCL:['DC'], DCR:['DC'], DL:['D_LR','D_LR:L'], DR:['D_LR','D_LR:R'], WBL:['WB_LR','WB_LR:L'], WBR:['WB_LR','WB_LR:R'],
      DM:['DM'], MC:['MC'], ML:['M_LR','M_LR:L'], MR:['M_LR','M_LR:R'], AMC:['AMC'], AML:['AM_LR','AM_LR:L'], AMR:['AM_LR','AM_LR:R'], ST:['ST'], SC:['ST'] };
    if (SHORT[code]) { SHORT[code].forEach(x => out.add(x)); continue; }
    const m = code.match(/^([A-Z/ ]+?)\s*(?:\(([RLC]+)\))?$/); if (!m) continue;
    const pref = m[1].split('/').map(x => x.trim()).filter(Boolean);
    const sides = (m[2] || '').split('');
    for (const p of pref) {
      if (p === 'GK') out.add('GK');
      else if (p === 'DM') out.add('DM');
      else if (p === 'ST' || p === 'S') out.add('ST');
      else if (p === 'D') { if (!sides.length || sides.includes('C')) out.add('DC'); sides.filter(x => x !== 'C').forEach(x => { out.add('D_LR'); out.add('D_LR:' + x); }); }
      else if (p === 'WB') { (sides.length ? sides : ['L','R']).filter(x => x !== 'C').forEach(x => { out.add('WB_LR'); out.add('WB_LR:' + x); }); }
      else if (p === 'M') { if (!sides.length || sides.includes('C')) out.add('MC'); sides.filter(x => x !== 'C').forEach(x => { out.add('M_LR'); out.add('M_LR:' + x); }); }
      else if (p === 'AM') { if (!sides.length || sides.includes('C')) out.add('AMC'); sides.filter(x => x !== 'C').forEach(x => { out.add('AM_LR'); out.add('AM_LR:' + x); }); }
    }
  }
  return [...out];
}

function tableFromText(text) {
  const t = String(text || '').replace(/\r/g, '').trim();
  if (!t) return [];
  if (/<table/i.test(t)) {
    const doc = new DOMParser().parseFromString(t, 'text/html');
    const tables = [...doc.querySelectorAll('table')];
    const table = tables.sort((a, b) => b.rows.length - a.rows.length)[0];
    return [...table.rows].map(r => [...r.cells].map(c => c.textContent.trim()));
  }
  const lines = t.split('\n').filter(l => l.trim() && !/^[\s|\-+=_]+$/.test(l));
  if (lines.some(l => (l.match(/\|/g) || []).length >= 3)) {
    return lines.map(l => l.split('|').map(x => x.trim())).map(r => { if (r[0] === '') r.shift(); if (r[r.length - 1] === '') r.pop(); return r; });
  }
  const head = lines[0];
  const delim = ['\t', ';', ','].sort((a, b) => head.split(b).length - head.split(a).length)[0];
  return lines.map(l => splitCSV(l, delim));
}
function splitCSV(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === d && !q) { out.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  out.push(cur.trim()); return out;
}

function parseSquad(text) {
  const rows = tableFromText(text);
  if (rows.length < 2) return { players: [], warnings: ['Não encontrei uma tabela com cabeçalho e linhas.'], mapped: [] };
  // encontrar a linha de cabeçalho: a que tem mais colunas reconhecidas
  let hi = 0, best = -1;
  rows.slice(0, 6).forEach((r, i) => { const c = r.map(headerToKey).filter(Boolean).length; if (c > best) { best = c; hi = i; } });
  const header = rows[hi].map(headerToKey);
  const mapped = rows[hi].map((h, i) => ({ h, k: header[i] }));
  const warnings = [];
  if (!header.includes('name')) warnings.push('Sem coluna de nome reconhecida ("Name"/"Nome"). Uso a primeira coluna.');
  const attrCols = header.filter(k => k && ATTRS[k]).length;
  if (attrCols < 10) warnings.push(`Só reconheci ${attrCols} atributos. Para análise completa exporte uma vista com todos os atributos.`);
  const players = [];
  rows.slice(hi + 1).forEach((r, idx) => {
    const p = { id: 'p' + idx + '_' + Math.random().toString(36).slice(2, 7), name: '', pos: [], posRaw: '', age: null, a: {}, meta: {} };
    r.forEach((v, i) => {
      const k = header[i];
      if (k && k.startsWith('meta:')) { if (v) p.meta[k.slice(5)] = v; }
      else if (k && k.startsWith('posr:')) { const n = parseAttrValue(v); if (n != null) (p.posR = p.posR || {})[k.slice(5)] = n; }
      else if (k === 'name') p.name = v;
      else if (k === 'position') { p.posRaw = v; p.pos = parsePositions(v); }
      else if (k === 'age') p.age = parseAttrValue(v);
      else if (k && ATTRS[k]) { const n = parseAttrValue(v); if (n != null) p.a[k] = n; }
    });
    if (!p.name) p.name = r[0];
    if (!p.pos.length && p.posR) {
      // proficiências 1–20 por posição (fmsave): ≥ 15 conta como posição natural; se nenhuma, a melhor
      const ent = Object.entries(p.posR); const top = Math.max(...ent.map(e => e[1]));
      const good = ent.filter(([, r]) => r >= 15 || (top < 15 && r === top)).map(([k]) => k);
      p.pos = [...new Set(good.flatMap(k => POS_RATING[k] || []))]; p.posRaw = good.map(k => k.toUpperCase()).join(', ');
    }
    if (!p.pos.length && p.meta.bestPos) { p.posRaw = p.meta.bestPos; p.pos = parsePositions(p.meta.bestPos); }
    if (p.meta.uid) p.id = 'u' + p.meta.uid;
    if (p.name && Object.keys(p.a).length >= 3) players.push(p);
  });
  const seen = {};
  players.forEach(p => { if (!p.meta.uid) { const base = 'n:' + p.name.trim().toLowerCase(); seen[base] = (seen[base] || 0) + 1; p.id = seen[base] > 1 ? base + '#' + seen[base] : base; } });
  if (!players.length) warnings.push('Nenhum jogador com atributos foi lido.');
  return { players, warnings, mapped };
}

// ---------- Adequação ----------
function roleScore(p, role) {
  if (!p || !role) return null;
  let s = 0, w = 0, have = 0, tot = 0;
  for (const k of role.key) { tot++; const v = p.a[k]; if (v != null) { s += v * 2; w += 2; have++; } }
  for (const k of role.pref) { tot++; const v = p.a[k]; if (v != null) { s += v; w += 1; have++; } }
  if (!w) return null;
  const avg = s / w;
  return { score: Math.round(Math.max(0, Math.min(100, (avg - 1) / 19 * 100))), coverage: have / tot };
}
const ADJ = { DM:['MC','DC'], MC:['DM','AMC'], AMC:['MC','ST'], ST:['AMC'], M_LR:['AM_LR','WB_LR'], AM_LR:['M_LR','ST'], D_LR:['WB_LR','DC'], WB_LR:['D_LR','M_LR'], DC:['DM','D_LR'], GK:[] };
function posFactor(p, group, side) {
  if (!p.pos || !p.pos.length) return 1;
  const isGK = p.pos.includes('GK');
  if (group === 'GK') return isGK ? 1 : 0.1;
  if (isGK && p.pos.length === 1) return 0.1;
  if (p.pos.includes(group)) {
    if ((side === 'L' || side === 'R') && ['D_LR','WB_LR','M_LR','AM_LR'].includes(group)) return p.pos.includes(group + ':' + side) ? 1 : 0.9;
    return 1;
  }
  if ((ADJ[group] || []).some(g => p.pos.includes(g))) return 0.82;
  return 0.6;
}
function slotScore(p, t, slot) {
  const a = slotInfo(t.ipForm, slot.ipCode), b = slotInfo(t.oopForm, slot.oopCode);
  const ri = roleScore(p, ROLE_BY_ID[slot.ip]), ro = roleScore(p, ROLE_BY_ID[slot.oop]);
  if (!ri && !ro) return 0;
  const base = ri && ro ? ri.score * 0.55 + ro.score * 0.45 : (ri || ro).score;
  return Math.round(base * Math.min(posFactor(p, a.group, a.side), posFactor(p, b.group, b.side)));
}
function autoPickXI(t, players) {
  if (!players.length) return t;
  const cost = t.slots.map(s => players.map(p => 100 - slotScore(p, t, s)));
  // garantir colunas ≥ linhas
  while (cost[0].length < cost.length) cost.forEach(r => r.push(1000));
  const asg = hungarian(cost);
  t.slots.forEach((s, i) => { s.pid = players[asg[i]] ? players[asg[i]].id : null; });
  return t;
}
function bestRolesForPlayer(p, group, phase, wideCB, n = 3) {
  return rolesFor(group, phase, wideCB).map(r => ({ r, s: (roleScore(p, r) || { score: 0 }).score })).sort((a, b) => b.s - a.s).slice(0, n);
}

// ---------- Auditoria ----------
function tiVal(t, k) { const d = TI_BY_KEY[k]; return t.ti[k] != null ? t.ti[k] : d.def; }
function tiLabel(k, v) { return TI_BY_KEY[k].opts[v]; }
function avgAttr(players, keys) {
  const vals = []; players.forEach(p => keys.forEach(k => { if (p && p.a[k] != null) vals.push(p.a[k]); }));
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

function complexityOf(t) {
  let cx = 0; const parts = [];
  TEAM_INSTRUCTIONS.forEach(d => { const v = tiVal(t, d.k); if (v !== d.def) { const c = Math.abs(v - d.def) * d.cx; cx += c; parts.push([d.n + ': ' + d.opts[v], c]); } });
  t.slots.forEach(s => {
    const r = ROLE_BY_ID[s.ip];
    if (r && ['fr','ocb','acb','f9'].includes(r.id)) { cx += 1; parts.push(['Papel exigente: ' + r.name, 1]); }
    if (s.pis && s.pis.length) { cx += s.pis.length * 0.5; parts.push([`${s.pis.length} instrução(ões) individuais (${s.ipCode})`, s.pis.length * 0.5]); }
  });
  if (t.ois) { cx += t.ois * 0.5; parts.push([`${t.ois} instruções de adversário`, t.ois * 0.5]); }
  const level = cx <= 6 ? 'Baixa' : cx <= 12 ? 'Média' : 'Alta';
  return { cx: Math.round(cx * 10) / 10, level, parts };
}

function auditTactic(t, squad) {
  const F = []; // findings
  const add = (cat, sev, title, text, fix) => F.push({ cat, sev, title, text, fix });
  const pmap = Object.fromEntries((squad || []).map(p => [p.id, p]));
  const S = t.slots.map(s => {
    const a = slotInfo(t.ipForm, s.ipCode), b = slotInfo(t.oopForm, s.oopCode);
    return { s, a, b, ip: ROLE_BY_ID[s.ip], oop: ROLE_BY_ID[s.oop], p: pmap[s.pid] || null };
  });
  const ipTag = (tag) => S.filter(x => x.ip && x.ip.tags.includes(tag));
  const oopTag = (tag) => S.filter(x => x.oop && x.oop.tags.includes(tag));
  const mi = MENTALITIES.indexOf(t.ment);
  const outfield = S.filter(x => x.a.group !== 'GK');

  // 1. papéis em falta / inválidos
  S.forEach(x => {
    if (!x.ip || !validRole(x.s.ip, x.a.group, 'IP', x.a.wideCB)) add('IP','crit',`Papel IP inválido em ${x.s.ipCode}`,'O papel não existe para esta posição.','Escolha um papel IP válido.');
    if (!x.oop || !validRole(x.s.oop, x.b.group, 'OOP', x.b.wideCB)) add('OOP','crit',`Papel OOP inválido em ${x.s.oopCode}`,'O papel não existe para esta posição.','Escolha um papel OOP válido.');
  });

  // 2. largura por flanco
  const wideSide = (x) => x.a.side !== 'C' ? x.a.side : (x.a.x < 50 ? 'L' : 'R');
  for (const side of ['L', 'R']) {
    const nm = side === 'L' ? 'esquerdo' : 'direito';
    const wide = ipTag('W').filter(x => wideSide(x) === side);
    if (!wide.length) add('IP','warn',`Sem largura no flanco ${nm}`,
      'Nenhum papel com bola fica aberto deste lado. O adversário fecha o meio sem custo e os ataques ficam previsíveis.',
      'Use um Winger/Wide Forward, um Wing-Back/Advanced Wing-Back, ou um Wide Central Midfielder deste lado.');
    const flankers = outfield.filter(x => x.a.side === side && ['D_LR','WB_LR','M_LR','AM_LR'].includes(x.a.group) || (x.a.wideCB && x.a.side === side));
    const fb = flankers.find(x => ['D_LR','WB_LR'].includes(x.a.group));
    const att = flankers.find(x => ['M_LR','AM_LR'].includes(x.a.group));
    if (fb && att && fb.ip && att.ip) {
      const fbIn = fb.ip.tags.includes('IN'), attIn = att.ip.tags.includes('IN');
      const fbW = fb.ip.tags.includes('W'), attW = att.ip.tags.includes('W');
      if (attIn && fbW) add('IP','good',`Flanco ${nm} complementar`,`${att.ip.name} por dentro + ${fb.ip.name} por fora: largura e ameaça interior sem conflito.`);
      else if (fbIn && attW) add('IP','good',`Flanco ${nm} complementar`,`${fb.ip.name} fecha por dentro, ${att.ip.name} dá largura — boa rest-defence neste lado.`);
      else if (fbW && attW && fb.ip.tags.includes('ADV') && att.ip.tags.includes('RUN')) add('IP','info',`Corredor ${nm} pode ficar congestionado`,
        `${fb.ip.name} e ${att.ip.name} querem ambos o corredor.`,'Ponha Supporting Runs em Overlap e/ou troque o extremo por Inside Forward/Inside Winger.');
    }
  }

  // 3. rest-defence
  const rd = outfield.filter(x => x.ip && (x.ip.tags.includes('RD') || x.ip.tags.includes('TOCB') || ((x.s.pis || []).includes('Hold position') && !x.ip.tags.includes('ADV')))).length;
  if (rd < 3) add('IP', mi >= 4 ? 'crit' : 'warn', `Rest-defence frágil (${rd} jogador${rd === 1 ? '' : 'es'})`,
    'Poucos jogadores ficam atrás da linha da bola. Cada perda pode virar contra-ataque com superioridade adversária.',
    'Garanta 3–4: dois centrais + DM/Half Back seguros, ou um lateral como Inside Full-Back/Inside Wing-Back.');
  else if (rd >= 6) add('IP','info',`Muitos jogadores atrás (${rd})`,'Estrutura muito conservadora com bola; pode faltar gente na frente.','Liberte um lateral (Wing-Back) ou um médio (Box-To-Box).');
  else add('IP','good',`Rest-defence equilibrada (${rd})`,'Número adequado de jogadores a proteger a transição.');

  // 4. ocupação da área
  const box = ipTag('BOX').length;
  if (box === 0) add('IP','crit','Ninguém ataca a área','Nenhum papel com ameaça de golo na área.','Avançado Centre Forward/Poacher, extremo Inside Forward, médio Attacking Midfielder/Box-To-Box.');
  else if (box === 1) add('IP','warn','Pouca presença na área (1)','Um só jogador a atacar a área é fácil de neutralizar.','Adicione um Inside Forward, Attacking Midfielder ou Box-To-Box.');
  else add('IP','good',`Presença na área (${box})`,'Vários jogadores a atacar a área.');

  // 5. profundidade
  const st = S.filter(x => x.a.group === 'ST');
  const runners = ipTag('RUN').filter(x => x.a.group !== 'ST' || !x.ip.tags.includes('DROP'));
  if (st.length && st.every(x => x.ip && x.ip.tags.includes('DROP'))) {
    const others = ipTag('RUN').filter(x => x.a.group !== 'ST').length + ipTag('BOX').filter(x => x.a.group !== 'ST').length;
    if (others < 2) add('IP','warn','Avançado(s) baixam e ninguém ataca o espaço',
      'False Nine/Deep-Lying Forward arrasta centrais mas o espaço criado fica vazio.',
      'Use Inside Forward, Channel Midfielder ou Second Striker para atacar a profundidade.');
  }
  if (!runners.length) add('IP','warn','Sem ataque à profundidade','Nenhum papel ataca as costas da defesa — fácil para o adversário subir a linha.','Channel Forward, Poacher, Inside Forward, Wide Forward ou Advanced Wing-Back.');
  if (st.length === 2 && st[0].ip && st[1].ip && st[0].ip.id === st[1].ip.id) add('IP','info','Dupla de avançados igual',
    `Dois ${st[0].ip.name}: tendem a ocupar o mesmo espaço.`,'Combine perfis: um que baixa (DLF/TF) e um que ataca o espaço (Channel Forward/Poacher).');

  // 6. criatividade
  const cr = ipTag('CR').filter(x => x.a.group !== 'GK' && x.a.group !== 'DC');
  if (!cr.length) add('IP','warn','Sem criador designado','Nenhum papel expressivo/organizador — a progressão depende só das instruções.','Deep-Lying Playmaker, Midfield Playmaker, Advanced Playmaker ou Playmaking Winger.');
  else if (cr.length >= 4) add('IP','warn',`Demasiados criadores (${cr.length})`,`${cr.map(x => x.ip.ab).join(', ')} pedem todos a bola.`,'Mantenha 2–3 e troque os restantes por papéis de movimento (corredores/finalizadores).');

  // 7. laterais
  const fbs = S.filter(x => ['D_LR','WB_LR'].includes(x.a.group));
  if (fbs.length === 2 && fbs.every(x => x.ip && x.ip.tags.includes('ADV')) && !outfield.some(x => x.ip && (x.ip.tags.includes('TOCB') || (x.a.group === 'DM' && x.ip.tags.includes('RD')))) && S.filter(x => x.a.group === 'DC').length < 3)
    add('IP','warn','Os dois laterais sobem com linha de 2','Com dois alas ofensivos e só 2 centrais, os flancos ficam expostos em transição.','Half Back no DM, um Inside Full-Back, ou um papel OOP Wide Covering no médio.');
  const acb = outfield.filter(x => x.ip && x.ip.id === 'acb');
  if (acb.length && outfield.filter(x => x.a.group === 'DC' && x.ip && x.ip.id !== 'acb').length < 2 && !outfield.some(x => x.ip && x.ip.tags.includes('TOCB')))
    add('IP','warn','Advanced Centre-Back sem cobertura','O ACB sobe para o meio-campo e fica só um central atrás.','Junte um Half Back ou Inside Full-Back, ou use linha de 3.');

  // 8. OOP: outlets e pressão
  const outl = oopTag('OUT').length;
  if (outl >= 3) add('OOP','crit',`Outlets a mais (${outl})`,'Três ou mais jogadores não defendem: o bloco fica em inferioridade.','Máximo 1–2 outlets; troque por Tracking/padrão.');
  const loe = tiVal(t,'loe') * 2, dl = tiVal(t,'dline'), trig = tiVal(t,'trigger'), dtr = tiVal(t,'def_trans'), atr = tiVal(t,'att_trans');
  const hp = oopTag('HP').length;
  if (loe >= 3 && hp <= 1) add('OOP','warn','Pressão alta sem pressionadores','Linha de pressão alta mas quase nenhum papel OOP assertivo.','Pressing CM/DM/FB, Tracking Centre Forward, Stopping CB.');
  if (loe <= 1 && hp >= 4) add('OOP','warn','Papéis de pressão num bloco baixo','Vários papéis assertivos com linha de pressão baixa: desorganiza o bloco.','Use Screening/Covering ou suba a Line of Engagement.');
  if (loe - dl >= 2) add('OOP','warn','Distância entre linhas (pressão alta, defesa baixa)',`LoE ${tiLabel('loe',loe/2)} com linha ${tiLabel('dline',dl)}: espaço enorme entre médios e defesa.`,'Aproxime as linhas (suba a defesa ou baixe a pressão).');
  if (dl - loe >= 2) add('OOP','warn','Linha alta sem pressão sobre a bola',`Linha ${tiLabel('dline',dl)} com LoE ${tiLabel('loe',loe/2)}: o portador tem tempo para lançar nas costas.`,'Suba a Line of Engagement ou baixe a linha defensiva.');
  const gk = S.find(x => x.a.group === 'GK');
  if (dl >= 3 && gk && gk.oop && gk.oop.id !== 'swk') add('OOP','warn','Linha alta sem Sweeper Keeper','Bolas nas costas da defesa ficam sem cobertura.','Mude o papel OOP do GR para Sweeper Keeper.');
  if (dl <= 1 && gk && gk.oop && gk.oop.id === 'swk') add('OOP','info','Sweeper Keeper com linha baixa','Pouco espaço para varrer; o GR sai sem necessidade.','Considere Goalkeeper ou Line-Holding Keeper.');
  if (atr === 2 && outl === 0 && !ipTag('RUN').length) add('Coerência','warn','Counter-Attack sem alvos','Transição de contra-ataque mas sem outlets nem corredores.','Adicione 1 Outlet OOP ou papéis de profundidade.');
  if (dtr === 2 && mi <= 1) add('Coerência','info','Counter-Press com mentalidade defensiva','Instrução e mentalidade puxam em sentidos opostos.','Escolha: Regroup para bloco baixo, ou suba a mentalidade.');
  if (dtr === 2 && tiVal(t,'width') >= 3) add('Coerência','info','Counter-Press com equipa muito larga','Jogadores longe uns dos outros na perda chegam tarde à pressão.','Balanced/Narrower na largura ou Regroup.');
  const trap = tiVal(t,'press_trap');
  if (trap === 2 && !S.some(x => x.oop && ['pfb','prwb','tw','twm','swcb'].includes(x.oop.id))) add('OOP','info','Pressing Trap Outside sem quem feche o corredor','Força para fora mas ninguém está instruído a apertar na ala.','Pressing Full-Back/Wing-Back ou Tracking Winger.');

  // 9. construção
  const bu = tiVal(t,'buildup');
  if (bu === 0) {
    if (gk && gk.ip && gk.ip.id === 'nngk') add('Coerência','warn','Play Through Press com No-Nonsense GK','O GR vai bater longo contra a intenção da equipa.','Ball-Playing Goalkeeper ou Goalkeeper.');
    if (S.some(x => x.ip && x.ip.id === 'nncb')) add('Coerência','warn','Play Through Press com No-Nonsense CB','Um central que alivia sempre quebra a construção curta.','Centre-Back ou Ball-Playing Centre-Back.');
  }
  if (bu === 2 && S.some(x => x.ip && ['bpgk','dlp'].includes(x.ip.id))) add('Coerência','info','Bypass Press desperdiça construtores','BPGK/DLP têm pouco impacto se a bola salta o meio-campo.','Balanced ou troque o papel.');
  if (tiVal(t,'goal_kicks') === 0 && gk && gk.ip && gk.ip.id === 'nngk') add('Coerência','warn','Goal Kicks curtos com No-Nonsense GK','Contradição directa.','Mixed/Long ou mude o papel.');
  const cs = tiVal(t,'crossing');
  if ((cs === 3) && !ipTag('AIR').length) add('Coerência','info','Cruzamentos altos sem referência aérea','Floated crosses sem Target Forward.','Low Crosses, ou um Target Forward/Centre Forward forte no ar.');
  if (tiVal(t,'reception') === 2 && tiVal(t,'tempo') >= 4) add('Coerência','info','Passe ao pé com ritmo muito alto','Exige Primeiro Toque e Decisões muito altos.','Baixe o tempo para Higher ou Balanced.');
  if (mi >= 5 && dl <= 1 && loe <= 1) add('Coerência','info','Mentalidade atacante com bloco baixo','Ataca com muitos mas defende muito atrás: equipa partida.','Suba linhas ou baixe a mentalidade.');
  if (mi <= 1 && loe >= 3) add('Coerência','info','Mentalidade defensiva com pressão alta','Mensagem contraditória.','Ajuste uma das duas.');

  // 10. distância IP↔OOP
  S.forEach(x => { if (x.a && x.b) { const d = Math.hypot(x.a.x - x.b.x, x.a.y - x.b.y); if (d > 38) add('Coerência','warn',`${x.s.ipCode} → ${x.s.oopCode}: transição longa`,`O jogador percorre uma grande distância entre a posição com e sem bola (${Math.round(d)}).`,'Escolha uma formação OOP mais próxima ou troque posições.'); } });

  // 11. complexidade
  const C = complexityOf(t);
  const xiPlayers = S.map(x => x.p).filter(Boolean);
  let cap = 12;
  if (xiPlayers.length >= 8) {
    const iq = avgAttr(xiPlayers, ['dec','ant','tea','pos','otb','cnt']);
    cap = iq < 10 ? 6 : iq < 12 ? 9 : iq < 14 ? 12 : 16;
    if (C.cx > cap) add('Complexidade','warn',`Tática complexa para este plantel (${C.cx} > ${cap})`,`Média tática do XI (Decisões/Antecipação/Trabalho de Equipa/…) ≈ ${iq.toFixed(1)}. No FM27 isto alonga a adaptação.`,'Remova instruções que não resolvem um problema concreto.');
    else add('Complexidade','good',`Complexidade adequada (${C.cx} ≤ ${cap})`,'O plantel deve conseguir absorver a tática.');
  } else if (C.cx > 12) add('Complexidade','warn',`Complexidade alta (${C.cx})`,'Muitas instruções fora do default: mais tempo de treino e jogadores mais capazes.','Comece simples; adicione instruções quando resolverem um problema identificado.');
  else add('Complexidade','good',`Complexidade ${C.level.toLowerCase()} (${C.cx})`,'Fácil de assimilar.');

  // 12. plantel
  if (xiPlayers.length) {
    S.forEach(x => {
      if (!x.p) return;
      const sc = slotScore(x.p, t, x.s);
      const ri = roleScore(x.p, x.ip), ro = roleScore(x.p, x.oop);
      if (sc < 50) {
        const alt = bestRolesForPlayer(x.p, x.a.group, 'IP', x.a.wideCB, 1)[0];
        add('Plantel','warn',`${x.p.name} pouco adequado em ${x.s.ipCode} (${sc})`,
          `${x.ip.name}: ${ri ? ri.score : '—'} · ${x.oop.name}: ${ro ? ro.score : '—'}.` + (Math.min(posFactor(x.p, x.a.group, x.a.side), posFactor(x.p, x.b.group, x.b.side)) < 1 ? ' Penalizado por jogar fora da posição natural (com ou sem bola).' : ''),
          alt && alt.r.id !== x.ip.id ? `Melhor papel IP para ele aqui: ${alt.r.name} (${alt.s}).` : 'Considere outro jogador.');
      }
    });
    const dcs = S.filter(x => x.a.group === 'DC' && x.p).map(x => x.p);
    const sp = avgAttr(dcs, ['pac','acc']);
    if (dl >= 3 && sp != null && sp < 12) add('Plantel','crit','Linha alta com centrais lentos',`Velocidade/Aceleração média dos centrais ≈ ${sp.toFixed(1)}.`,'Baixe a linha para Standard/Lower ou mude os centrais.');
    if (trig >= 3 || loe >= 3 || dtr === 2) {
      const ws = avgAttr(xiPlayers.filter((p, i) => true), ['wor','sta']);
      if (ws != null && ws < 12) add('Plantel','warn','Pressão exigente para o físico do XI',`Índice de Trabalho/Resistência médio ≈ ${ws.toFixed(1)}.`,'Reduza Trigger Press / LoE ou use Press Less nos Tactical Tweaks.');
    }
    if (bu === 0 && gk && gk.p) { const g = avgAttr([gk.p], ['pas','fir','cmp','kic']); if (g != null && g < 11) add('Plantel','warn','GR fraco com os pés para construção curta',`Passe/Primeiro Toque/Compostura/Pontapé ≈ ${g.toFixed(1)}.`,'Balanced/Bypass Press ou outro GR.'); }
    if (tiVal(t,'cross_eng') === 0) { const h = avgAttr(dcs, ['hea','jum','str']); if (h != null && h < 13) add('Plantel','warn','Convida cruzamentos sem centrais fortes no ar',`Cabeceamento/Impulsão/Força dos centrais ≈ ${h.toFixed(1)}.`,'Balanced ou Stop Crosses.'); }
    if (atr === 2) { const fast = xiPlayers.filter(p => (p.a.pac || 0) >= 14 || (p.a.acc || 0) >= 14).length; if (fast < 2) add('Plantel','warn','Contra-ataque sem velocidade',`Só ${fast} jogador(es) com Velocidade/Aceleração ≥ 14.`,'Hold Shape/Balanced, ou jogadores rápidos nos outlets.'); }
    if (cs === 3) { const air = xiPlayers.filter(p => (p.a.hea || 0) >= 14 && (p.a.jum || 0) >= 13).length; if (air < 2) add('Plantel','info','Cruzamentos altos com poucos jogadores aéreos',`${air} jogador(es) com Cabeceamento ≥ 14 e Impulsão ≥ 13.`,'Low Crosses.'); }
  }

  // pontuação por categoria
  const cats = ['IP','OOP','Coerência','Complexidade'].concat(xiPlayers.length ? ['Plantel'] : []);
  const pen = { crit: 25, warn: 10, info: 3, good: 0 };
  const scores = {};
  cats.forEach(c => { scores[c] = Math.max(0, 100 - F.filter(f => f.cat === c).reduce((a, f) => a + pen[f.sev], 0)); });
  const overall = Math.round(cats.reduce((a, c) => a + scores[c], 0) / cats.length);
  const order = { crit: 0, warn: 1, info: 2, good: 3 };
  F.sort((a, b) => order[a.sev] - order[b.sev]);
  return { findings: F, scores, overall, complexity: C, cap };
}

// ---------- Sugestões a partir do plantel ----------
function styleFit(players, style) {

  const seen = new Set(), uplan = plan.filter(x => !seen.has(x.ti) && seen.add(x.ti));

}

// ---------- clube maioritário de uma exportação ----------
function majorityClub(players) {
  const c = {}; players.forEach(p => { const k = p.meta && p.meta.club; if (k) c[k] = (c[k] || 0) + 1; });
  const e = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return e ? { club: e[0], share: e[1] / players.length } : { club: null, share: 0 };
}

function simModel(t) {
  const mi = MENTALITIES.indexOf(t.ment), ms = (mi - 3) * 1.5;
  const v = (k) => tiVal(t, k);
  const W = [0.8, 0.9, 1, 1.05, 1.1][v('width')];
  const prog = v('progress');
  const bs = prog === 3 ? 1 : prog === 0 ? -1 : -1;             // lado da bola (esquerda por defeito)
  const P = t.slots.map((s, i) => {
    const a = slotInfo(t.ipForm, s.ipCode), b = slotInfo(t.oopForm, s.oopCode);

  });

    const s = sideOr(p, bs);
    switch (key) {
      case 'wide': return 50 + s * 45 * W; case 'wide2': return 50 + s * 37 * W; case 'wide3': return 50 + s * 31 * W;
      case 'half': return 50 + s * 18 * Math.sqrt(W); case 'in': return 50 + s * 9; case 'in2': return 50 + s * 13;
      case 'ch': return 50 + s * 22; case 'cbw': return 50 + s * 30; case 'c': return 50;
      case 'ball': return 50 + bs * 14; case 'ballhalf': return 50 + bs * 19; default: return x;
    }
  };

    const yBase = { build: (y) => y * 0.6 + 3, prog: (y) => y * 0.85 + 8, final: (y) => Math.min(96, y * 0.75 + 25) }[ph];
    P.forEach(p => {
      let x = 50 + (p.a.x - 50) * W, y = yBase(p.a.y);
      const m = p.ip && MOVES[p.ip.id] && MOVES[p.ip.id][ph];
      if (m) { if (m.y != null) y = m.y; if (m.xs) x = 50 + (p.a.x - 50) * m.xs * (hasHB ? 1.25 : 1); if (m.x) x = xKey(p, m.x, x); }
      if (p.ip && ['fb_ip','wb_ip','awb'].includes(p.ip.id) && ph === 'final') {
        const sr = v('support_runs'); if (sr === 2) { x = xKey(p, 'wide'); y += 4; } if (sr === 0) { x = xKey(p, 'half'); y -= 2; }
      }
      if (p.a.group !== 'GK') y += ms;
      if (ph === 'prog' && v('passing') >= 3 && p.a.group === 'ST') y += 4;
      p.pos[ph] = { x: clamp(x, 5, 95), y: clamp(y, 2, 96) };
    });
  });
  // ---- bola com bola
  const byGroup = (gs) => P.filter(p => gs.includes(p.a.group));
  const gk = P.find(p => p.a.group === 'GK');
  const cbs = byGroup(['DC']).sort((p, q) => Math.abs(p.pos.build.x - (50 + bs * 30)) - Math.abs(q.pos.build.x - (50 + bs * 30)));
  const mids = byGroup(['DM','MC']).sort((p, q) => (q.ip && q.ip.tags.includes('CR') ? 1 : 0) - (p.ip && p.ip.tags.includes('CR') ? 1 : 0) || p.pos.build.y - q.pos.build.y);
  const strikers = byGroup(['ST','AMC']).sort((p, q) => (q.ip && q.ip.tags.includes('AIR') ? 1 : 0) - (p.ip && p.ip.tags.includes('AIR') ? 1 : 0) || q.pos.final.y - p.pos.final.y);
  const direct = v('passing') >= 3 || v('buildup') === 2 || v('goal_kicks') === 2;
  const holder = mids[0] || cbs[0];
  const sideWide = P.filter(p => p.a.group !== 'GK' && sideOr(p, bs) === bs).sort((p, q) => q.pos.final.y - p.pos.final.y);
  const wideProv = sideWide.find(p => p.ip && p.ip.tags.includes('W') && p.pos.final.y > 70);
  const boxTarget = [...P].filter(p => p.ip && (p.ip.tags.includes('BOX') || p.ip.tags.includes('AIR'))).sort((p, q) => q.pos.final.y - p.pos.final.y)[0] || strikers[0];
  const creator = [...P].filter(p => p.ip && p.ip.tags.includes('CR') && p.a.group !== 'GK').sort((p, q) => q.pos.final.y - p.pos.final.y)[0];
  const runner = [...P].filter(p => p.ip && p.ip.tags.includes('RUN')).sort((p, q) => q.pos.final.y - p.pos.final.y)[0] || boxTarget;
  const at = (p, ph, dx = 0, dy = 0) => p ? { x: p.pos[ph].x + dx, y: p.pos[ph].y + dy } : { x: 50, y: 50 };
  const ball = {};

  const progTarget = byGroup(['D_LR','WB_LR','M_LR','AM_LR','AMC','MC']).filter(p => sideOr(p, bs) === bs || p.a.group === 'AMC').sort((p, q) => q.pos.prog.y - p.pos.prog.y)[0];
  ball.prog = direct ? [at(holder, 'prog'), at(strikers[0], 'prog')] : [at(holder, 'prog'), at(progTarget || strikers[0], 'prog')];

  const oppFront = dLine + 8, oppBack = Math.max(80, front + 16);
  const oppAt = (k, D, F) => { const [ox, oy] = OPP_SHAPE[k]; const tt = clamp((oy - 18) / 60, 0, 1); return k === 0 ? { x: 100 - ox, y: Math.min(97, D + 10) } : { x: 100 - ox, y: D + (F - D) * tt }; };
  const oppStart = oppAt(2, oppBack, oppFront);
  const ballOOPend = trap === 2 ? { x: 50 + bs * 38, y: front + 2 } : trap === 0 ? { x: 50, y: front + 3 } : { x: 50 + bs * 20, y: front + 4 };
  ball.oop = [oppStart, ballOOPend];
  const bxo = ballOOPend.x;
  P.forEach(p => {
    const b = p.b, r = p.oop;
    let x = 50 + (b.x - 50) * 0.82 + (bxo - 50) * 0.22;
    let y;
    if (p.b.group === 'GK') y = 5 + (dl >= 3 ? 4 : 0);
    else {
      const tt = clamp((b.y - 18) / 62, 0, 1); y = dLine + (front - dLine) * tt;
    }
    const id = r && r.id, tags = r ? r.tags : [];
    if (id === 'swk') y = Math.max(8, dLine - 12); if (id === 'lhk') y = 3;
    if (tags.includes('HP')) y += 5; if (tags.includes('LOW')) y -= 3; if (tags.includes('TRK')) y -= 5;
    if (['pfb','prwb'].includes(id)) y += 6;
    if (id === 'ddm') { y = dLine + 1; x = 50; }
    if (['wcdm','wccm'].includes(id)) x = 50 + (p.sgb || -bs) * 30;
    if (['wowm','wow'].includes(id)) { y = Math.max(y, front + 5); x = 50 + (p.sgb || bs) * 42; }
    if (id === 'iow') { y = Math.max(y, front + 5); x = 50 + (p.sgb || bs) * 20; }
    if (['coam','cocf'].includes(id)) { y = Math.max(y, front + 7); x = 50; }
    if (['soam','socf'].includes(id)) { y = Math.max(y, front + 9); x = 50 + (p.sgb || bs) * 26; }
    if (id === 'tcf') y = front - 1;
    if (v('short_gk') === 1 && p.b.group === 'ST') y += 7;
    // distância mínima entre linhas: mesmo num bloco muito compacto cada linha mantém-se legível
    if (p.b.group !== 'GK') {
      const minOff = { DC:0, D_LR:0, WB_LR:0, DM:7, MC:9, M_LR:10, AMC:14, AM_LR:13, ST:18 }[p.b.group] || 0;
      y = Math.max(y, dLine + minOff - (tags.includes('TRK') ? 3 : 0));
      if (p.b.group === 'M_LR' || p.b.group === 'AM_LR') x = 50 + (x - 50) * 0.94;
    }
    p.pos.oop = { x: clamp(x, 5, 95), y: clamp(y, 2, 96) };
  });
  // pressão: os mais próximos da bola (ou com papel assertivo) saem ao portador
  const nPress = [0, 1, 1, 2, 3][trig];
  const cand = P.filter(p => p.b.group !== 'GK' && !(p.oop && p.oop.tags.includes('OUT')))
    .map(p => ({ p, d: Math.hypot(p.pos.oop.x - bxo, p.pos.oop.y - ballOOPend.y) })).sort((a, b) => a.d - b.d);
  const pressers = new Set(cand.filter(c => c.p.pos.oop.y > dLine + 6).slice(0, nPress).map(c => c.p.i));
  P.forEach(p => { if (p.oop && p.oop.tags.includes('HP') && Math.hypot(p.pos.oop.x - bxo, p.pos.oop.y - ballOOPend.y) < 30) pressers.add(p.i); });
  P.forEach(p => { if (pressers.has(p.i)) { const o = p.pos.oop; p.pos.oop = { x: o.x + (bxo - o.x) * 0.55, y: o.y + (ballOOPend.y - 3 - o.y) * 0.55 }; p.pressing = true; } });
  // ---- perda da bola
  const dtr = v('def_trans');
  P.forEach(p => {
    const f = p.pos.final, o = p.pos.oop, d = Math.hypot(f.x - lost.x, f.y - lost.y);
    let pt;
    if (dtr === 2 && d < 27 && p.a.group !== 'GK') pt = { x: f.x + (lost.x - f.x) * 0.7, y: f.y + (lost.y - 4 - f.y) * 0.7 };
    else if (dtr === 2) pt = { x: f.x, y: f.y - 4 };
    else if (dtr === 0) pt = { x: f.x + (o.x - f.x) * 0.75, y: f.y + (o.y - f.y) * 0.75 };
    else pt = d < 18 && p.a.group !== 'GK' ? { x: f.x + (lost.x - f.x) * 0.6, y: f.y + (lost.y - f.y) * 0.6 } : { x: f.x + (o.x - f.x) * 0.45, y: f.y + (o.y - f.y) * 0.45 };

  const rec = { x: bxo + (50 - bxo) * 0.3, y: Math.max(dLine + 10, front - 8) };
  P.forEach(p => {
    const o = p.pos.oop, r = p.ip, ro = p.oop;
    const runs = (r && (r.tags.includes('RUN') || r.tags.includes('BOX'))) || (ro && ro.tags.includes('OUT')) || p.a.group === 'ST';

    else if (atr === 0) pt = { x: o.x + (p.pos.build.x - o.x) * 0.6, y: o.y + (p.pos.build.y - o.y) * 0.6 };

  const OPP = { build: [64, 30], prog: [74, 44], final: [86, 60], loss: [80, 46], oop: [oppBack, oppFront], win: [70, dLine + 4] };
  const opp = {}; Object.entries(OPP).forEach(([ph, [D, F]]) => { opp[ph] = OPP_SHAPE.map((_, k) => oppAt(k, D, F)); });

  if (defY != null && midY != null && midY - defY > 21) overlays.push({ kind: 'gap', y1: defY + 2, y2: midY - 2, label: 'espaço entre linhas' });

  if (dl >= 3 && gkO && gkO.oop && gkO.oop.id !== 'swk' && loe < 2) overlays.push({ kind: 'behind', y1: 8, y2: (defY || dLine) - 2, label: 'espaço nas costas sem cobertura' });
  return { P, ball, opp, overlays, dLine, front, bs };
}

// ---------- texto de cada fase
function phaseText(t, k, M) {
  const v = (x) => tiLabel(x, tiVal(t, x));

function simStart() {
  cancelAnimationFrame(SIM.raf);
  const svg = document.querySelector('.simpitch'); if (!svg) return;
  const t = simTactic(); SIM.model = simModel(t); SIM.last = performance.now();
  simDrawStatic(t); simCaption(t);
  const tick = (now) => {
    if (!document.querySelector('.simpitch')) return;
    const sim = ST.sim, dt = Math.min(0.1, (now - SIM.last) / 1000); SIM.last = now;
    const tempo = [1.25, 1.1, 1, 0.9, 0.8][tiVal(simTactic(), 'tempo')];
    if (sim.playing) {
      sim.u += dt * sim.speed / (3.6 * tempo);
      if (sim.u >= 1) { sim.u = 0; sim.phase = (sim.phase + 1) % PHASES.length; simCaption(simTactic()); }
    }
    simFrame();
    SIM.raf = requestAnimationFrame(tick);
  };
  SIM.raf = requestAnimationFrame(tick);
}
function simRebuild() { const t = simTactic(); SIM.model = simModel(t); simDrawStatic(t); simCaption(t); }

function simDrawStatic(t) {
  const M = SIM.model, sim = ST.sim;
  const over = document.getElementById('sim-over'); if (!over) return;
  // avisos só aparecem na fase sem bola (ver simFrame)
  over.innerHTML = M.overlays.map(o => {
    const x1 = X_(o.y1), x2 = X_(o.y2); if (x2 <= x1) return '';
    return `<g class="ov" data-kind="${o.kind}"><rect x="${x1}" y="2" width="${x2 - x1}" height="68" fill="${o.kind === 'gap' ? 'rgba(255,107,90,.18)' : 'rgba(255,200,80,.16)'}" stroke="${o.kind === 'gap' ? 'rgba(255,107,90,.7)' : 'rgba(255,200,80,.7)'}" stroke-width=".3" stroke-dasharray="1 .8"/>
      <text x="${(x1 + x2) / 2}" y="5.2" text-anchor="middle" font-size="2" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.5)" stroke-width=".35" paint-order="stroke">${esc(o.label)}</text></g>`;
  }).join('');
  const tr = document.getElementById('sim-trails');
  tr.innerHTML = sim.trails || sim.focus != null ? M.P.filter(p => sim.trails || p.i === sim.focus).map(p => {
    const pts = PHASES.map(ph => `${X_(p.pos[ph.k].y)},${Y_(p.pos[ph.k].x)}`).join(' ');
    return `<polyline points="${pts} ${X_(p.pos.build.y)},${Y_(p.pos.build.x)}" fill="none" stroke="${p.i === sim.focus ? '#ffe27a' : 'rgba(255,255,255,.35)'}" stroke-width="${p.i === sim.focus ? .45 : .25}" stroke-dasharray="1 .7"/>`;
  }).join('') : '';
  document.querySelectorAll('.simp').forEach((g, i) => { const p = M.P[i]; g.dataset.ab = p.ip ? p.ip.ab : '?'; g.dataset.abo = p.oop ? p.oop.ab : '?'; });
}

function simCaption(t) {
  const el = document.getElementById('sim-cap'); if (!el) return;
  const sim = ST.sim, ph = PHASES[sim.phase], c = phaseText(t, ph.k, SIM.model);
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h3 style="margin:0">${ph.n}</h3><span class="chip ${ph.ph === 'OOP' ? 'oop' : 'ip'}">${ph.ph === 'IP' ? 'com bola' : ph.ph === 'OOP' ? 'sem bola' : 'transição'}</span></div>
    <p class="small" style="margin:.4em 0">${esc(c.text)}</p>
    ${c.notes.length ? `<ul class="clean small">${c.notes.map(n => `<li>${n}</li>`).join('')}</ul>` : ''}
    ${ph.k === 'oop' && SIM.model.overlays.length ? `<p class="small" style="color:var(--warn)"><b>Atenção:</b> ${SIM.model.overlays.map(o => esc(o.label)).join(' e ')}.</p>` : ''}`;
  document.querySelectorAll('.phases .ph').forEach((b, i) => b.classList.toggle('on', i === sim.phase));
}

function simFrame() {
  const M = SIM.model, sim = ST.sim; if (!M) return;
  const k = PHASES[sim.phase].k, kp = PHASES[(sim.phase + PHASES.length - 1) % PHASES.length].k;
  const um = ease(clamp(sim.u / 0.62, 0, 1));
  const oopish = k === 'oop' || k === 'loss' || (k === 'win' && sim.u < 0.3);
  document.querySelectorAll('.simp').forEach((g, i) => {
    const p = M.P[i]; const a = p.pos[kp], b = p.pos[k];
    const x = a.x + (b.x - a.x) * um, y = a.y + (b.y - a.y) * um;
    g.setAttribute('transform', `translate(${X_(y).toFixed(2)},${Y_(x).toFixed(2)})`);
    g.querySelector('.ab').textContent = oopish ? g.dataset.abo : g.dataset.ab;
    g.querySelector('.press').setAttribute('opacity', k === 'oop' && p.pressing && um > 0.5 ? 1 : 0);
  });
  const opp = document.querySelectorAll('#sim-opp circle');
  opp.forEach((c, i) => { const a = M.opp[kp][i], b = M.opp[k][i]; c.setAttribute('cx', X_(a.y + (b.y - a.y) * um).toFixed(2)); c.setAttribute('cy', Y_(a.x + (b.x - a.x) * um).toFixed(2)); });
  // bola: percorre os pontos da fase entre 15% e 95% do tempo
  const path = M.ball[k]; const bu = clamp((sim.u - 0.15) / 0.8, 0, 1);
  const seg = path.length - 1, f = bu * seg, j = Math.min(seg - 1, Math.floor(f)), r = ease(f - j);
  const A0 = path[j], B0 = path[j + 1] || path[j];
  const bx = A0.x + (B0.x - A0.x) * r, by = A0.y + (B0.y - A0.y) * r;
  const ball = document.getElementById('sim-ball'); ball.setAttribute('cx', X_(by).toFixed(2)); ball.setAttribute('cy', Y_(bx).toFixed(2));
  document.querySelectorAll('#sim-over .ov').forEach(o => o.style.display = k === 'oop' ? '' : 'none');
  document.querySelectorAll('.phases .ph').forEach((b, i) => { const bar = b.querySelector('i'); bar.style.width = (i === sim.phase ? sim.u * 100 : i < sim.phase ? 100 : 0) + '%'; });
}

// ---------- Melhor XI: adequação, instruções recomendadas, suplentes, sucessores ----------
function vXI() {
  const ps = players(), t = ST.tactic;
  if (ps.length < 11) return `<div class="panel empty"><h3>Carregue o plantel primeiro</h3><p>Com o plantel, a app escolhe o melhor XI para a tua tática, recomenda instruções individuais pelos atributos e mostra suplentes e sucessores para cada posição.</p>
    <button class="btn primary" onclick="A.tab('team','squad')">Ir para Plantel</button> <button class="btn" onclick="A.sampleSquad();A.tab('team','xi')">Usar exemplo</button></div>`;
  const pm = Object.fromEntries(ps.map(p => [p.id, p]));
  const bs = benchAndSuccessors(t, ps);
  const rows = t.slots.map((s, i) => {
    const a = slotInfo(t.ipForm, s.ipCode), p = pm[s.pid], ri = ROLE_BY_ID[s.ip], ro = ROLE_BY_ID[s.oop];
    const sc = p ? slotScore(p, t, s) : null;
    const alt = p ? bestRolesForPlayer(p, a.group, 'IP', a.wideCB, 1)[0] : null;
    const cur = p ? (roleScore(p, ri) || { score: 0 }).score : 0;
    const recs = p ? recommendPIs(p, ri, ro, a.group) : [];
    const b = bs[i];
    return `<tr><td><b>${esc(s.ipCode)}</b></td>
      <td>${p ? `${fitBadge(sc)} <b>${esc(p.name)}</b>${p.age ? ` <span class="muted small">${p.age}a</span>` : ''}` : '<span class="muted">vazio</span>'}
        <div class="small muted">${esc(ri.name)} / ${esc(ro.name)}${alt && alt.r.id !== ri.id && alt.s >= cur + 5 ? ` · <span style="color:var(--warn)">melhor como ${esc(alt.r.name)} (${alt.s})</span>` : ''}</div></td>
      <td>${recs.map(r => (s.pis || []).includes(r.pi) ? `<span class="chip ip" title="${esc(r.why)}">✓ ${esc(r.pi)}</span>` : `<button class="chip btnchip" title="${esc(r.why)}" onclick="A.applyPI(${i}, '${r.pi.replace(/'/g, "\\'")}')">+ ${esc(r.pi)}</button>`).join('') || '<span class="muted small">—</span>'}</td>
      <td class="small">${b.bench ? `${esc(b.bench.p.name)} ${fitBadge(b.bench.sc)}` : '—'}</td>
      <td class="small">${b.succ ? `${esc(b.succ.p.name)} <span class="muted">${b.succ.p.age}a</span> ${fitBadge(b.succ.sc)}` : '—'}</td></tr>`;
  }).join('');
  return `<div class="top"><div><h2>Melhor XI — ${esc(t.name)}</h2><p class="muted small" style="margin:0">Passe o rato numa instrução para ver porquê. As instruções aplicadas entram na tática e na Ficha para o FM27.</p></div>
    <div class="row"><button class="btn" onclick="A.autoXI()">Escolher XI automaticamente</button><button class="btn primary" onclick="A.applyAllPIs()">Aplicar a principal de cada jogador</button></div></div>
  <div class="grid" style="grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start">
    <div class="panel">${pitchSVG(t, 'IP', null, { static: true })}<p class="small muted">Cor = adequação ao par de papéis (verde ≥ 70).</p></div>
    <div class="table-wrap" style="max-height:none"><table><thead><tr><th>Pos</th><th>Jogador e papéis</th><th>Instruções recomendadas</th><th>Suplente</th><th>Sucessor (≤ 21)</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  ${vSuggest()}`;
}

function vSlotEditor(i) {

  const ipRoles = rolesFor(a.group, 'IP', a.wideCB), oopRoles = rolesFor(b.group, 'OOP', b.wideCB);
  const lab = (r) => { const sc = p ? (roleScore(p, r) || {}).score : null; return r.name + (sc != null ? ` — ${sc}` : ''); };
  const ri = ROLE_BY_ID[s.ip], ro = ROLE_BY_ID[s.oop];

// ============================================================
// Acções (ligadas aos botões da interface)
// ============================================================
const A = {
  go(v, tab) { ST.view = v; if (tab && ST.tabs[v] !== undefined) ST.tabs[v] = tab; save(); render(true); },
  tab(v, tab) { ST.view = v; ST.tabs[v] = tab; save(); render(true); },
  theme(v) { ST.theme = v; applyTheme(); save(); render(); },
  // tática
  setName(v) { ST.tactic.name = v; save(); },
  setMent(v) { ST.tactic.ment = v; save(); render(); },
  setForm(phase, v) {
    const t = ST.tactic;
    ST.tactic = retargetTactic(t, phase === 'IP' ? v : t.ipForm, phase === 'OOP' ? v : t.oopForm);
    ST.sel = null; save(); render();
  },
  setTI(k, v) { const d = TI_BY_KEY[k].def; v = +v; if (v === d) delete ST.tactic.ti[k]; else ST.tactic.ti[k] = v; save(); render(); },
  resetTI() { ST.tactic.ti = {}; save(); render(); toast('Instruções repostas'); },
  sel(i) { ST.sel = ST.sel === i ? null : i; render(); },
  pitch(m) { ST.pitchMode = m; render(); },
  setRole(i, phase, id) { ST.tactic.slots[i][phase === 'IP' ? 'ip' : 'oop'] = id; save(); render(); },
  setPlayer(i, pid) {
    const t = ST.tactic; const other = t.slots.findIndex((s, j) => j !== i && s.pid === pid && pid);
    if (other >= 0) t.slots[other].pid = t.slots[i].pid; // troca
    t.slots[i].pid = pid || null; save(); render();
  },
  togglePI(i, j) { const n = PLAYER_INSTRUCTIONS[j].n; const s = ST.tactic.slots[i]; s.pis = s.pis || []; const k = s.pis.indexOf(n); if (k >= 0) s.pis.splice(k, 1); else s.pis.push(n); save(); render(); },
  setOIs(v) { ST.tactic.ois = Math.max(0, +v || 0); save(); render(); },
  autoXI() { if (players().length < 11) return toast('Precisa de pelo menos 11 jogadores no plantel'); autoPickXI(ST.tactic, players()); save(); render(); toast('XI escolhido pela melhor adequação'); },
  clearXI() { ST.tactic.slots.forEach(s => s.pid = null); save(); render(); },
  newTactic() { ST.tactic = newTactic(ST.tactic.ipForm, ST.tactic.oopForm); ST.sel = null; save(); render(); },
  saveTactic() { const c = JSON.parse(JSON.stringify(ST.tactic)); c.savedAt = new Date().toISOString(); ST.saved = ST.saved.filter(x => x.name !== c.name); ST.saved.unshift(c); save(); render(); toast('Tática guardada: ' + c.name); },
  loadSaved(i) { ST.tactic = JSON.parse(JSON.stringify(ST.saved[i])); ST.sel = null; save(); A.go('tactic', 'analyze'); },
  delSaved(i) { ST.saved.splice(i, 1); save(); render(); },
  exportTactic() { download((ST.tactic.name || 'tatica').replace(/[^\w\-]+/g, '_') + '.fm27tb.json', JSON.stringify({ kind: 'fm27tb-tactic', v: 1, tactic: ST.tactic }, null, 2)); },
  importJSON(input) {
    const f = input.files[0]; if (!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      ingestJSON(d, f.name);
    }).catch(() => toast('JSON inválido'));
  },
  useTemplate(id) { const tp = TEMPLATES.find(x => x.id === id); ST.tactic = tacticFromTemplate(tp); if (players().length >= 11) autoPickXI(ST.tactic, players()); ST.sel = null; save(); A.go('tactic', 'analyze'); },
  useSuggestion(i) { ST.tactic = JSON.parse(JSON.stringify(ST.sugg[i].t)); ST.sel = null; save(); A.go('tactic', 'analyze'); },
  applyPI(i, n) { const s = ST.tactic.slots[i]; s.pis = s.pis || []; if (!s.pis.includes(n)) s.pis.push(n); save(); render(); toast(n + ' aplicado'); },
  applyAllPIs() { const pm = Object.fromEntries(players().map(p => [p.id, p])); let n = 0;
    ST.tactic.slots.forEach(s => { const a = slotInfo(ST.tactic.ipForm, s.ipCode); recommendPIs(pm[s.pid], ROLE_BY_ID[s.ip], ROLE_BY_ID[s.oop], a.group).slice(0, 1).forEach(r => { s.pis = s.pis || []; if (!s.pis.includes(r.pi)) { s.pis.push(r.pi); n++; } }); });
    save(); render(); toast(n + ' instruções aplicadas (a principal de cada jogador — mais instruções = mais complexidade)'); },
  applyPlan(list) { const rep = ST._oppRep; if (!rep) return; const items = list === 'all' ? rep.plan : [rep.plan[list]];
    items.forEach(x => { const d = TI_BY_KEY[x.ti]; if (x.v === d.def) delete ST.tactic.ti[x.ti]; else ST.tactic.ti[x.ti] = x.v; });
    save(); render(); toast(items.length === 1 ? `${TI_BY_KEY[items[0].ti].n}: ${TI_BY_KEY[items[0].ti].opts[items[0].v]}` : 'Plano aplicado à tática'); },
  clearOpp() { ST.opp = EMPTY_SQUAD(); save(); render(); },
  setMyClub(v) { ST.myClub = v || null; save(); render(); },
  autoToggle() { ST.auto.on = !ST.auto.on; save(); render(); if (ST.auto.on) desktopPoll(true); },
  autoDir(v) { ST.auto.dir = v.trim(); ST.auto.mtime = 0; save(); desktopPoll(true); },
  autoNow() { ST.auto.mtime = 0; desktopPoll(true); },
  saveNow() { savePoll(true); },
  saveToggle() { ST.auto.save = !ST.auto.save; save(); render(); if (ST.auto.save) savePoll(); },
  saveDir(v) { ST.auto.saveDir = v.trim(); ST.auto.saveMtime = 0; save(); savePoll(true); },
  // campo animado
  simOpen() { const s = simDefaults(); Object.assign(s, { src: 'tactic', t: null, focus: null, hl: null, title: '' }); A.go('tactic', 'sim'); },
  roleDemo(id) {
    const r = ROLE_BY_ID[id], d = demoTacticForRole(r), s = simDefaults();
    Object.assign(s, { src: 'demo', t: d.t, focus: d.idx, hl: null, title: 'Como joga: ' + r.name, phase: r.phase === 'IP' ? 0 : 4, u: 0 });
    A.go('tactic', 'sim');
  },
  tiDemo(k) {
    const s = simDefaults();
    Object.assign(s, { src: 'demo', t: JSON.parse(JSON.stringify(ST.tactic)), focus: null, hl: k, title: 'Instrução: ' + TI_BY_KEY[k].n, phase: TI_PHASE[k] ?? 0, u: 0 });
    A.go('tactic', 'sim');
  },
  simBack() { Object.assign(ST.sim, { src: 'tactic', t: null, focus: null, hl: null }); render(true); },
  simPlay() { ST.sim.playing = !ST.sim.playing; const b = document.getElementById('sim-play'); if (b) { b.textContent = ST.sim.playing ? '❚❚ Pausar' : '▶ Reproduzir'; b.setAttribute('aria-label', ST.sim.playing ? 'Pausar' : 'Reproduzir'); } },
  simPhase(i) { ST.sim.phase = i; ST.sim.u = 0; simCaption(simTactic()); },
  simSpeed(v) { ST.sim.speed = v; render(); },
  simFocus(i) { ST.sim.focus = ST.sim.focus === i ? null : i; render(); },
  simToggle(k) { ST.sim[k] = !ST.sim[k]; render(); },
  simTI(k, v) { const t = simTactic(), d = TI_BY_KEY[k].def; v = +v; if (v === d) delete t.ti[k]; else t.ti[k] = v; if (ST.sim.src === 'tactic') save(); simRebuild(); },
  simMent(v) { simTactic().ment = v; if (ST.sim.src === 'tactic') save(); simRebuild(); },
  simRole(phase, id) { simTactic().slots[ST.sim.focus][phase === 'IP' ? 'ip' : 'oop'] = id; if (ST.sim.src === 'tactic') save(); render(); },
  // .fmf
  async fmf(input) {
    const f = input.files ? input.files[0] : input; if (!f) return;
    ST.fmf = { loading: true, name: f.name }; render();
    try { ST.fmf = await inspectFmf(f); } catch (e) { ST.fmf = { error: String(e), name: f.name }; }
    render();
  },
  fmfStrings() { if (!ST.fmf) return; download(ST.fmf.name + '.strings.txt', ST.fmf.strings.join('\n'), 'text/plain'); },
  fmfApplyHints() {
    const r = ST.fmf; if (!r) return;
    const m = r.matches.mentality[0]; if (m) ST.tactic.ment = m;
    ST.tactic = newTactic(ST.tactic.ipForm, ST.tactic.oopForm); if (m) ST.tactic.ment = m;
    ST.tactic.name = r.name.replace(/\.fmf$/i, ''); ST.tactic.source = 'fmf';
    save(); ST.sel = null; A.go('tactic', 'analyze'); toast('Tática criada — escolha formações, papéis e instruções como no jogo.');
  },
  // plantel
  squadText(force) { const txt = document.getElementById('sqtext').value; ingestSquadText(txt, 'texto colado', { force }); render(); },
  squadFile(input, force) { const f = input.files[0]; if (!f) return; f.text().then(txt => { ingestSquadText(txt, f.name, { force }); render(); }); },
  sampleSquad() { ST.squad = { ...EMPTY_SQUAD(), players: makeSample(), source: 'exemplo (fictício)' }; ST.myClub = null; ST.sugg = null; autoPickXI(ST.tactic, ST.squad.players); save(); render(); toast('Plantel de exemplo carregado (fictício)'); },
  clearSquad() { ST.squad = EMPTY_SQUAD(); ST.myClub = null; ST.tactic.slots.forEach(s => s.pid = null); ST.sugg = null; save(); render(); },
  runSuggest() { ST.sugg = suggestTactics(players()); render(); },
  // bíblia
  rq(v) { ST.rq = v; render(); const el = document.getElementById('rq'); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } },
  rg(v) { ST.rg = v; render(); }, rp(v) { ST.rp = v; render(); },
  // dados
  exportAll() { download('fm27tb_backup.json', JSON.stringify({ kind: 'fm27tb-all', v: 1, tactic: ST.tactic, squad: ST.squad, saved: ST.saved }, null, 2)); },
  wipe() { if (!confirm('Apagar tática, plantel e táticas guardadas deste computador?')) return; localStorage.removeItem(STORE_KEY); location.reload(); },
  print() { window.print(); },
  copySheet() { const txt = sheetText(ST.tactic); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Ficha copiada'), () => download((ST.tactic.name || 'tatica') + '.txt', txt, 'text/plain')); },
};
