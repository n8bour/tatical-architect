<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM27 Tactical Bible</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
:root{
  --bg:#f3f5f2; --panel:#ffffff; --panel2:#eef1ec; --line:#d9ded6; --text:#17201a; --muted:#5d6b61;
  --accent:#0f7b4f; --accent2:#0a5c3a; --accent-ink:#ffffff; --pitch:#2f7d4f; --pitch2:#2a7248; --pitchline:rgba(255,255,255,.75);
  --good:#1c8a4d; --warn:#b7791f; --crit:#c2412d; --info:#3b6ea8; --chip:#e4eae1;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --panel:#151d18; --panel2:#1b251f; --line:#27342c; --text:#e4ece6; --muted:#90a196;
    --accent:#2fbf7f; --accent2:#5fd6a0; --accent-ink:#06130c; --pitch:#1d4d33; --pitch2:#1a452e; --pitchline:rgba(255,255,255,.55);
    --good:#3cc47b; --warn:#e0a640; --crit:#ef6a55; --info:#6fa3e0; --chip:#223028;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --panel:#151d18; --panel2:#1b251f; --line:#27342c; --text:#e4ece6; --muted:#90a196;
  --accent:#2fbf7f; --accent2:#5fd6a0; --accent-ink:#06130c; --pitch:#1d4d33; --pitch2:#1a452e; --pitchline:rgba(255,255,255,.55);
  --good:#3cc47b; --warn:#e0a640; --crit:#ef6a55; --info:#6fa3e0; --chip:#223028;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
h1{font-size:28px} h2{font-size:21px} h3{font-size:16px} h4{font-size:14px}
p{margin:.3em 0 .7em}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:230px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:4px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:10.5px;letter-spacing:-.02em}
.brand b{display:block;font-size:14px}.brand span{font-size:11px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted)}
.nav-btn:hover{background:var(--panel2);color:var(--text)}
.nav-btn.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav-sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 12px 4px}
.aside-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px 12px}
main{overflow:auto;padding:22px 28px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.muted{color:var(--muted)} .small{font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:16px;align-items:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
select,input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:160px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f select,label.f input{color:var(--text);font-size:14px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
.chip.ip{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.chip.oop{background:color-mix(in srgb,var(--info) 20%,transparent)}
.chip.new{background:color-mix(in srgb,var(--warn) 25%,transparent)}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle}
.tag.v{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.tag.e{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pitch-wrap{position:relative}
svg.pitch{width:100%;height:auto;display:block;border-radius:10px}
.pitch .slot{cursor:pointer}
.pitch .slot:hover circle.dot{stroke:#fff;stroke-width:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.score-ring{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.bars{flex:1;display:grid;gap:6px}
.bar{display:grid;grid-template-columns:100px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.bar .t{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:9px}
.finding{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.sev{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.sev.crit{background:var(--crit)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}.sev.good{background:var(--good)}
.finding b{display:block}.finding .fix{font-size:12px;color:var(--accent);margin-top:2px}
.ti-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ti{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.ti.changed{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ti .h{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:13px}
.ti select{width:100%;margin:6px 0 4px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
details p{font-size:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.table-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
.fit{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 5px;font-weight:700;font-size:12px;color:#fff}
.role-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.role-card .attrs{font-size:12px;margin-top:6px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--panel2)}
.drop.over{border-color:var(--accent)}
.notice{border-left:3px solid var(--info);background:color-mix(in srgb,var(--info) 9%,transparent);padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0}
.notice.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px}
.kv span{color:var(--muted)}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.step{display:flex;gap:12px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
ul.clean{margin:.3em 0;padding-left:18px} ul.clean li{margin:.25em 0}
@media (max-width:1100px){.split,.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{display:none}.g2,.g3,.g4{grid-template-columns:1fr}main{padding:14px}}
@media print{aside,.no-print{display:none!important}.app{display:block;height:auto}main{overflow:visible}}

/* ---------- campo animado ---------- */
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.simwrap{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:var(--pitch)}
svg.simpitch{display:block;width:100%;height:auto}
.simp{cursor:pointer}
.simp:focus-visible{outline:none}
.simbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;justify-content:space-between}
.phases{display:flex;flex:1 1 100%;order:3;gap:4px}
.phases .ph{flex:1;position:relative;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 4px 9px;cursor:pointer;font-size:12px;overflow:hidden;text-align:center;line-height:1.25}
.phases .ph i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent)}
.phases .ph.OOP i{background:var(--info)} .phases .ph.T i{background:var(--warn)}
.phases .ph.on{border-color:var(--accent);font-weight:600}
.simcap h3{font-size:17px}
.simside label.f.hl{outline:2px solid var(--warn);outline-offset:3px;border-radius:6px}
@media (max-width:1180px){.simgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.phases .ph i{transition:none}}
.simgrid>div{min-width:0}
.phases .ph{min-width:0}
@media (max-width:760px){.phases{flex-wrap:wrap}.phases .ph{flex:1 1 30%}}

.sheet td:first-child{width:24px}
.sheet input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
@media print{.sheet{grid-template-columns:1fr 1fr!important}.panel{box-shadow:none;break-inside:avoid}}

/* ---------- v3: navegação, estado, cartões guiados ---------- */
.nav-btn .ic{width:18px;text-align:center}
.aside-status{margin-top:18px;padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle}
.dot.ok{background:var(--good)}
.step-card .n{width:30px;height:30px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.step-card.done .n{background:var(--good);color:#fff}
.step-card{display:flex;flex-direction:column}
.step-card .row:last-child{margin-top:auto}
.recs{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--panel2)}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btnchip{border:1px dashed var(--accent);background:transparent;cursor:pointer;color:var(--text)}
.btnchip:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.oppbar{display:grid;grid-template-columns:170px 1fr 38px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.oppbar .t{position:relative;height:9px;background:var(--panel2);border-radius:9px}
.oppbar .t i{display:block;height:100%;border-radius:9px}
.oppbar .t em{position:absolute;top:-4px;width:3px;height:17px;background:var(--text);border-radius:2px;transform:translateX(-1px)}
#dropov{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 22%,transparent);border:3px dashed var(--accent);display:none;place-items:center;z-index:20;pointer-events:none;font-size:22px;font-weight:700;color:var(--text)}
#dropov.on{display:grid}
main>.tabs{position:sticky;top:-22px;background:var(--bg);z-index:3;padding-top:4px}
.panel.grid{align-content:start}

.sp-fig{margin:0 0 10px}.sp-svg{width:100%;height:auto;display:block;border-radius:10px}

.chips{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow:auto;padding:2px}
.chip.pick{border:1px solid var(--line);cursor:pointer;background:var(--panel)}
.chip.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.genopt{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;gap:0 10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
.genopt>svg{grid-column:2;grid-row:1/4;align-self:center}
.genopt.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.secn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;margin-right:8px;vertical-align:middle}
tr.dim td{color:var(--muted)}
.depth{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

/* ---------- laboratório ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:10px}
.kpis div{background:var(--panel2);border-radius:8px;padding:8px 10px;min-width:0}
.kpis span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis b{font-size:15px;white-space:nowrap}.kpis em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.verdict{border-left:4px solid var(--info)}.verdict.good{border-left-color:var(--good)}.verdict.crit{border-left-color:var(--crit)}.verdict.warn{border-left-color:var(--warn)}
.cibar{position:relative;height:14px;background:var(--panel2);border-radius:7px;margin:6px 0 4px;overflow:hidden}
.cibar .zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.cibar b{position:absolute;top:3px;height:8px;border-radius:4px;opacity:.85}
.cibar em{position:absolute;top:0;width:3px;height:14px;background:var(--text);transform:translateX(-1px)}
.progress{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--accent)}
.jobitem{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;margin:6px 0;cursor:pointer}
.jobitem b{display:block}.jobitem.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.jobitem .st{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);margin-right:6px}
.jobitem .st.running,.jobitem .st.queued{background:color-mix(in srgb,var(--warn) 25%,transparent)}.jobitem .st.complete{background:color-mix(in srgb,var(--good) 22%,transparent)}
@media (max-width:1400px){.lab-vars{grid-template-columns:1fr!important}}

/* ---------- v4.0.1: nada transborda a sua coluna ---------- */
/* itens de grelha podem encolher (por defeito o mínimo é o conteúdo, o que empurrava colunas) */
.grid>*,.split>*,.simgrid>*,.hero>*{min-width:0}
/* menus e campos acompanham a coluna em vez de a esticarem pela opção mais comprida */
label.f select,label.f input,.f select{width:100%;min-width:0}
select{min-width:0;text-overflow:ellipsis}
/* escolhas com nomes longos */
.chip.pick{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* campos desenhados com tamanho máximo, centrados (ecrãs largos) */
svg.pitch{max-width:420px;margin-inline:auto}
.g2>div>svg.pitch{max-width:380px}
/* tabelas largas fazem scroll dentro do seu painel */
.panel table{max-width:100%}
.panel>table,.panel>div>table{display:block;overflow-x:auto}
#main>*{max-width:1800px;margin-left:auto;margin-right:auto}

/* ---------- v4.1: painéis recolhíveis e menu só com ícones ---------- */
.pc-title{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.pc-toggle{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12px;line-height:1;display:inline-grid;place-items:center;cursor:pointer}
.pc-toggle:hover{color:var(--text);border-color:var(--accent)}
.pc-toggle:focus-visible,.nav-btn:focus-visible,.btn:focus-visible,.nav-mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel.collapsed>*:not(:first-child){display:none!important}
.panel.collapsed{padding-bottom:12px}
.brand{position:relative}
.nav-mini{margin-left:auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;flex:none}
.nav-mini:hover{color:var(--text)}
.nav-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{transition:grid-template-columns .15s}
.app.mini{grid-template-columns:64px 1fr}
.app.mini aside{padding:16px 8px;align-items:center}
.app.mini .brand{flex-direction:column;padding:4px 0 12px;gap:8px}
.app.mini .brand .lbl,.app.mini .nav-btn .lbl,.app.mini .aside-status,.app.mini .aside-foot{display:none}
.app.mini .nav-btn{justify-content:center;padding:10px 0;width:44px}
.app.mini .nav-btn .ic{width:auto;font-size:16px}
/* ecrãs estreitos (ex.: 1366 com escala 125%): menu só com ícones automaticamente */
@media (max-width:1150px) and (min-width:761px){
  .app{grid-template-columns:64px 1fr}
  aside{padding:16px 8px;align-items:center}
  .brand{flex-direction:column;padding:4px 0 12px;gap:8px}
  .brand .lbl,.nav-btn .lbl,.aside-status,.aside-foot,.nav-mini{display:none}
  .nav-btn{justify-content:center;padding:10px 0;width:44px}
}
/* títulos longos nunca empurram os botões do cabeçalho */
.top>div:first-child{min-width:0;flex:1 1 320px}
.top h2{overflow-wrap:anywhere}
.row{min-width:0}

/* ---------- v4.2: actividade (loading) ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
#topbar.on{opacity:1}
#topbar i{display:block;height:100%;width:30%;background:var(--accent);border-radius:0 3px 3px 0}
#topbar.on:not(.det) i{animation:fm-indet 1.2s ease-in-out infinite}
#topbar.det i{transition:width .3s}
@keyframes fm-indet{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
#busy{display:none;flex-direction:column;gap:8px;margin-top:14px;width:100%}
#busy.on{display:flex}
.busy-item{display:flex;gap:9px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:9px 10px;min-width:0}
.busy-pct{display:none;font-size:10px;font-weight:700}
.busy-body{min-width:0;display:grid;gap:4px}
.busy-body b{font-size:13px;overflow-wrap:anywhere}
.busy-bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;width:100%}
.busy-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.spin{flex:none;width:16px;height:16px;margin-top:2px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:fm-spin .8s linear infinite}
@keyframes fm-spin{to{transform:rotate(360deg)}}
.btn.is-busy{position:relative;color:transparent!important;pointer-events:none}
.btn.is-busy::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid currentColor;border-color:var(--line);border-top-color:var(--accent);animation:fm-spin .8s linear infinite}
.btn.primary.is-busy::after{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.btn:disabled{cursor:progress}
@media (prefers-reduced-motion: reduce){#topbar.on:not(.det) i{animation:none;width:100%;opacity:.6}.spin,.btn.is-busy::after{animation-duration:2.4s}}

/* menu só com ícones: a actividade fica um spinner (com a percentagem) e o detalhe no tooltip */
.app.mini #busy .busy-body{display:none}
.app.mini .busy-item{flex-direction:column;align-items:center;padding:8px 4px;width:44px;gap:4px}
.app.mini .busy-pct{display:block}
@media (max-width:1150px) and (min-width:761px){#busy .busy-body{display:none}.busy-item{flex-direction:column;align-items:center;padding:8px 4px;width:44px;gap:4px}.busy-pct{display:block}}
@media (max-width:760px){#busy{position:fixed;left:12px;right:12px;bottom:12px;z-index:25;margin:0}}

/* ---------- integrações ---------- */
.integ{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);margin:8px 0}
.integ-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.integ p{margin:.4em 0}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.pill.no{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.pill:empty{display:none}
a.btn{text-decoration:none;color:inherit;display:inline-block}

/* ---------- clips da Bíblia ---------- */
.clip{margin:10px 0 0}
.clip-box{border-radius:10px;overflow:hidden;background:var(--pitch);max-width:420px}
.clip-svg{display:block;width:100%;height:auto}
.clip figcaption{margin-top:5px;color:var(--muted)}
.clip-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.clip-pair .clip{margin:0}.clip-pair .clip-box{max-width:none}
tr.cliprow td{background:var(--panel2)}
.btn.ghost{background:transparent}

/* ---------- sinergia ofensiva ---------- */
.syn-top{display:flex;gap:14px;align-items:center}
.syn-map{width:100%;height:auto;display:block;border-radius:10px}
.syn-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;color:var(--muted)}
.syn-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 28px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.bar-row .bar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}.bar-row .bar i{display:block;height:100%}
.bar-row b{text-align:right}

.syn-phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.syn-phase{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);min-width:0}
.syn-score{font-size:20px;font-weight:800}

/* ---------- situações de jogo ---------- */
.plan-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.plan-tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;cursor:pointer;font:inherit;font-size:13px;color:var(--text)}
.plan-tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plan-sec{margin-top:14px}.plan-sec h4{margin:0 0 6px}
.up{color:var(--good)}.down{color:var(--crit)}

// ---- i18n/i18n.js
// ============================================================
// Idiomas: inglês por defeito, português como alternativa.
//  • L(pt, en): texto dinâmico escrito nas duas línguas na origem (motor, mensagens com nomes)
//  • T(texto): dicionário PT→EN para texto fixo (interface, Bíblia); números são substituídos
//    por '#' na chave e repostos na tradução (ex.: 'Plantel: # jogadores')
//  • translateDOM(raiz): aplica T a todos os textos e atributos visíveis depois de desenhar
// ============================================================
let LANG = 'en';

const EN_DICT = new Map();
const EN_NUM = /[+−-]?\d+(?:[.,]\d+)?/g;
function addEN(obj) { for (const [k, v] of Object.entries(obj)) EN_DICT.set(k, v); }
// Em português: os termos do FM (papéis, instruções, opções…) passam aos nomes portugueses, também dentro de frases.
let PT_RE = null;
function ptTerms(s) {
  if (typeof PT_TERMS === 'undefined') return s;
  const tr = s.trim(); if (PT_EXACT_ONLY[tr]) return s.replace(tr, PT_EXACT_ONLY[tr]);
  if (!PT_RE) {
    const ks = Object.keys(PT_TERMS).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    PT_RE = new RegExp('(?<![A-Za-z\\-])(' + ks.join('|') + ')(?![A-Za-z])', 'g');
  }
  return s.replace(PT_RE, m => PT_TERMS[m]).replace(/\(default\)/g, '(padrão)');
}
function T(s) {
  if (s == null) return s;
  if (LANG === 'pt') return ptTerms(String(s));
  if (LANG !== 'en') return s;
  const str = String(s), m = str.match(/^(\s*)([\s\S]*?)(\s*)$/), core = m[2];
  if (!core) return str;
  let t = EN_DICT.get(core);
  if (t === undefined) {   // prefixo simbólico: '💡 texto', '→ texto', '— texto', '· texto'…
    const pm = core.match(/^([💡→✓■▶—·•+!▲❚]+\s*)([\s\S]+)$/u);
    if (pm) { const rest = T(pm[2]); if (rest !== pm[2]) return m[1] + pm[1] + rest + m[3]; }
  }
  if (t === undefined && /\d/.test(core)) {
    const nums = []; const key = core.replace(EN_NUM, x => { nums.push(x); return '#'; });
    const tpl = EN_DICT.get(key);
    if (tpl !== undefined) { let i = 0; t = tpl.replace(/#/g, () => (i < nums.length ? nums[i++] : '#')); }
  }
  if (t === undefined) { for (const [re, rep] of EN_RX) { if (re.test(core)) { t = core.replace(re, rep); break; } } }
  return t === undefined ? str : m[1] + t + m[3];
}

];
const TR_ATTRS = ['title', 'placeholder', 'aria-label'];
function translateDOM(root) {
  if (!root || (LANG !== 'en' && LANG !== 'pt')) return;
  // em português, os blocos marcados data-gameterms="en" (Ficha para o FM27) mantêm os nomes como no jogo em inglês
  const keep = (n) => LANG === 'pt' && n.parentElement && n.parentElement.closest('[data-gameterms="en"]');

  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) { const v = n.nodeValue; if (v && /\S/.test(v)) { const t = T(v); if (t !== v) n.nodeValue = t; } }

}
const LOCALE = () => (LANG === 'en' ? 'en-GB' : 'pt-PT');

;

function groupOf(code, formation) {
  if (code === 'GK') return 'GK';
  if (code === 'DL' || code === 'DR') return 'D_LR';
  if (code.startsWith('DC')) return 'DC';
  if (code.startsWith('WB')) return 'WB_LR';
  if (code.startsWith('DM')) return 'DM';
  if (code === 'ML' || code === 'MR') return 'M_LR';
  if (code.startsWith('MC')) return 'MC';
  if (code === 'AML' || code === 'AMR') return 'AM_LR';
  if (code.startsWith('AMC')) return 'AMC';
  if (code.startsWith('ST')) return 'ST';
  return 'MC';
}
function isWideCB(code, formation) {
  const slots = FORMATIONS[formation] || [];
  const nCB = slots.filter(s => s.code.startsWith('DC')).length;
  return nCB >= 3 && (code === 'DCL' || code === 'DCR');
}
function sideOf(x) { return x < 33 ? 'L' : x > 67 ? 'R' : 'C'; }

// ---------- Algoritmo húngaro (minimização, n linhas ≤ m colunas) ----------
function hungarian(cost) {
  const n = cost.length; if (!n) return [];
  const m = cost[0].length;
  const INF = 1e18, u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0);
  const p = new Array(m + 1).fill(0), way = new Array(m + 1).fill(0);

    do {
      used[j0] = true; const i0 = p[j0]; let delta = INF, j1 = 0;
      for (let j = 1; j <= m; j++) if (!used[j]) {
        const cur = cost[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      for (let j = 0; j <= m; j++) { if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta; }
      j0 = j1;
    } while (p[j0] !== 0);
    do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
  }
  const res = new Array(n).fill(-1);
  for (let j = 1; j <= m; j++) if (p[j]) res[p[j] - 1] = j - 1;
  return res;
}

  });
  if (t.ois) { cx += t.ois * 0.5; parts.push([L(`${t.ois} instruções de adversário`, `${t.ois} opposition instructions`), t.ois * 0.5]); }

function suggestTactics(players) {

function benchAndSuccessors(t, players) {
  const used = new Set(t.slots.map(s => s.pid).filter(Boolean));
  const rest = players.filter(p => !used.has(p.id));
  return t.slots.map(s => {
    const ranked = rest.map(p => ({ p, sc: slotScore(p, t, s) })).sort((a, b) => b.sc - a.sc);
    const bench = ranked[0] && ranked[0].sc >= 30 ? ranked[0] : null;
    // sucessor: jovem que já serve minimamente para a posição (não um GR num lugar de campo)
    const succ = ranked.find(x => x.p.age != null && x.p.age <= 21 && x.sc >= 40) || null;
    return { bench, succ };
  });
}

function opponentXI(oppPlayers) {
  const tp = TEMPLATES.find(x => x.id === 'balanced4231') || TEMPLATES[0];
  const t = tacticFromTemplate(tp);
  autoPickXI(t, oppPlayers);
  const pm = Object.fromEntries(oppPlayers.map(p => [p.id, p]));
  return t.slots.map(s => ({ p: pm[s.pid], code: s.ipCode, group: slotInfo(t.ipForm, s.ipCode).group, side: slotInfo(t.ipForm, s.ipCode).side })).filter(x => x.p);
}
function myXI(t, players) {
  const pm = Object.fromEntries(players.map(p => [p.id, p]));
  let tt = t;
  if (t.slots.filter(s => pm[s.pid]).length < 9 && players.length >= 11) { tt = JSON.parse(JSON.stringify(t)); autoPickXI(tt, players); }
  return tt.slots.map(s => ({ p: pm[s.pid], code: s.ipCode, group: slotInfo(tt.ipForm, s.ipCode).group, side: slotInfo(tt.ipForm, s.ipCode).side })).filter(x => x.p);
}

function opponentReport(t, myPlayers, oppPlayers) {
  const them = opponentXI(oppPlayers), us = myPlayers.length ? myXI(t, myPlayers) : [];
  const pick = (xi, gs) => xi.filter(x => gs.includes(x.group)).map(x => x.p);
  const sectors = OPP_SECTORS.map(s => {
    const tv = avgPlayers(pick(them, s.them), s.a), uv = us.length ? avgPlayers(pick(us, s.us), s.ua) : null;
    return { ...s, tv, uv, diff: tv != null && uv != null ? uv - tv : null };
  });
  const S = Object.fromEntries(sectors.map(s => [s.k, s]));
  const plan = [], strengths = [], weaknesses = [];
  const push = (ti, v, why) => plan.push({ ti, v, why });
  const d = (k) => S[k] && S[k].diff;
  // ataque
  if (d('cb_pace') >= 1.5) push('reception', 0, L(`Os teus atacantes são mais rápidos do que os centrais deles (${S.cb_pace.uv.toFixed(1)} vs ${S.cb_pace.tv.toFixed(1)}): joga para o espaço nas costas.`, `Your attackers are quicker than their centre-backs (${S.cb_pace.uv.toFixed(1)} vs ${S.cb_pace.tv.toFixed(1)}): play into the space behind.`));
  if (d('cb_pace') <= -1.5) push('reception', 2, L(`Os centrais deles são mais rápidos do que os teus atacantes: passe ao pé, sem bolas nas costas.`, `Their centre-backs are quicker than your attackers: pass to feet, no balls in behind.`));
  if (d('cb_air') >= 1.5) { push('crossing', 3, L(`Os teus avançados ganham no ar aos centrais deles (${S.cb_air.uv.toFixed(1)} vs ${S.cb_air.tv.toFixed(1)}): cruzamentos altos.`, `Your strikers beat their centre-backs in the air (${S.cb_air.uv.toFixed(1)} vs ${S.cb_air.tv.toFixed(1)}): high crosses.`)); push('set_pieces', 2, L('Vantagem aérea: procura cantos e livres.', 'Aerial advantage: go for corners and free kicks.')); }
  if (d('cb_air') <= -1.5) push('crossing', 0, L(`Os centrais deles dominam no ar (${S.cb_air.tv.toFixed(1)}): só cruzamentos rasteiros.`, `Their centre-backs dominate in the air (${S.cb_air.tv.toFixed(1)}): low crosses only.`));
  if (S.fb_def && S.fb_def.tv != null) {
    const dl = them.find(x => x.code === 'DL'), dr = them.find(x => x.code === 'DR');
    const vl = dl ? avgOf(dl.p, S.fb_def.a) : null, vr = dr ? avgOf(dr.p, S.fb_def.a) : null;
    if (vl != null && vr != null && Math.abs(vl - vr) >= 1.2) {
      const weakLeft = vl < vr; // o lateral esquerdo deles defende o teu flanco direito
      push('progress', weakLeft ? 3 : 0, L(`O lateral ${weakLeft ? 'esquerdo' : 'direito'} deles (${(weakLeft ? dl : dr).p.name}) é o elo fraco: ataca pelo teu flanco ${weakLeft ? 'direito' : 'esquerdo'}.`,
        `Their ${weakLeft ? 'left' : 'right'} full-back (${(weakLeft ? dl : dr).p.name}) is the weak link: attack down your ${weakLeft ? 'right' : 'left'} flank.`));
    }
  }
  // defesa
  const pr = S.press && S.press.tv;
  if (pr != null && pr >= 13.5) push('buildup', 2, L(`Pressionam muito (${pr.toFixed(1)}): salta a pressão com bola longa em vez de sair a jogar.`, `They press a lot (${pr.toFixed(1)}): bypass the press with long balls instead of playing out.`));
  if (pr != null && pr <= 10.5) push('buildup', 0, L(`Pressionam pouco (${pr.toFixed(1)}): sai a jogar curto com calma.`, `They press little (${pr.toFixed(1)}): play out short and calmly.`));
  if (d('fw_pace') <= -1.5) push('dline', 1, L(`Os avançados deles são mais rápidos do que os teus centrais (${S.fw_pace.tv.toFixed(1)} vs ${S.fw_pace.uv.toFixed(1)}): baixa a linha.`, `Their forwards are quicker than your centre-backs (${S.fw_pace.tv.toFixed(1)} vs ${S.fw_pace.uv.toFixed(1)}): drop the line.`));
  if (d('fw_pace') >= 1.5) push('dline', 3, L(`Os teus centrais são mais rápidos do que os avançados deles: podes subir a linha.`, `Your centre-backs are quicker than their forwards: you can push the line up.`));
  if (d('air_att') <= -1.5) push('cross_eng', 2, L(`Os avançados deles são fortes no ar (${S.air_att.tv.toFixed(1)}): impede os cruzamentos.`, `Their forwards are strong in the air (${S.air_att.tv.toFixed(1)}): stop the crosses.`));
  if (S.mid_create && S.mid_create.tv != null && S.mid_create.tv >= 14) push('press_trap', 2, L(`O meio-campo deles cria muito (${S.mid_create.tv.toFixed(1)}): empurra o jogo para as alas.`, `Their midfield creates a lot (${S.mid_create.tv.toFixed(1)}): push play out wide.`));
  if (S.wing && S.wing.tv != null && S.wing.tv >= 14.5 && d('wing') <= -1) push('def_trans', 0, L(`Os extremos deles são perigosos em transição: reagrupa antes de pressionar.`, `Their wingers are dangerous in transition: regroup before pressing.`));
  // fortes e fracos
  sectors.forEach(s => { if (s.tv == null) return; if (s.tv >= 14) strengths.push(s); if (s.tv <= 10.5) weaknesses.push(s); });
  // jogadores perigosos
  const threat = (x) => { const p = x.p; const base = ['ST','AMC'].includes(x.group) ? ['fin','otb','cmp','acc','dri'] : ['AM_LR','M_LR'].includes(x.group) ? ['dri','acc','pac','cro','fin'] : ['pas','vis','dec','tec','lon']; return avgOf(p, base) || 0; };
  const dangers = them.filter(x => !['GK','DC','D_LR','WB_LR'].includes(x.group)).map(x => ({ ...x, th: threat(x) })).sort((a, b) => b.th - a.th).slice(0, 3).map(x => ({
    p: x.p, code: x.code, th: x.th,
    ois: ['AM_LR','M_LR'].includes(x.group) ? ['Show onto weaker foot', 'Tight marking'] : ['ST'].includes(x.group) ? ['Tight marking', 'Tackle harder'] : ['Close down more', 'Tight marking'],
  }));
  // unir instruções repetidas (fica a primeira razão)
  const seen = new Set(), uplan = plan.filter(x => !seen.has(x.ti) && seen.add(x.ti));
  return { them, us, sectors, plan: uplan, strengths, weaknesses, dangers, club: majorityClub(oppPlayers).club };
}

// ---------- clube maioritário de uma exportação ----------
function majorityClub(players) {
  const c = {}; players.forEach(p => { const k = p.meta && p.meta.club; if (k) c[k] = (c[k] || 0) + 1; });
  const e = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return e ? { club: e[0], share: e[1] / players.length } : { club: null, share: 0 };
}

function setPiecePlan(t, players, oppList) {

  const used = new Set(), take = (list, key, n = 1, filter = () => true) => {
    const r = list.filter(x => !used.has(x.p.id) && filter(x)).sort((a, b) => b.s[key] - a.s[key]).slice(0, n); r.forEach(x => used.add(x.p.id)); return r;
  };
  const rank = (key, filter = () => true) => [...out].filter(filter).sort((a, b) => b.s[key] - a.s[key]);
  const why = (x, keys) => keys.map(k => `${attrName(k)} ${Math.round(A_(x.p, k) ?? 0)}`).join(', ');
  // ---- marcadores
  const cornerRank = rank('corner');
  const left = cornerRank.find(x => footOf(x.p) === 'L'), right = cornerRank.find(x => footOf(x.p) === 'R');
  const best = cornerRank[0];
  const corners = {
    // canto da direita batido com o pé esquerdo = curva para dentro (inswinger)
    right: left && left.s.corner >= best.s.corner - 1.5 ? { x: left, swing: L('para dentro (inswinger)', 'inswinging') } : { x: best, swing: footOf(best.p) === 'R' ? L('para fora (outswinger)', 'outswinging') : footOf(best.p) === 'L' ? L('para dentro (inswinger)', 'inswinging') : null },
    left: right && right.s.corner >= best.s.corner - 1.5 ? { x: right, swing: L('para dentro (inswinger)', 'inswinging') } : { x: best, swing: footOf(best.p) === 'L' ? L('para fora (outswinger)', 'outswinging') : footOf(best.p) === 'R' ? L('para dentro (inswinger)', 'inswinging') : null },
  };
  const fkD = rank('fkDirect')[0], fkC = rank('fkCross')[0];
  const directOk = fkD && (A_(fkD.p, 'fre') ?? 0) >= 14;
  const pens = rank('penalty').slice(0, 3);
  const lt = rank('fkCross', x => (A_(x.p, 'lth') ?? 0) >= 14).sort((a, b) => (A_(b.p, 'lth') ?? 0) - (A_(a.p, 'lth') ?? 0))[0] || null;
  const caps = [...xi.map(x => ({ ...x, c: SP.captain(x.p) }))].sort((a, b) => b.c - a.c).slice(0, 2);
  // ---- canto ofensivo
  const taker = corners.right.x;
  used.add(taker.p.id);
  const oppFast = oppList && oppList.length ? avgPlayers(opponentXI(oppList).filter(x => ['ST','AM_LR'].includes(x.group)).map(x => x.p), ['pac','acc']) : null;
  const nBack = oppFast != null && oppFast >= 14 ? 3 : 2;

  const back = take(out, 'cover', nBack, x => ['DC','D_LR','WB_LR','DM','MC'].includes(x.group) && !topAir.has(x.p.id));
  const box = take(out, 'aerial', 4);

  const [farP, centre, nearP, spot] = [box[0], box[1], rest[0], rest[1]];
  const edge = take(out, 'edge', 1)[0];
  const shortOpt = take(out, 'fkCross', 1, x => ['AM_LR','M_LR','D_LR','WB_LR','MC','AMC'].includes(x.group))[0];
  const attack = [
    { k: 'taker', n: L('Marcador', 'Taker'), x: taker, w: corners.right.swing ? L('canto ', '') + corners.right.swing + L('', ' corner') : why(taker, ['cor', 'cro']) },
    { k: 'far', n: L('2.º poste', 'Far post'), x: farP, w: why(farP, ['hea', 'jum']) + L(' — o melhor no ar ataca a bola que passa todos', ' — the best in the air attacks the ball that clears everyone') },
    { k: 'centre', n: L('Centro da pequena área', 'Centre of the six-yard box'), x: centre, w: why(centre, ['hea', 'jum', 'str']) },
    { k: 'near', n: L('1.º poste', 'Near post'), x: nearP, w: why(nearP, ['hea', 'acc']) + L(' — antecipa-se e desvia', ' — gets there first and flicks it on') },
    { k: 'spot', n: L('Marca de penálti (segunda bola)', 'Penalty spot (second ball)'), x: spot, w: why(spot, ['hea', 'ant']) },
    { k: 'edge', n: L('Entrada da área', 'Edge of the box'), x: edge, w: why(edge, ['lon', 'tec']) + L(' — remata as sobras', ' — shoots from the loose balls') },
    { k: 'short', n: L('Opção curta', 'Short option'), x: shortOpt, w: shortOpt ? why(shortOpt, ['pas', 'cro']) : '' },
    ...back.map((b, i) => ({ k: 'back' + i, n: L('Fica atrás', 'Stays back'), x: b, w: why(b, ['pac', 'acc', 'pos']) + L(' — protege o contra-ataque', ' — protects against the counter') })),
  ].filter(r => r.x);
  // ---- canto defensivo

  const theirAir = oppList && oppList.length ? opponentXI(oppList).filter(x => x.group !== 'GK').map(x => ({ p: x.p, a: SP.aerial(x.p) })).sort((a, b) => b.a - a.a).slice(0, 3) : [];

    { k: 'zc', n: L('Zona centro (pequena área)', 'Central zone (six-yard box)'), x: zones[0], w: why(zones[0], ['pos', 'hea', 'jum']) },
    { k: 'zf', n: L('Zona 2.º poste', 'Far-post zone'), x: zones[2], w: L('posicionamento e jogo aéreo', 'positioning and aerial ability') },
    ...markers.map((m, i) => ({ k: 'm' + i, n: theirAir[i] ? `Marca ${shortName(theirAir[i].p)}` : L('Marcação individual', 'Man-marking'), x: m, w: why(m, ['mar', 'hea', 'str']) + (theirAir[i] ? L(` · ${theirAir[i].p.name} é dos melhores no ar deles`, ` · ${theirAir[i].p.name} is one of their best in the air`) : '') })),
    { k: 'de', n: L('Entrada da área (segundas bolas)', 'Edge of the box (second balls)'), x: dEdge, w: dEdge ? why(dEdge, ['acc', 'ant']) : '' },
    ...outlet.map((o, i) => ({ k: 'o' + i, n: L('Fica na frente (contra-ataque)', 'Stays forward (counter-attack)'), x: o, w: why(o, ['pac', 'acc']) })),
  ].filter(r => r.x);
  // ---- conselhos gerais
  const tips = [];
  const ourAirTop = rank('aerial').slice(0, 4).map(x => x.s.aerial);
  const airTop = ourAirTop.reduce((a, b) => a + b, 0) / Math.max(1, ourAirTop.length);
  if (airTop >= 14) tips.push({ ti: 'set_pieces', v: 2, t: L(`Tens ${ourAirTop.length} jogadores fortes no ar (média ${airTop.toFixed(1)}): procura cantos e livres.`, `You have ${ourAirTop.length} players strong in the air (average ${airTop.toFixed(1)}): go for corners and free kicks.`) });
  else if (airTop <= 11) tips.push({ ti: 'set_pieces', v: 0, t: L(`Pouca presença aérea (média ${airTop.toFixed(1)}): mais vale manter a bola em jogo; cantos curtos.`, `Little aerial presence (average ${airTop.toFixed(1)}): better to keep the ball in play; take short corners.`) });
  if (!directOk) tips.push({ t: L(`Ninguém com Livres ≥ 14 (melhor: ${fkD ? fkD.p.name + ' ' + Math.round(A_(fkD.p, 'fre') ?? 0) : '—'}): nos livres frontais, cruza em vez de rematar.`, `Nobody with Free Kicks ≥ 14 (best: ${fkD ? fkD.p.name + ' ' + Math.round(A_(fkD.p, 'fre') ?? 0) : '—'}): from central free kicks, cross instead of shooting.`) });
  if (lt) tips.push({ t: L(`${lt.p.name} tem Lançamentos Longos ${Math.round(A_(lt.p, 'lth'))}: use lançamentos longos para a área no último terço.`, `${lt.p.name} has Long Throws ${Math.round(A_(lt.p, 'lth'))}: use long throws into the box in the final third.`) });
  if (nBack === 3) tips.push({ t: L('Os avançados deles são rápidos: deixa 3 atrás nos cantos ofensivos.', 'Their forwards are quick: leave 3 back on your attacking corners.') });
  return { xi, corners, fk: { direct: directOk ? fkD : null, cross: fkC }, pens, longThrow: lt, caps, attack, defend, system, theirAir, tips, airTop };
}

  { k: 'away_strong', ic: '⛰', n: L('Fora contra mais fortes', 'Away to a stronger side'), d: L('Prudência primeiro: bloco baixo, transições rápidas, anular os perigosos deles.', 'Caution first: a low block, quick transitions, shut down their dangerous players.') },
  { k: 'away_equal', ic: '⚖', n: L('Fora contra equipa do mesmo nível', 'Away to an evenly matched side'), d: L('Equilíbrio: bloco médio, não dar espaço nas costas, aproveitar as transições.', 'Balance: a mid block, no space in behind, make the most of transitions.') },

// intensidade da tática (o que a sinergia não mede): quanto vai para a frente e quanto fica a proteger

  const ips = t.slots.map(s => ({ r: ROLE_BY_ID[s.ip], a: slotInfo(t.ipForm, s.ipCode), o: ROLE_BY_ID[s.oop], pis: s.pis || [] })).filter(x => x.r && x.a);
  const box = ips.filter(x => x.r.tags.includes('BOX') || (x.r.tags.includes('IN') && x.r.tags.includes('RUN'))).length;
  const advFB = ips.filter(x => ['D_LR', 'WB_LR'].includes(x.a.group) && (x.r.tags.includes('ADV') || x.r.tags.includes('W') || x.pis.includes('Get further forward'))).length;
  const rd = ips.filter(x => x.r.tags.includes('RD') && x.a.group !== 'GK').length;
  const hold = ips.filter(x => x.o && (x.o.tags.includes('LOW') || x.o.tags.includes('CW') || x.o.tags.includes('TRK'))).length;
  const outs = ips.filter(x => x.o && x.o.tags.includes('OUT')).length;
  const att = MI / 6 * 28 + Math.min(box, 5) / 5 * 20 + advFB / 2 * 12 + ti('tempo') / 4 * 10 + ti('width') / 4 * 6 + ti('loe') / 2 * 8 + ti('dline') / 4 * 8 + (ti('def_trans') === 2 ? 4 : 0) + (ti('timewaste') === 0 ? 4 : 0);

    sts.forEach(x => { if (x.ip && x.ip.tags.includes('DROP') && grp(['AMC']).length) setRole(x, 'IP', ['cf_ip', 'poa'], L('Fica na área: o espaço entre linhas já está ocupado.', 'Stays in the box: the space between the lines is already occupied.')); });
    X().forEach(x => {
      if (!x.p || x.a.group === 'GK') return;
      if (a(x.p, 'lon') >= 15 && x.a.group !== 'DC') addPI(x, 'Shoot more', L(`Remates de Longe ${a(x.p, 'lon')}.`, `Long Shots ${a(x.p, 'lon')}.`));
      if (['AM_LR', 'M_LR'].includes(x.a.group) && a(x.p, 'dri') >= 14) addPI(x, 'Dribble more', L(`Drible ${a(x.p, 'dri')}: desequilibrar contra defesas fechadas.`, `Dribbling ${a(x.p, 'dri')}: unbalance a packed defence.`));
    });

  }

  const before = synergyReport(base, players), after = synergyReport(t, players);
  return { sc, t, changes, tweaks, subs, ois, notes, before, after, intentBefore: gameIntent(base), intentAfter: gameIntent(t), auditBefore: auditTactic(base, players), auditAfter: auditTactic(t, players) };
}

// ---- core/lab.js
// ============================================================
// Laboratório: análise das experiências do FM Tactics Lab
// (github.com/lqf0624/fm-tactics-lab, MIT). Formato lido do código
// do servidor (fm27_tactics_server.py):
//   job = { id, name, status, completed, total, mode: 'single'|'comparison',
//           experiment_type?: 'save_opponents'|'setpiece_episode',
//           schedule?: { variant: { group, tested_side, opponent, venue } },
//           metrics: { variant|group: { n, wins, draws, losses, win_rate, win_interval, goals_for, goals_against, points } },
//           runs: [ { variant, seed, result: { score: [casa, fora] },
//                     statistics: { teams: [ { xg, shots, possession, passes, completed_passes, ... }, {...} ] } } ] }
// No modo livre a equipa testada é a 0; 'A' = referência, 'B' = tática nova.
// ============================================================

const T95 = [0, 12.71, 4.30, 3.18, 2.78, 2.57, 2.45, 2.36, 2.31, 2.26, 2.23, 2.20, 2.18, 2.16, 2.14, 2.13, 2.12, 2.11, 2.10, 2.09, 2.09, 2.08, 2.07, 2.07, 2.06, 2.06, 2.06, 2.05, 2.05, 2.05, 2.04];
const tcrit = (df) => df <= 0 ? NaN : df < T95.length ? T95[df] : 1.96 + 2.4 / df;
function meanCI(xs) {
  const n = xs.length; if (!n) return null;
  const m = xs.reduce((a, b) => a + b, 0) / n;
  if (n < 2) return { n, mean: m, sd: null, lo: null, hi: null };
  const sd = Math.sqrt(xs.reduce((a, x) => a + (x - m) * (x - m), 0) / (n - 1));
  const h = tcrit(n - 1) * sd / Math.sqrt(n);
  return { n, mean: m, sd, lo: m - h, hi: m + h };
}
// Wilson para taxas (vitórias)
function wilson(k, n) {
  if (!n) return null; const z = 1.959963984540054, p = k / n, den = 1 + z * z / n;
  const c = (p + z * z / (2 * n)) / den, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / den;
  return { p, lo: Math.max(0, c - h), hi: Math.min(1, c + h) };
}

// orienta cada jogo para a equipa testada: devolve {gf, ga, xg, xga, shots, shotsA, poss, pass}
function orientRun(job, run) {
  const sched = job.schedule && job.schedule[run.variant];
  const side = sched && sched.tested_side != null ? sched.tested_side : 0;
  const sc = (run.result && run.result.score) || [0, 0];
  const st = (run.statistics && run.statistics.teams) || [];
  const me = st[side] || {}, op = st[1 - side] || {};
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
  return {
    group: sched ? sched.group : run.variant, seed: run.seed, opponent: sched ? sched.opponent_key || sched.opponent : null, venue: sched ? sched.venue : null,
    gf: sc[side], ga: sc[1 - side], xg: num(me.xg), xga: num(op.xg), shots: num(me.shots), shotsA: num(op.shots),
    poss: num(me.possession), pass: me.passes ? (me.completed_passes || 0) / me.passes : null,
  };
}

function summarize(rows) {
  const n = rows.length; if (!n) return null;
  const avg = (k) => { const v = rows.map(r => r[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const w = rows.filter(r => r.gf > r.ga).length, d = rows.filter(r => r.gf === r.ga).length;
  return { n, w, d, l: n - w - d, win: wilson(w, n), pts: (3 * w + d) / n, gf: avg('gf'), ga: avg('ga'), xg: avg('xg'), xga: avg('xga'),
    shots: avg('shots'), shotsA: avg('shotsA'), poss: avg('poss'), pass: avg('pass'),
    gd: meanCI(rows.map(r => r.gf - r.ga)), xgd: rows.every(r => r.xg != null && r.xga != null) ? meanCI(rows.map(r => r.xg - r.xga)) : null };
}

// emparelha A e B pela mesma semente (e mesmo adversário/campo, no modo save)
function pairedDiff(rows) {
  const key = (r) => [r.seed, r.opponent || '', r.venue || ''].join('|');
  const A = new Map(), B = new Map();
  rows.forEach(r => { if (r.group === 'A') A.set(key(r), r); else if (r.group === 'B') B.set(key(r), r); });
  const pairs = [...A.keys()].filter(k => B.has(k)).map(k => [A.get(k), B.get(k)]);
  if (!pairs.length) return null;
  const dGD = meanCI(pairs.map(([a, b]) => (b.gf - b.ga) - (a.gf - a.ga)));
  const hasXG = pairs.every(([a, b]) => a.xg != null && b.xg != null && a.xga != null && b.xga != null);
  const dXG = hasXG ? meanCI(pairs.map(([a, b]) => (b.xg - b.xga) - (a.xg - a.xga))) : null;
  const dPts = meanCI(pairs.map(([a, b]) => ((b.gf > b.ga ? 3 : b.gf === b.ga ? 1 : 0) - (a.gf > a.ga ? 3 : a.gf === a.ga ? 1 : 0))));
  // o xG tem muito menos ruído do que os golos: é a métrica principal do veredicto
  const main = dXG || dGD, unit = dXG ? 'xG' : L('golos', 'goals');
  let verdict, tone;
  if (!main || main.n < 6 || main.lo == null) { verdict = L('Poucos jogos para concluir. Corre pelo menos 30 por tática.', 'Too few matches to conclude. Run at least 30 per tactic.'); tone = 'info'; }
  else if (main.lo > 0) { verdict = L(`B é melhor do que A: +${main.mean.toFixed(2)} ${unit} de saldo por jogo (95%: ${main.lo.toFixed(2)} a ${main.hi.toFixed(2)}).`, `B is better than A: +${main.mean.toFixed(2)} ${unit} difference per match (95%: ${main.lo.toFixed(2)} to ${main.hi.toFixed(2)}).`); tone = 'good'; }
  else if (main.hi < 0) { verdict = L(`A é melhor do que B: ${main.mean.toFixed(2)} ${unit} de saldo por jogo com B (95%: ${main.lo.toFixed(2)} a ${main.hi.toFixed(2)}).`, `A is better than B: ${main.mean.toFixed(2)} ${unit} difference per match with B (95%: ${main.lo.toFixed(2)} to ${main.hi.toFixed(2)}).`); tone = 'crit'; }
  else { verdict = L(`Sem diferença clara (${main.mean >= 0 ? '+' : ''}${main.mean.toFixed(2)} ${unit}; 95%: ${main.lo.toFixed(2)} a ${main.hi.toFixed(2)}).`, `No clear difference (${main.mean >= 0 ? '+' : ''}${main.mean.toFixed(2)} ${unit}; 95%: ${main.lo.toFixed(2)} to ${main.hi.toFixed(2)}).`); tone = 'warn'; }
  // jogos necessários para separar uma diferença do tamanho observada (mín. 0,15) com 95%
  let needN = null;
  if (main && main.sd) { const target = Math.max(0.15, Math.abs(main.mean)); needN = Math.ceil(Math.pow(1.96 * main.sd / target, 2)); }
  return { n: pairs.length, dGD, dXG, dPts, verdict, tone, needN, unit };
}

function analyzeJob(job) {
  const runs = (job.runs || []).filter(r => r && r.result && Array.isArray(r.result.score));
  const rows = runs.map(r => orientRun(job, r));
  const groups = [...new Set(rows.map(r => r.group))].sort();
  const per = Object.fromEntries(groups.map(g => [g, summarize(rows.filter(r => r.group === g))]));
  const comparison = groups.includes('A') && groups.includes('B') ? pairedDiff(rows) : null;
  // por adversário (modo save)
  let byOpp = null;
  if (job.schedule) {
    const opps = [...new Set(rows.map(r => r.opponent).filter(Boolean))];
    byOpp = opps.map(o => ({ key: o, name: (Object.values(job.schedule).find(s => (s.opponent_key || s.opponent) === o) || {}).opponent || o,
      A: summarize(rows.filter(r => r.opponent === o && r.group === 'A')), B: summarize(rows.filter(r => r.opponent === o && r.group === 'B')) }));
  }
  const names = job.variant_names || {};
  return { id: job.id, name: job.name || job.id, status: job.status, completed: job.completed, total: job.total, mode: job.mode, type: job.experiment_type || 'free', per, comparison, byOpp, names, rows };
}

// pacote de exportação (/api/jobs/{id}/export) ou o próprio job
function jobFromAny(d) {
  if (!d || typeof d !== 'object') return null;
  if (d.summary && Array.isArray(d.summary.runs)) return Object.assign({}, d.summary, { _scenarios: d.scenarios || null });
  if (Array.isArray(d.runs) && (d.metrics || d.status)) return d;
  return null;
}

function simModel(t) {
  const mi = MENTALITIES.indexOf(t.ment), ms = (mi - 3) * 1.5;
  const v = (k) => tiVal(t, k);
  const W = [0.8, 0.9, 1, 1.05, 1.1][v('width')];
  const prog = v('progress');
  const bs = prog === 3 ? 1 : prog === 0 ? -1 : -1;             // lado da bola (esquerda por defeito)
  const P = t.slots.map((s, i) => {
    const a = slotInfo(t.ipForm, s.ipCode), b = slotInfo(t.oopForm, s.oopCode);
    const sg = a.x < 45 ? -1 : a.x > 55 ? 1 : 0;
    return { i, s, a, b, ip: ROLE_BY_ID[s.ip], oop: ROLE_BY_ID[s.oop], sg, sgb: b.x < 45 ? -1 : b.x > 55 ? 1 : 0, pos: {} };
  });
  const sideOr = (p, alt) => p.sg || (p.a.x < 50 ? -1 : p.a.x > 50 ? 1 : alt);
  const xKey = (p, key, x) => {
    const s = sideOr(p, bs);
    switch (key) {
      case 'wide': return 50 + s * 45 * W; case 'wide2': return 50 + s * 37 * W; case 'wide3': return 50 + s * 31 * W;
      case 'half': return 50 + s * 18 * Math.sqrt(W); case 'in': return 50 + s * 9; case 'in2': return 50 + s * 13;
      case 'ch': return 50 + s * 22; case 'cbw': return 50 + s * 30; case 'c': return 50;
      case 'ball': return 50 + bs * 14; case 'ballhalf': return 50 + bs * 19; default: return x;
    }

  // ---- fases com bola
  ['build', 'prog', 'final'].forEach(ph => {
    const yBase = { build: (y) => y * 0.6 + 3, prog: (y) => y * 0.85 + 8, final: (y) => Math.min(96, y * 0.75 + 25) }[ph];
    P.forEach(p => {
      let x = 50 + (p.a.x - 50) * W, y = yBase(p.a.y);
      const m = p.ip && MOVES[p.ip.id] && MOVES[p.ip.id][ph];
      if (m) { if (m.y != null) y = m.y; if (m.xs) x = 50 + (p.a.x - 50) * m.xs * (hasHB ? 1.25 : 1); if (m.x) x = xKey(p, m.x, x); }
      if (p.ip && ['fb_ip','wb_ip','awb'].includes(p.ip.id) && ph === 'final') {

      }
      if (p.a.group !== 'GK') y += ms;
      if (ph === 'prog' && v('passing') >= 3 && p.a.group === 'ST') y += 4;

  const cbs = byGroup(['DC']).sort((p, q) => Math.abs(p.pos.build.x - (50 + bs * 30)) - Math.abs(q.pos.build.x - (50 + bs * 30)));
  const mids = byGroup(['DM','MC']).sort((p, q) => (q.ip && q.ip.tags.includes('CR') ? 1 : 0) - (p.ip && p.ip.tags.includes('CR') ? 1 : 0) || p.pos.build.y - q.pos.build.y);
  const strikers = byGroup(['ST','AMC']).sort((p, q) => (q.ip && q.ip.tags.includes('AIR') ? 1 : 0) - (p.ip && p.ip.tags.includes('AIR') ? 1 : 0) || q.pos.final.y - p.pos.final.y);
  const direct = v('passing') >= 3 || v('buildup') === 2 || v('goal_kicks') === 2;
  const holder = mids[0] || cbs[0];
  const sideWide = P.filter(p => p.a.group !== 'GK' && sideOr(p, bs) === bs).sort((p, q) => q.pos.final.y - p.pos.final.y);
  const wideProv = sideWide.find(p => p.ip && p.ip.tags.includes('W') && p.pos.final.y > 70);
  const boxTarget = [...P].filter(p => p.ip && (p.ip.tags.includes('BOX') || p.ip.tags.includes('AIR'))).sort((p, q) => q.pos.final.y - p.pos.final.y)[0] || strikers[0];
  const creator = [...P].filter(p => p.ip && p.ip.tags.includes('CR') && p.a.group !== 'GK').sort((p, q) => q.pos.final.y - p.pos.final.y)[0];
  const runner = [...P].filter(p => p.ip && p.ip.tags.includes('RUN')).sort((p, q) => q.pos.final.y - p.pos.final.y)[0] || boxTarget;
  const at = (p, ph, dx = 0, dy = 0) => p ? { x: p.pos[ph].x + dx, y: p.pos[ph].y + dy } : { x: 50, y: 50 };
  const ball = {};
  ball.build = direct ? [at(gk, 'build', 0, 1.5), at(strikers[0], 'build')] : [at(gk, 'build', 0, 1.5), at(cbs[0], 'build'), at(holder, 'build')];
  const progTarget = byGroup(['D_LR','WB_LR','M_LR','AM_LR','AMC','MC']).filter(p => sideOr(p, bs) === bs || p.a.group === 'AMC').sort((p, q) => q.pos.prog.y - p.pos.prog.y)[0];
  ball.prog = direct ? [at(holder, 'prog'), at(strikers[0], 'prog')] : [at(holder, 'prog'), at(progTarget || strikers[0], 'prog')];
  ball.final = wideProv ? [at(wideProv, 'final', 0, -6), at(wideProv, 'final'), at(boxTarget, 'final', 0, 1)]
    : [at(creator || holder, 'final'), at(runner, 'final', 0, 2)];
  const lost = ball.final[ball.final.length - 1];
  // ---- bloco sem bola
  const dl = v('dline'), loe = v('loe'), trig = v('trigger'), dlb = tiVal(t, 'dl_behaviour');
  const dLine = [16, 21, 27, 33, 39][dl] + ms * 0.6 + (dlb - 1) * 2;
  const front = [44, 56, 68][loe] + ms * 0.6;
  const trap = v('press_trap');
  const oppFront = dLine + 8, oppBack = Math.max(80, front + 16);
  const oppAt = (k, D, F) => { const [ox, oy] = OPP_SHAPE[k]; const tt = clamp((oy - 18) / 60, 0, 1); return k === 0 ? { x: 100 - ox, y: Math.min(97, D + 10) } : { x: 100 - ox, y: D + (F - D) * tt }; };
  const oppStart = oppAt(2, oppBack, oppFront);
  const ballOOPend = trap === 2 ? { x: 50 + bs * 38, y: front + 2 } : trap === 0 ? { x: 50, y: front + 3 } : { x: 50 + bs * 20, y: front + 4 };
  ball.oop = [oppStart, ballOOPend];
  const bxo = ballOOPend.x;
  P.forEach(p => {
    const b = p.b, r = p.oop;
    let x = 50 + (b.x - 50) * 0.82 + (bxo - 50) * 0.22;
    let y;
    if (p.b.group === 'GK') y = 5 + (dl >= 3 ? 4 : 0);
    else {
      const tt = clamp((b.y - 18) / 62, 0, 1); y = dLine + (front - dLine) * tt;
    }
    const id = r && r.id, tags = r ? r.tags : [];
    if (id === 'swk') y = Math.max(8, dLine - 12); if (id === 'lhk') y = 3;
    if (tags.includes('HP')) y += 5; if (tags.includes('LOW')) y -= 3; if (tags.includes('TRK')) y -= 5;
    if (['pfb','prwb'].includes(id)) y += 6;
    if (id === 'ddm') { y = dLine + 1; x = 50; }
    if (['wcdm','wccm'].includes(id)) x = 50 + (p.sgb || -bs) * 30;
    if (['wowm','wow'].includes(id)) { y = Math.max(y, front + 5); x = 50 + (p.sgb || bs) * 42; }
    if (id === 'iow') { y = Math.max(y, front + 5); x = 50 + (p.sgb || bs) * 20; }
    if (['coam','cocf'].includes(id)) { y = Math.max(y, front + 7); x = 50; }
    if (['soam','socf'].includes(id)) { y = Math.max(y, front + 9); x = 50 + (p.sgb || bs) * 26; }
    if (id === 'tcf') y = front - 1;
    if (v('short_gk') === 1 && p.b.group === 'ST') y += 7;
    // distância mínima entre linhas: mesmo num bloco muito compacto cada linha mantém-se legível
    if (p.b.group !== 'GK') {
      const minOff = { DC:0, D_LR:0, WB_LR:0, DM:7, MC:9, M_LR:10, AMC:14, AM_LR:13, ST:18 }[p.b.group] || 0;
      y = Math.max(y, dLine + minOff - (tags.includes('TRK') ? 3 : 0));
      if (p.b.group === 'M_LR' || p.b.group === 'AM_LR') x = 50 + (x - 50) * 0.94;

  // pressão: os mais próximos da bola (ou com papel assertivo) saem ao portador
  const nPress = [0, 1, 1, 2, 3][trig];
  const cand = P.filter(p => p.b.group !== 'GK' && !(p.oop && p.oop.tags.includes('OUT')))
    .map(p => ({ p, d: Math.hypot(p.pos.oop.x - bxo, p.pos.oop.y - ballOOPend.y) })).sort((a, b) => a.d - b.d);
  const pressers = new Set(cand.filter(c => c.p.pos.oop.y > dLine + 6).slice(0, nPress).map(c => c.p.i));
  P.forEach(p => { if (p.oop && p.oop.tags.includes('HP') && Math.hypot(p.pos.oop.x - bxo, p.pos.oop.y - ballOOPend.y) < 30) pressers.add(p.i); });
  P.forEach(p => { if (pressers.has(p.i)) { const o = p.pos.oop; p.pos.oop = { x: o.x + (bxo - o.x) * 0.55, y: o.y + (ballOOPend.y - 3 - o.y) * 0.55 }; p.pressing = true; } });
  // ---- perda da bola
  const dtr = v('def_trans');
  P.forEach(p => {
    const f = p.pos.final, o = p.pos.oop, d = Math.hypot(f.x - lost.x, f.y - lost.y);
    let pt;
    if (dtr === 2 && d < 27 && p.a.group !== 'GK') pt = { x: f.x + (lost.x - f.x) * 0.7, y: f.y + (lost.y - 4 - f.y) * 0.7 };
    else if (dtr === 2) pt = { x: f.x, y: f.y - 4 };
    else if (dtr === 0) pt = { x: f.x + (o.x - f.x) * 0.75, y: f.y + (o.y - f.y) * 0.75 };
    else pt = d < 18 && p.a.group !== 'GK' ? { x: f.x + (lost.x - f.x) * 0.6, y: f.y + (lost.y - f.y) * 0.6 } : { x: f.x + (o.x - f.x) * 0.45, y: f.y + (o.y - f.y) * 0.45 };
    p.pos.loss = pt;
  });
  ball.loss = [lost, { x: lost.x - bs * 6, y: lost.y - (dtr === 0 ? 22 : 10) }];
  // ---- recuperação
  const atr = v('att_trans');
  const rec = { x: bxo + (50 - bxo) * 0.3, y: Math.max(dLine + 10, front - 8) };
  P.forEach(p => {
    const o = p.pos.oop, r = p.ip, ro = p.oop;
    const runs = (r && (r.tags.includes('RUN') || r.tags.includes('BOX'))) || (ro && ro.tags.includes('OUT')) || p.a.group === 'ST';
    let pt = { ...o };
    if (atr === 2 && runs) pt = { x: o.x + (p.pos.final.x - o.x) * 0.4, y: Math.min(92, o.y + 24) };
    else if (atr === 2) pt = { x: o.x, y: o.y + 6 };
    else if (atr === 0) pt = { x: o.x + (p.pos.build.x - o.x) * 0.6, y: o.y + (p.pos.build.y - o.y) * 0.6 };
    else pt = runs ? { x: o.x, y: Math.min(90, o.y + 13) } : { x: o.x, y: o.y + 4 };
    p.pos.win = { x: clamp(pt.x, 5, 95), y: clamp(pt.y, 2, 96) };
  });
  const recoverer = [...P].filter(p => p.a.group !== 'GK').sort((p, q) => Math.hypot(p.pos.oop.x - rec.x, p.pos.oop.y - rec.y) - Math.hypot(q.pos.oop.x - rec.x, q.pos.oop.y - rec.y))[0];
  const target = atr === 0 ? cbs[0] : [...P].sort((p, q) => q.pos.win.y - p.pos.win.y)[0];
  ball.win = [at(recoverer, 'oop'), at(target, 'win', 0, atr === 2 ? 1.5 : 0)];
  // ---- adversário (cinzento)
  const OPP = { build: [64, 30], prog: [74, 44], final: [86, 60], loss: [80, 46], oop: [oppBack, oppFront], win: [70, dLine + 4] };
  const opp = {}; Object.entries(OPP).forEach(([ph, [D, F]]) => { opp[ph] = OPP_SHAPE.map((_, k) => oppAt(k, D, F)); });
  // ---- avisos visuais no bloco
  const lineY = (gs) => { const q = P.filter(p => gs.includes(p.b.group) && !p.pressing); return q.length ? q.reduce((a, p) => a + p.pos.oop.y, 0) / q.length : null; };
  const defY = lineY(['DC']), midY = lineY(['DM','MC','M_LR']);
  const overlays = [];
  if (defY != null && midY != null && midY - defY > 21) overlays.push({ kind: 'gap', y1: defY + 2, y2: midY - 2, label: L('espaço entre linhas', 'gap between the lines') });
  const gkO = P.find(p => p.b.group === 'GK');
  if (dl >= 3 && gkO && gkO.oop && gkO.oop.id !== 'swk' && loe < 2) overlays.push({ kind: 'behind', y1: 8, y2: (defY || dLine) - 2, label: L('espaço nas costas sem cobertura', 'uncovered space in behind') });
  return { P, ball, opp, overlays, dLine, front, bs };
}

function demoTacticForRole(r) {

  if (!FORMATIONS[F].some(z => fits(F, z.code))) F = Object.keys(FORMATIONS).find(f => FORMATIONS[f].some(z => fits(f, z.code))) || F;

  if (idx < 0) idx = t.slots.findIndex(s => fits(F, s.ipCode));
  t.slots[idx][r.phase === 'IP' ? 'ip' : 'oop'] = r.id;

}

const VERSION = '4.9.0';

const STORE_KEY = 'fm27tb.v1';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const fitColor = (s) => s == null ? 'var(--muted)' : s >= 70 ? '#1c8a4d' : s >= 58 ? '#5a9a2e' : s >= 48 ? '#b7791f' : '#c2412d';


const EMPTY_SQUAD = () => ({ players: [], source: '', warnings: [], mapped: [], at: null });
const ST = {
  view: 'home', tabs: { team: 'squad', tactic: 'analyze', bible: 'roles' },
  tactic: newTactic(), squad: EMPTY_SQUAD(), opp: EMPTY_SQUAD(), myClub: null,
  saved: [], sel: null, pitchMode: 'IP', rq: '', rg: '', rp: '', fmf: null, sugg: null, theme: 'auto',
  auto: { on: false, dir: '', mtime: 0, last: '', save: false, saveDir: '', saveMtime: 0, saveErr: '', saveLast: '', v: 45 },   // carregamento automático (app instalada)
  lastSave: null, gen: null, lab: null, ui: { collapsed: {}, navMini: false }, lang: 'en',
};
const DESKTOP = typeof window !== 'undefined' && !!(window.__TAURI__ && window.__TAURI__.core);

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ tactic: ST.tactic, squad: ST.squad, opp: ST.opp, myClub: ST.myClub, saved: ST.saved, theme: ST.theme, auto: ST.auto, tabs: ST.tabs, gen: ST.gen, lab: ST.lab ? { port: ST.lab.port, more: ST.lab.more } : null, ui: ST.ui, lang: ST.lang, sheetNames: ST.sheetNames, planK: ST.planK })); } catch (e) {}
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!d) return;                                   // primeira utilização: tática nova e vazia, sem táticas guardadas
    if (d.tactic && FORMATIONS[d.tactic.ipForm] && FORMATIONS[d.tactic.oopForm]) ST.tactic = d.tactic;
    if (d.squad && Array.isArray(d.squad.players)) ST.squad = d.squad;
    if (Array.isArray(d.saved)) ST.saved = d.saved;
    if (d.theme) ST.theme = d.theme;
    if (d.opp && Array.isArray(d.opp.players)) ST.opp = d.opp;
    if (d.myClub) ST.myClub = d.myClub;
    if (d.auto) {
      ST.auto = Object.assign(ST.auto, d.auto);
      if (!d.auto.v || d.auto.v < 43) ST.auto.save = false;   // v4.3: ler o save passa a ser opcional
      if (!d.auto.v || d.auto.v < 45) ST.auto.on = false;     // v4.5: carregar o F9 sozinho também passa a ser opcional
      ST.auto.v = 45;
    }
    if (d.tabs) ST.tabs = Object.assign(ST.tabs, d.tabs);
    if (d.gen) ST.gen = d.gen;
    if (d.lang === 'pt' || d.lang === 'en') ST.lang = d.lang;
    if (d.sheetNames) ST.sheetNames = d.sheetNames;
    if (d.planK) ST.planK = d.planK;
    // v4.4: a tática de exemplo “Cenas v2” deixou de vir com a app — sai das guardadas e, se for a activa, dá lugar a uma nova
    const isCenas = (t) => t && typeof t.name === 'string' && /^Cenas v2\b/.test(t.name);
    ST.saved = ST.saved.filter(t => !isCenas(t));
    if (isCenas(ST.tactic)) { ST.tactic = newTactic(); }

    if (d.lab) ST.lab = { port: d.lab.port || 8765, more: d.lab.more || 100, status: null, jobs: [], job: null, err: '', busy: false };

function ingestSquadText(text, sourceName, opts = {}) {
  const r = parseSquad(String(text || '').replace(/^\uFEFF/, ''));
  if (!r.players.length) { toast(L('Não encontrei jogadores em ', 'No players found in ') + sourceName); return null; }
  const mc = majorityClub(r.players);
  const pack = { players: r.players, warnings: r.warnings, mapped: r.mapped, source: sourceName, at: new Date().toISOString() };
  let target = opts.force || 'squad';
  if (!opts.force && mc.club && mc.share < 0.6) { toast('Exportação com vários clubes (pesquisa?) ignorada para o plantel'); return null; }
  if (!opts.force && mc.club && ST.myClub && mc.club !== ST.myClub) target = 'opp';
  if (target === 'squad') {
    ST.squad = pack; if (mc.club) ST.myClub = mc.club; ST.sugg = null;
    const ids = new Set(r.players.map(p => p.id)); ST.tactic.slots.forEach(s => { if (s.pid && !ids.has(s.pid)) s.pid = null; });
    if (ST.tactic.slots.every(s => !s.pid) && r.players.length >= 11) autoPickXI(ST.tactic, r.players);
    toast(L(`Plantel${mc.club ? ' do ' + mc.club : ''}: ${r.players.length} jogadores`, `Squad${mc.club ? ' — ' + mc.club : ''}: ${r.players.length} players`));
  } else {
    ST.opp = pack; toast(L(`Adversário${mc.club ? ' ' + mc.club : ''}: ${r.players.length} jogadores — relatório pronto`, `Opponent${mc.club ? ' ' + mc.club : ''}: ${r.players.length} players — report ready`));
  }
  save();
  return target;
}

// ---------- Melhor XI: adequação, instruções recomendadas, suplentes, sucessores ----------
function vXI() {
  const ps = players(), t = ST.tactic;
  if (ps.length < 11) return `<div class="panel empty"><h3>Carregue o plantel primeiro</h3><p>Com o plantel, a app escolhe o melhor XI para a tua tática, recomenda instruções individuais pelos atributos e mostra suplentes e sucessores para cada posição.</p>
    <button class="btn primary" onclick="A.tab('team','squad')">Ir para Plantel</button> <button class="btn" onclick="A.sampleSquad();A.tab('team','xi')">Usar exemplo</button></div>`;
  const pm = Object.fromEntries(ps.map(p => [p.id, p]));
  const bs = benchAndSuccessors(t, ps);
  const rows = t.slots.map((s, i) => {
    const a = slotInfo(t.ipForm, s.ipCode), p = pm[s.pid], ri = ROLE_BY_ID[s.ip], ro = ROLE_BY_ID[s.oop];
    const sc = p ? slotScore(p, t, s) : null;
    const alt = p ? bestRolesForPlayer(p, a.group, 'IP', a, 1)[0] : null;
    const cur = p ? (roleScore(p, ri) || { score: 0 }).score : 0;
    const recs = p ? recommendPIs(p, ri, ro, a.group) : [];
    const b = bs[i];
    return `<tr><td><b>${esc(s.ipCode)}</b></td>
      <td>${p ? `${fitBadge(sc)} <b>${esc(p.name)}</b>${p.age ? ` <span class="muted small">${p.age}a</span>` : ''}` : '<span class="muted">vazio</span>'}
        <div class="small muted">${esc(roleName(ri))} / ${esc(roleName(ro))}${alt && alt.r.id !== ri.id && alt.s >= cur + 5 ? ` · <span style="color:var(--warn)"><span>melhor como</span> ${esc(roleName(alt.r))} (${alt.s})</span>` : ''}</div></td>
      <td>${recs.map(r => (s.pis || []).includes(r.pi) ? `<span class="chip ip" title="${esc(r.why)}">✓ ${esc(r.pi)}</span>` : `<button class="chip btnchip" title="${esc(r.why)}" onclick="A.applyPI(${i}, '${r.pi.replace(/'/g, "\\'")}')">+ ${esc(r.pi)}</button>`).join('') || '<span class="muted small">—</span>'}</td>
      <td class="small">${b.bench ? `${esc(b.bench.p.name)} ${fitBadge(b.bench.sc)}` : '—'}</td>
      <td class="small">${b.succ ? `${esc(b.succ.p.name)} <span class="muted">${b.succ.p.age}a</span> ${fitBadge(b.succ.sc)}` : '—'}</td></tr>`;
  }).join('');
  return `<div class="top"><div><h2><span>Melhor XI</span> — ${esc(t.name)}</h2><p class="muted small" style="margin:0">Passe o rato numa instrução para ver porquê. As instruções aplicadas entram na tática e na Ficha para o FM27.</p></div>
    <div class="row"><button class="btn" onclick="A.autoXI()">Escolher XI automaticamente</button><button class="btn primary" onclick="A.applyAllPIs()">Aplicar a principal de cada jogador</button></div></div>
  <div class="grid" style="grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start">
    <div class="panel">${pitchSVG(t, 'IP', null, { static: true })}<p class="small muted">Cor = adequação ao par de papéis (verde ≥ 70).</p></div>
    <div class="table-wrap" style="max-height:none"><table><thead><tr><th>Pos</th><th>Jogador e papéis</th><th>Instruções recomendadas</th><th>Suplente</th><th>Sucessor (≤ 21)</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  ${vSuggest()}`;
}

// ---- ui/views_synergy.js
// ============================================================
// Sinergia entre papéis — todas as fases (Gerador e Analisador)
// ============================================================
const SYN_COL = { build: '#14b8a6', chain: 'var(--good)', cross: '#3b82f6', front: '#d97706', flank: '#a855f7', press: '#ef4444', flankdef: '#a855f7', counter: '#f59e0b' };
function synergyMap(t, links, form, title) {
  const F = FORMATIONS[form] || [], pos = Object.fromEntries(F.map(z => [z.code, z]));
  const P = (code) => { const z = pos[code]; return z ? [6 + z.y * 0.88, 4 + z.x * 0.56] : [50, 32]; };   // horizontal: ataque para a direita
  const arrows = links.map(l => { const [x1, y1] = P(l.from.code), [x2, y2] = P(l.to.code); const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1, k = 3.2 / d;
    return `<line x1="${(x1 + dx * k).toFixed(1)}" y1="${(y1 + dy * k).toFixed(1)}" x2="${(x2 - dx * k).toFixed(1)}" y2="${(y2 - dy * k).toFixed(1)}" stroke="${SYN_COL[l.type]}" stroke-width="${0.6 + l.v * 0.9}" marker-end="url(#ar-${l.type})" ${['flank', 'flankdef'].includes(l.type) ? 'stroke-dasharray="1.6 1"' : ''} opacity=".95"/>`; }).join('');
  const defs = Object.entries(SYN_COL).map(([k, c]) => `<marker id="ar-${k}" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="${c}"/></marker>`).join('');
  const phaseKey = form === t.oopForm && title === 'oop' ? 'oop' : 'ip';
  const dots = t.slots.map(s => { const code = phaseKey === 'oop' ? s.oopCode : s.ipCode, r = ROLE_BY_ID[phaseKey === 'oop' ? s.oop : s.ip], [x, y] = P(code);
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle r="2.9" fill="${phaseKey === 'oop' ? '#1e3a5f' : '#0b5d3a'}" stroke="#fff" stroke-width=".35"/><text y="1" text-anchor="middle" font-size="2.2" font-weight="700" fill="#fff">${esc(r ? r.ab : '')}</text></g>`; }).join('');
  return `<svg class="syn-map" viewBox="0 0 100 64" role="img" aria-label="${L('Mapa de ligações', 'Link map')}"><defs>${defs}</defs>
    <rect width="100" height="64" rx="2" fill="var(--pitch)"/><g fill="none" stroke="var(--pitchline)" stroke-width=".3"><rect x="2" y="2" width="96" height="60"/><line x1="50" y1="2" x2="50" y2="62"/><circle cx="50" cy="32" r="7"/><rect x="83" y="17" width="15" height="30"/><rect x="2" y="17" width="15" height="30"/></g>
    ${arrows}${dots}</svg>`;
}
function synergyPanel(t, players, opts = {}) {
  const rep = synergyReport(t, players), N = SYN_NAMES(), PH = SYN_PHASES();
  const colr = (v) => v >= 75 ? 'var(--good)' : v >= 50 ? 'var(--warn)' : 'var(--crit)';
  const bar = (k, v) => `<div class="bar-row"><span>${esc(N[k] || k)}</span><div class="bar"><i style="width:${v}%;background:${colr(v)}"></i></div><b>${v}</b></div>`;
  const order = ['build', 'att', 'def', 'trans'];
  const card = (ph) => { const P = rep.phases[ph]; return `<div class="syn-phase"><div class="row" style="justify-content:space-between"><b>${esc(PH[ph])}</b><span class="syn-score" style="color:${colr(P.score)}">${P.score}</span></div>${Object.entries(P.parts).map(([k, v]) => bar(k, v)).join('')}</div>`; };

  return `<div class="syn">
    <div class="syn-top">${ring(rep.score, 72)}<div class="small">${L(`Sinergia entre papéis em todas as fases: se os papéis se servem e se cobrem uns aos outros — não só se cada jogador está no melhor papel. ${rep.boxN} chegam à área · ${rep.creators} criativo(s) · ${rep.rdN} ficam atrás · ${rep.outN} saída(s).`, `Role synergy across every phase: whether roles serve and cover each other — not just whether each player is in his best role. ${rep.boxN} arrive in the box · ${rep.creators} creator(s) · ${rep.rdN} stay back · ${rep.outN} outlet(s).`)}${players.length ? '' : `<br><span class="muted">${L('Sem plantel: avaliação só pela estrutura dos papéis.', 'No squad: assessed on role structure only.')}</span>`}</div></div>
    <div class="syn-phases">${order.map(card).join('')}</div>
    <div class="grid g2" style="margin-top:12px;align-items:start">
      <div><b class="small">${L('Com bola', 'In possession')} · ${esc(t.ipForm)}</b>${synergyMap(t, ipLinks, t.ipForm, 'ip')}${legend([['build', L('saída de bola', 'build-up')], ['chain', L('criador → finalizador', 'creator → finisher')], ['cross', L('cruzamento → alvo', 'cross → target')], ['front', L('dupla da frente', 'front pair')], ['flank', L('flanco', 'flank')], ['counter', L('contra-ataque', 'counter')]])}</div>
      <div><b class="small">${L('Sem bola', 'Out of possession')} · ${esc(t.oopForm)}</b>${synergyMap(t, oopLinks, t.oopForm, 'oop')}${legend([['press', L('pressiona → cobre', 'presses → covers')], ['flankdef', L('flanco: dobra / segura', 'flank: doubles / holds')]])}</div>
    </div>
    ${rep.links.length ? `<details class="small" style="margin-top:10px"><summary>${L('Ligações principais', 'Main links')} (${rep.links.length})</summary><ul class="clean">${rep.links.map(l => `<li><span class="chip">${esc(PH[l.phase])}</span> ${esc(l.why)} <span class="muted">(${Math.round(l.v * 100)})</span></li>`).join('')}</ul></details>` : ''}
    ${byPhase.length ? `<h4 style="margin:12px 0 4px">${L('O que está a falhar entre papéis', 'What is not working between roles')}</h4>${byPhase.map(([ph, list]) => `<div class="small muted" style="margin:8px 0 2px;text-transform:uppercase;letter-spacing:.05em">${esc(PH[ph])}</div>${list.map(i => `<div class="finding"><div class="sev warn">!</div><div><b class="small">${esc(i.t)}</b><div class="small" style="color:var(--accent)">→ ${esc(i.fix)}</div></div></div>`).join('')}`).join('')}`
      : `<p class="small" style="margin-top:10px">${L('Os papéis encaixam em todas as fases. 👍', 'The roles fit together in every phase. 👍')}</p>`}
    ${opts.labHint ? `<p class="small muted" style="margin-top:10px">${L('A sinergia é um modelo de estrutura e atributos. Para confirmar no motor do FM27, compare no Laboratório (Tactics Lab) esta tática com a anterior: xG criado e xG sofrido.', 'Synergy is a model of structure and attributes. To confirm it on the FM27 engine, compare this tactic with the previous one in the Lab (Tactics Lab): xG created and xG conceded.')}</p>` : ''}
  </div>`;

function vGamePlans() {
  const ps = players(), k = ST.planK || 'chase';
