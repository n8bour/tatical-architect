  const sc = SCENARIOS();
  const delta = (a, b) => { const d = b - a; return `<span class="${d > 0 ? 'up' : d < 0 ? 'down' : 'muted'}">${a} → <b>${b}</b> ${d ? `(${d > 0 ? '+' : ''}${d})` : ''}</span>`; };
  const grpC = (kind) => r.changes.filter(c => c.kind === kind);
  const tiRows = grpC('ti'), roleRows = grpC('role'), piRows = grpC('pi'), ment = grpC('ment')[0];
  const sec = (title, body) => body ? `<div class="plan-sec"><h4>${title}</h4>${body}</div>` : '';
  const tbl = (rows) => `<table><tbody>${rows.join('')}</tbody></table>`;
  return `<div class="top"><div><h2>${L('Situações de jogo', 'Game states')}</h2><p class="muted small" style="margin:0">${L(`Planos a partir de “${esc(ST.tactic.name)}”${ps.length ? ' e do teu plantel' : ''}. No FM27 pode guardar até 3 táticas: use a base como A e estes planos como B e C (por exemplo, B = Precisamos de golos, C = Segurar o resultado).`, `Plans built from “${esc(ST.tactic.name)}”${ps.length ? ' and your squad' : ''}. FM27 lets you keep up to 3 tactics: use the base as A and these plans as B and C (e.g. B = We need goals, C = Protect the lead).`)}</p></div>
    <div class="row"><button class="btn primary" onclick="A.planSave()">${L('Guardar como tática', 'Save as tactic')}</button><button class="btn" onclick="A.planUse()">${L('Usar agora', 'Use now')}</button><button class="btn" onclick="A.planCopy()">${L('Copiar como texto', 'Copy as text')}</button></div></div>
  <div class="plan-tabs" role="tablist">${sc.map(s => `<button role="tab" aria-selected="${s.k === k}" class="${s.k === k ? 'on' : ''}" onclick="A.planK('${s.k}')"><span aria-hidden="true">${s.ic}</span> ${esc(s.n)}</button>`).join('')}</div>
  ${!ps.length ? `<div class="notice small" style="margin:10px 0">${L('Sem plantel carregado: os ajustes seguem só a estrutura da tática; as substituições e as instruções individuais precisam do plantel.', 'No squad loaded: adjustments follow the tactic’s structure only; substitutions and player instructions need the squad.')}</div>` : ''}
  <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start;margin-top:12px">
    <div class="panel">
      <p class="small" style="margin-top:0"><b>${esc(r.sc.n)}.</b> ${esc(r.sc.d)}</p>
      ${sec(L('Mentalidade', 'Mentality'), ment ? `<p class="small"><b>${esc(ment.from)} → ${esc(ment.to)}</b> — ${esc(ment.why)}</p>` : `<p class="small muted">${L('Mantém-se.', 'Unchanged.')}</p>`)}
      ${sec(L('Instruções de equipa', 'Team instructions'), tiRows.length ? tbl(tiRows.map(c => `<tr><td style="width:30%">${esc(c.label)}</td><td style="width:28%"><span class="muted">${esc(c.from)}</span> → <b>${esc(c.to)}</b></td><td class="small muted">${esc(c.why)}</td></tr>`)) : `<p class="small muted">${L('Sem mudanças.', 'No changes.')}</p>`)}
      ${sec(L('Papéis', 'Roles'), roleRows.length ? tbl(roleRows.map(c => `<tr><td style="width:18%"><b>${esc(c.code)}</b> <span class="chip ${c.phase === 'IP' ? 'ip' : 'oop'}">${c.phase}</span></td><td style="width:20%">${esc(c.player || '')}</td><td style="width:30%"><span class="muted">${esc(c.from)}</span> → <b>${esc(c.to)}</b></td><td class="small muted">${esc(c.why)}</td></tr>`)) : `<p class="small muted">${L('Os papéis actuais já servem este cenário (nenhuma troca melhorava o conjunto).', 'The current roles already suit this scenario (no swap improved the whole).')}</p>`)}
      ${sec(L('Instruções individuais', 'Player instructions'), piRows.length ? tbl(piRows.map(c => `<tr><td style="width:18%"><b>${esc(c.code)}</b></td><td style="width:20%">${esc(c.player)}</td><td style="width:30%">${c.removed ? `<s>${esc(c.to)}</s>` : `<b>${esc(c.to)}</b>`}</td><td class="small muted">${esc(c.why)}</td></tr>`)) : '')}
      ${sec('Tactical Tweaks', r.tweaks.length ? `<ul class="clean small">${r.tweaks.map(x => `<li><b>${esc(x.n)}</b> — ${esc(x.why)}</li>`).join('')}</ul>` : '')}
      ${sec(L('Substituições sugeridas', 'Suggested substitutions'), r.subs.length ? tbl(r.subs.map(x => `<tr><td style="width:18%"><b>${esc(x.code)}</b></td><td style="width:42%"><span class="muted">${esc(x.out)}</span> → <b>${esc(x.in)}</b></td><td class="small muted">${esc(x.why)}</td></tr>`)) : '')}
      ${sec(L('Instruções de adversário', 'Opposition instructions'), r.ois.length ? tbl(r.ois.map(x => `<tr><td style="width:30%"><b>${esc(x.p)}</b> <span class="muted small">${esc(x.code)}</span></td><td>${x.ois.map(o => `<span class="chip">${esc(o)}</span>`).join(' ')}</td></tr>`)) : '')}
      ${r.notes.length ? `<div class="plan-sec">${r.notes.map(n => `<p class="small">💡 ${esc(n)}</p>`).join('')}</div>` : ''}
    </div>
    <div class="grid">
      <div class="panel"><h3>${L('Impacto', 'Impact')}</h3>
        <table><tbody>
          <tr><td>${L('Compromisso ofensivo', 'Attacking commitment')}</td><td>${delta(r.intentBefore.att, r.intentAfter.att)}</td></tr>
          <tr><td>${L('Segurança defensiva', 'Defensive security')}</td><td>${delta(r.intentBefore.sec, r.intentAfter.sec)}</td></tr>
          <tr><td colspan="2" class="small muted" style="padding-top:10px">${L('Sinergia entre papéis (coerência)', 'Role synergy (coherence)')}</td></tr>
          ${['build', 'att', 'def', 'trans'].map(ph => `<tr><td class="small">${esc(SYN_PHASES()[ph])}</td><td class="small">${delta(r.before.phases[ph].score, r.after.phases[ph].score)}</td></tr>`).join('')}
          <tr><td class="small">${L('Diagnóstico', 'Diagnosis')}</td><td class="small">${delta(r.auditBefore.overall, r.auditAfter.overall)}</td></tr>
        </tbody></table>
        <p class="small muted" style="margin-bottom:0">${L('Compromisso e segurança medem a intensidade (mentalidade, ritmo, pressão, quem fica atrás). A sinergia mede se os papéis continuam coerentes. Um plano para marcar troca segurança por compromisso — é o preço.', 'Commitment and security measure intensity (mentality, tempo, pressing, who stays back). Synergy measures whether the roles stay coherent. A plan to score trades security for commitment — that is the price.')}</p>
      </div>
      <div class="panel"><h3>${L('No jogo', 'In the game')}</h3><ol class="clean small">
        <li>${L('Guarde este plano como tática (botão acima) e recrie-o no FM27 como tática B ou C, a partir da Ficha.', 'Save this plan as a tactic (button above) and recreate it in FM27 as tactic B or C, using the Sheet.')}</li>
        <li>${L('Durante o jogo, mude de tática no ecrã de táticas — ou use os Tactical Tweaks indicados para uma mudança rápida.', 'During the match, switch tactics on the tactics screen — or use the listed Tactical Tweaks for a quick change.')}</li>
        <li>${L('As instruções individuais só mudam quando a tática B/C é aplicada.', 'Player instructions only change when tactic B/C is applied.')}</li></ol></div>
    </div>
  </div>`;
}

function vSlotEditor(i) {
  const t = ST.tactic, s = t.slots[i];

  const p = pById(s.pid);
  const ipRoles = rolesFor(a.group, 'IP', a), oopRoles = rolesFor(b.group, 'OOP', b);
  const lab = (r) => { const sc = p ? (roleScore(p, r) || {}).score : null; return roleName(r) + (sc != null ? ` — ${sc}` : ''); };
  const ri = ROLE_BY_ID[s.ip], ro = ROLE_BY_ID[s.oop];
  const plist = players().map(q => ({ q, sc: slotScore(q, t, s) })).sort((x, y) => y.sc - x.sc);
  const roleBox = (r) => r ? `<div class="role-card"><b>${esc(roleName(r))}</b> <span class="chip ${r.phase === 'IP' ? 'ip' : 'oop'}">${r.phase}</span> ${srcTag(r)}
    <p class="small">${esc(r.desc)}</p><p class="small muted">💡 ${esc(r.tip)}</p>
    <div class="attrs"><b>Chave:</b> ${r.key.map(k => attrChip(k, p)).join('')}</div>
    <div class="attrs"><b>Preferidos:</b> ${r.pref.map(k => attrChip(k, p)).join('')}</div></div>` : '';

    ${players().length ? `<label class="f">Jogador${selectHTML([['', '— vazio —']].concat(plist.map(x => [x.q.id, `${x.q.name} (${x.sc})${x.q.posRaw ? ' · ' + x.q.posRaw : ''}`])), s.pid || '', `A.setPlayer(${i},this.value)`)}</label>` : ''}
    <div class="grid g2">
      <label class="f"><span>Papel com bola</span> (<span>${GROUPS[a.group]}</span>)${selectHTML(ipRoles.map(r => [r.id, lab(r)]), s.ip, `A.setRole(${i},'IP',this.value)`)}</label>
      <label class="f"><span>Papel sem bola</span> (<span>${GROUPS[b.group]}</span>)${selectHTML(oopRoles.map(r => [r.id, lab(r)]), s.oop, `A.setRole(${i},'OOP',this.value)`)}</label>
    </div>
    ${p ? `<div class="small"><span>Adequação:</span> ${fitBadge(slotScore(p, t, s))} · <span>melhores papéis IP aqui:</span> ${bestRolesForPlayer(p, a.group, 'IP', a).map(x => `${esc(x.r.name)} ${x.s}`).join(' · ')}</div>` : ''}

    <details><summary>${L(`Todas as instruções individuais (${(s.pis || []).length} activas) — cada uma soma complexidade`, `All player instructions (${(s.pis || []).length} active) — each one adds complexity`)}</summary>
      <div class="grid" style="margin-top:6px">${PLAYER_INSTRUCTIONS.map((pi, j) => `<label class="small"><input type="checkbox" ${(s.pis || []).includes(pi.n) ? 'checked' : ''} onchange="A.togglePI(${i}, ${j})"> <b>${esc(pi.n)}</b> — <span class="muted">${esc(pi.tip)}</span></label>`).join('')}</div>

function sheetText(t) {
  const L = [`${t.name}`, `Style: Clean Slate | Mentality: ${t.ment}`, `In Possession: ${t.ipForm} | Out of Possession: ${t.oopForm}`, '', L('PAPÉIS (IP / OOP)', 'ROLES (IP / OOP)')];
  t.slots.forEach(s => L.push(`${s.ipCode}${s.oopCode !== s.ipCode ? '→' + s.oopCode : ''}: ${ROLE_BY_ID[s.ip].name} / ${ROLE_BY_ID[s.oop].name}${s.pis && s.pis.length ? ' [' + s.pis.join('; ') + ']' : ''}`));
  L.push('', L('INSTRUÇÕES DE EQUIPA (só as que mudam)', 'TEAM INSTRUCTIONS (changes only)'));
  FM_SECTIONS.forEach(([sec, keys]) => { const ch = keys.filter(k => tiVal(t, k) !== TI_BY_KEY[k].def); if (ch.length) L.push(sec + ': ' + ch.map(k => `${TI_BY_KEY[k].n} = ${TI_BY_KEY[k].opts[tiVal(t, k)]}`).join(', ')); });
  return L.join('\n');
}

function labState() { if (!ST.lab) ST.lab = { port: 8765, status: null, jobs: [], job: null, err: '', busy: false }; return ST.lab; }
async function labCall(method, path, body, timeoutMs) {
  const LS = labState();
  const r = await window.__TAURI__.core.invoke('lab_request', { port: LS.port, method, path, body: body == null ? null : JSON.stringify(body), timeoutMs: timeoutMs || 4000 });
  let data = r.body; try { data = JSON.parse(r.body); } catch (e) {}
  if (r.status >= 400 || r.status === 0) throw new Error((data && data.error) || ('HTTP ' + r.status));
  return data;
}
let LAB_POLL = 0;
function labPoll() {
  clearTimeout(LAB_POLL); const LS = labState();
  if (!LS.job || !['queued', 'running'].includes(LS.job.status)) { busyEnd('lab-job'); return; }
  busyStart('lab-job', L('Motor do FM27: ', 'FM27 engine: ') + (LS.job.name || L('experiência', 'experiment')), { p: (LS.job.completed || 0) / Math.max(1, LS.job.total || 1),
    detail: `${LS.job.completed || 0}/${LS.job.total || 0} jogos${LS.job.eta_seconds ? ' · faltam ~' + Math.ceil(LS.job.eta_seconds / 60) + ' min' : ''}` });
  if (ST.view !== 'lab') return;
  LAB_POLL = setTimeout(async () => { try { LS.job = await labCall('GET', '/api/jobs/' + LS.job.id);
    const it = LS.jobs.find(j => j.id === LS.job.id); if (it) Object.assign(it, { status: LS.job.status, completed: LS.job.completed, total: LS.job.total });
    if (!['queued', 'running'].includes(LS.job.status)) toast('Experiência concluída no motor do FM27');
    render(); labPoll(); } catch (e) { LS.err = e.message; render(); } }, 3000);
}
const pct = (x) => x == null ? '—' : (x * 100).toFixed(0) + '%';
const f2 = (x) => x == null ? '—' : x.toFixed(2);
function ciBar(ci, unit) {
  if (!ci || ci.lo == null) return '<span class="muted small">—</span>';
  const span = Math.max(1, Math.abs(ci.lo), Math.abs(ci.hi)), X = (v) => 50 + v / span * 46;
  const col = ci.lo > 0 ? 'var(--good)' : ci.hi < 0 ? 'var(--crit)' : 'var(--warn)';
  return `<div class="cibar" title="95%: ${f2(ci.lo)} a ${f2(ci.hi)} ${unit}"><i class="zero"></i><b style="left:${X(ci.lo)}%;width:${X(ci.hi) - X(ci.lo)}%;background:${col}"></b><em style="left:${X(ci.mean)}%"></em></div>
    <div class="small"><b>${ci.mean >= 0 ? '+' : ''}${f2(ci.mean)}</b> ${unit} <span class="muted">(95%: ${f2(ci.lo)} a ${f2(ci.hi)})</span></div>`;
}

const A = {
  go(v, tab) { ST.view = v; if (tab && ST.tabs[v] !== undefined) ST.tabs[v] = tab; save(); render(true); },
  tab(v, tab) { ST.view = v; ST.tabs[v] = tab; save(); render(true); },

  // tática

  setMent(v) { ST.tactic.ment = v; save(); render(); },
  setForm(phase, v) {
    const t = ST.tactic;
    ST.tactic = retargetTactic(t, phase === 'IP' ? v : t.ipForm, phase === 'OOP' ? v : t.oopForm);
    ST.sel = null; save(); render();
  },
  setTI(k, v) { const d = TI_BY_KEY[k].def; v = +v; if (v === d) delete ST.tactic.ti[k]; else ST.tactic.ti[k] = v; save(); render(); },
  resetTI() { ST.tactic.ti = {}; save(); render(); toast('Instruções repostas'); },
  sel(i) { ST.sel = ST.sel === i ? null : i; render(); },
  pitch(m) { ST.pitchMode = m; render(); },
  setRole(i, phase, id) { ST.tactic.slots[i][phase === 'IP' ? 'ip' : 'oop'] = id; save(); render(); },
  setPlayer(i, pid) {
    const t = ST.tactic; const other = t.slots.findIndex((s, j) => j !== i && s.pid === pid && pid);
    if (other >= 0) t.slots[other].pid = t.slots[i].pid; // troca
    t.slots[i].pid = pid || null; save(); render();
  },
  togglePI(i, j) { const n = PLAYER_INSTRUCTIONS[j].n; const s = ST.tactic.slots[i]; s.pis = s.pis || []; const k = s.pis.indexOf(n); if (k >= 0) s.pis.splice(k, 1); else s.pis.push(n); save(); render(); },
  setOIs(v) { ST.tactic.ois = Math.max(0, +v || 0); save(); render(); },
  autoXI() { if (players().length < 11) return toast('Precisa de pelo menos 11 jogadores no plantel'); autoPickXI(ST.tactic, players()); save(); render(); toast('XI escolhido pela melhor adequação'); },
  clearXI() { ST.tactic.slots.forEach(s => s.pid = null); save(); render(); },
  newTactic() { ST.tactic = newTactic(ST.tactic.ipForm, ST.tactic.oopForm); ST.sel = null; save(); render(); },
  saveTactic() { const c = JSON.parse(JSON.stringify(ST.tactic)); c.savedAt = new Date().toISOString(); ST.saved = ST.saved.filter(x => x.name !== c.name); ST.saved.unshift(c); save(); render(); toast(L('Tática guardada: ', 'Tactic saved: ') + c.name); },
  loadSaved(i) { ST.tactic = JSON.parse(JSON.stringify(ST.saved[i])); ST.sel = null; save(); A.go('tactic', 'analyze'); },
  delSaved(i) { ST.saved.splice(i, 1); save(); render(); },
  exportTactic() { download((ST.tactic.name || 'tatica').replace(/[^\w\-]+/g, '_') + '.fm27tb.json', JSON.stringify({ kind: 'fm27tb-tactic', v: 1, tactic: ST.tactic }, null, 2)); },
  importJSON(input) {
    const f = input.files[0]; if (!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      ingestJSON(d, f.name);
    }).catch(() => toast('JSON inválido'));
  },
  useTemplate(id) { const tp = TEMPLATES.find(x => x.id === id); ST.tactic = tacticFromTemplate(tp); if (players().length >= 11) autoPickXI(ST.tactic, players()); ST.sel = null; save(); A.go('tactic', 'analyze'); },
  useSuggestion(i) { ST.tactic = JSON.parse(JSON.stringify(ST.sugg[i].t)); ST.sel = null; save(); A.go('tactic', 'analyze'); },
  applyPI(i, n) { const s = ST.tactic.slots[i]; s.pis = s.pis || []; if (!s.pis.includes(n)) s.pis.push(n); save(); render(); toast(n + ' aplicado'); },
  applyAllPIs() { const pm = Object.fromEntries(players().map(p => [p.id, p])); let n = 0;
    ST.tactic.slots.forEach(s => { const a = slotInfo(ST.tactic.ipForm, s.ipCode); recommendPIs(pm[s.pid], ROLE_BY_ID[s.ip], ROLE_BY_ID[s.oop], a.group).slice(0, 1).forEach(r => { s.pis = s.pis || []; if (!s.pis.includes(r.pi)) { s.pis.push(r.pi); n++; } }); });
    save(); render(); toast(L(n + ' instruções aplicadas (a principal de cada jogador — mais instruções = mais complexidade)', n + ' instructions applied (each player’s main one — more instructions = more complexity)')); },
  applyPlan(list) { const rep = ST._oppRep; if (!rep) return; const items = list === 'all' ? rep.plan : [rep.plan[list]];
    items.forEach(x => { const d = TI_BY_KEY[x.ti]; if (x.v === d.def) delete ST.tactic.ti[x.ti]; else ST.tactic.ti[x.ti] = x.v; });
    save(); render(); toast(items.length === 1 ? `${TI_BY_KEY[items[0].ti].n}: ${TI_BY_KEY[items[0].ti].opts[items[0].v]}` : 'Plano aplicado à tática'); },
  applySpTip(i) { const tp = ST._sp && ST._sp.tips[i]; if (!tp || !tp.ti) return; const d = TI_BY_KEY[tp.ti]; if (tp.v === d.def) delete ST.tactic.ti[tp.ti]; else ST.tactic.ti[tp.ti] = tp.v; save(); render(); toast(`${d.n}: ${d.opts[tp.v]}`); },
  genOpt(k, v) { genOpts()[k] = v; save(); render(); },
  genToggle(k, id) { const g = genOpts(); const i = g[k].indexOf(id); if (i >= 0) g[k].splice(i, 1); else if (k !== 'youth' || g[k].length < 3) g[k].push(id); else toast('Máximo 3 jovens'); save(); render(); },
  async genRun() {
    const g = genOpts(); if (BUSY.gen) return;
    const t0 = performance.now();
    g.res = await withBusy('gen', 'A gerar a tática', (prog) => generateTacticAsync(players(), { expect: g.expect, must: g.must, star: g.star || null, youth: g.youth },
      (s) => prog(s.total ? s.done / s.total : null, `${s.label}${s.total > 1 ? ` (${Math.min(s.done + 1, s.total)}/${s.total})` : ''}`)));
    g.pick = 0; save(); render(); toast(L('Tática gerada em ', 'Tactic generated in ') + ((performance.now() - t0) / 1000 < 1 ? Math.round(performance.now() - t0) + ' ms' : ((performance.now() - t0) / 1000).toFixed(1) + ' s'));
  },
  genPick(i) { genOpts().pick = i; save(); render(); },
  genTactic() { const g = genOpts(); const all = [g.res.main, ...g.res.alts]; const t = JSON.parse(JSON.stringify((all[g.pick] || all[0]).t));
    const pm = Object.fromEntries(players().map(p => [p.id, p]));
    t.slots.forEach(s => { const r = recommendPIs(pm[s.pid], ROLE_BY_ID[s.ip], ROLE_BY_ID[s.oop], slotInfo(t.ipForm, s.ipCode).group)[0]; s.pis = r ? [r.pi] : []; });
    t.name = L(`${t.ipForm} — gerada para ${ST.myClub || 'o plantel'}`, `${t.ipForm} — generated for ${ST.myClub || 'the squad'}`); t.source = 'gerador'; return t; },
  genUse(sim, tab) { const t = A.genTactic(); ST.tactic = t; ST.saved = ST.saved.filter(x => x.name !== t.name); ST.saved.unshift(JSON.parse(JSON.stringify(t))); ST.sugg = null; save();
    if (sim) return A.simOpen(); if (tab === 'training') return A.go('training'); A.tab('tactic', tab || 'analyze'); toast('Tática gerada carregada e guardada'); },
  genCopy() { const txt = sheetText(A.genTactic()); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Tática copiada — pronta para colar no fórum/Discord'), () => download('tatica-gerada.txt', txt, 'text/plain')); },
  labSet(k, v) { labState()[k] = v; save(); },
  async labConnect() {
    const LS = labState(); if (BUSY['lab-connect']) return; LS.busy = true; LS.err = ''; render();
    const ports = [LS.port, ...Array.from({ length: 16 }, (_, i) => 8765 + i)].filter((p, i, a) => a.indexOf(p) === i);
    busyStart('lab-connect', 'A procurar o Tactics Lab', { p: 0 });
    for (const [i, p] of ports.entries()) {
      LS.port = p; busyUpdate('lab-connect', { p: i / ports.length, detail: 'porta ' + p });
      try { const s = await labCall('GET', '/api/status', null, 400); if (s && s.engine) { LS.status = s; break; } } catch (e) { /* tenta a seguinte */ }
    }
    LS.busy = false; busyEnd('lab-connect');
    if (!LS.status) { LS.err = 'Não encontrei o Tactics Lab. Abra-o primeiro (com o Steam aberto) e confirme a porta no endereço que ele mostra.'; LS.port = ports[0]; render(); return; }
    save(); await A.labJobs();
  },
  async labJobs() { const LS = labState(); busyStart('lab-jobs', 'A ler as experiências do Tactics Lab'); try { const j = await labCall('GET', '/api/jobs?brief=1'); LS.jobs = (Array.isArray(j) ? j : []).sort((a, b) => (b.created || 0) - (a.created || 0)); LS.err = ''; } catch (e) { LS.err = e.message; LS.status = null; } busyEnd('lab-jobs'); render(); },
  async labOpen(id) { const LS = labState(); try { LS.job = await withBusy('lab-open', 'A abrir a experiência', () => labCall('GET', '/api/jobs/' + id, null, 15000)); LS.err = ''; } catch (e) { LS.err = e.message; } render(); },
  async labCancel(id) { try { await labCall('POST', '/api/cancel', { id }); toast('Cancelamento pedido'); setTimeout(() => A.labOpen(id), 800); } catch (e) { toast(e.message); } },
  async labMore(id) {
    const LS = labState(), n = LS.more || 100; if (BUSY['lab-more']) return;
    busyStart('lab-more', L(`A pedir mais ${n} jogos ao motor do FM27`, `Asking the FM27 engine for ${n} more matches`), { detail: L('a preparar as táticas A e B', 'preparing tactics A and B') });
    try {
      const pkg = await labCall('GET', '/api/jobs/' + id + '/export', null, 8000);
      const sc = pkg.scenarios || {}; if (!sc.B) throw new Error('Esta experiência não tem a tática B exportável.');
      const used = ((pkg.provenance && pkg.provenance.seeds) || []); const start = used.length ? Math.max(...used) + 1 : 1;
      const seeds = Array.from({ length: n }, (_, i) => start + i);
      const body = { scenario: sc.B, seeds, event_details: false, name: `${(pkg.summary && pkg.summary.name) || 'Experiência'} · +${n}` };
      if (sc.A) body.reference = sc.A;
      const r = await labCall('POST', '/api/run', body, 15000);
      busyEnd('lab-more'); toast(`${n} jogos em fila no motor do FM27`); await A.labJobs(); await A.labOpen(r.id);
    } catch (e) { busyEnd('lab-more'); toast(e.message); LS.err = e.message; render(); }
  },
  async labFmf(id, g) {
    if (BUSY['lab-fmf']) return;
    busyStart('lab-fmf', L(`A exportar o .fmf da tática ${g}`, `Exporting tactic ${g}’s .fmf`), { detail: L('o próprio jogo gera e verifica o ficheiro', 'the game itself writes and verifies the file'), slow: L('o motor do FM27 está a serializar e a reler a tática — até 45 s', 'the FM27 engine is serialising and re-reading the tactic — up to 45 s'), slowAfter: 8 });
    try {
      const pkg = await labCall('GET', '/api/jobs/' + id + '/export', null, 8000);
      const sc = pkg.scenarios && pkg.scenarios[g]; if (!sc) throw new Error(L('Tática ' + g + ' indisponível', 'Tactic ' + g + ' unavailable'));
      const r = await labCall('POST', '/api/export-fmf', { side: 0, scenario: sc, name: `${(pkg.summary && pkg.summary.name) || 'Tatica'} ${g}`.slice(0, 90) }, 60000);
      const bin = Uint8Array.from(atob(r.file_base64), c => c.charCodeAt(0));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bin], { type: 'application/octet-stream' })); a.download = r.filename; document.body.appendChild(a); a.click(); a.remove();
      toast('.fmf exportado e verificado pelo jogo — importe-o no FM27');
    } catch (e) { toast(e.message); } finally { busyEnd('lab-fmf'); }
  },
  async labCatalog() {
    busyStart('lab-cat', 'A exportar o catálogo do motor');
    try { const cat = await labCall('GET', '/api/catalog', null, 8000), def = await labCall('GET', '/api/defaults', null, 8000);
      download('tactics-lab-catalogo.json', JSON.stringify({ catalog: cat, defaults: def }, null, 1)); toast('Catálogo exportado'); } catch (e) { toast(e.message); } finally { busyEnd('lab-cat'); }
  },
  labImport(input) { const f = input.files[0]; if (!f) return; f.text().then(t => { try { ingestJSON(JSON.parse(t), f.name); } catch (e) { toast('JSON inválido'); } }); },
  lang(l) {
    ST.lang = LANG = l;
    // o relatório do gerador guarda as razões no idioma em que foi feito: recalcula-as no novo idioma
    if (ST.gen && ST.gen.res && players().length >= 11) [ST.gen.res.main, ...ST.gen.res.alts].forEach(r => { const g = generateTIs(r.t, players(), ST.gen.res.expect); r.reasons = g.reasons; r.mentWhy = g.mentWhy; });
    save(); render();
  },
  sheetNames(v) { ST.sheetNames = v; save(); render(); },
  planK(k) { ST.planK = k; save(); render(); },
  planTactic() { const r = ST._plan || gamePlan(ST.tactic, players(), ST.planK || 'chase', { opp: oppPlayers() }); return JSON.parse(JSON.stringify(r.t)); },
  planSave() { const t = A.planTactic(); ST.saved = ST.saved.filter(x => x.name !== t.name); ST.saved.unshift(t); save(); render(); toast(L('Plano guardado: ', 'Plan saved: ') + t.name); },
  planUse() { const t = A.planTactic(); ST.saved = ST.saved.filter(x => x.name !== t.name); ST.saved.unshift(JSON.parse(JSON.stringify(t))); ST.tactic = t; save(); A.tab('tactic', 'analyze'); toast(L('Plano carregado no analisador', 'Plan loaded into the analyser')); },
  planCopy() { const r = ST._plan; if (!r) return; const lines = [r.t.name, ''];
    r.changes.forEach(c => lines.push(c.kind === 'ti' || c.kind === 'ment' ? `${c.label}: ${c.from} → ${c.to}` : c.kind === 'role' ? `${c.code} (${c.phase}) ${c.player}: ${c.from} → ${c.to}` : `${c.code} ${c.player}: ${c.removed ? '−' : '+'} ${c.to}`));
    r.tweaks.forEach(x => lines.push('Tactical Tweak: ' + x.n)); r.subs.forEach(x => lines.push(`${L('Substituição', 'Substitution')} ${x.code}: ${x.out} → ${x.in}`));
    const txt = lines.join('\n'); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(L('Plano copiado', 'Plan copied')), () => download('plano.txt', txt, 'text/plain')); },

  exportAll() { download('fm27tb_backup.json', JSON.stringify({ kind: 'fm27tb-all', v: 1, tactic: ST.tactic, squad: ST.squad, saved: ST.saved }, null, 2)); },
  wipe() { if (!confirm(T('Apagar tática, plantel e táticas guardadas deste computador?'))) return; localStorage.removeItem(STORE_KEY); location.reload(); },
  print() { window.print(); },
  copySheet() { const txt = sheetText(ST.tactic); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Ficha copiada'), () => download((ST.tactic.name || 'tatica') + '.txt', txt, 'text/plain')); },
};

;
// ---- ui/main.js
// ============================================================
// Navegação, render, arrastar-e-largar e ponte com a app instalada
// ============================================================
const NAV = [
  ['home', 'Início', '⌂'],
  ['team', 'A minha equipa', '☰'],
  ['tactic', 'Tática', '◎'],
  ['lab', 'Laboratório', '⚗'],
  ['training', 'Treino', '◷'],
  ['bible', 'Bíblia', '◆'],
  ['settings', 'Definições', '⚙'],
];
const TABS = {
  team: [['squad', 'Plantel'], ['gen', 'Gerar tática'], ['xi', 'Melhor XI & sistemas'], ['opp', 'Adversário']],
  tactic: [['analyze', 'Analisar'], ['sim', 'Campo animado'], ['plans', 'Situações de jogo'], ['setpieces', 'Bolas paradas'], ['sheet', 'Ficha para o FM27'], ['import', 'Importar']],
  bible: [['roles', 'Papéis'], ['ti', 'Instruções'], ['concepts', 'Conceitos & adversários'], ['btraining', 'Treino & Effectiveness']],
};

function renderNav() {
  const sq = players().length, op = oppPlayers().length;
  return `<div class="brand"><div class="logo">FM27</div><div class="lbl"><b>Tactical Bible</b><span>v${VERSION}${DESKTOP ? ' · app' : ' · browser'}</span></div>
      <button class="nav-mini" onclick="A.navMini()" title="${ST.ui.navMini ? 'Expandir menu' : 'Recolher menu'} (Ctrl+B)" aria-label="${ST.ui.navMini ? 'Expandir menu' : 'Recolher menu'}">${ST.ui.navMini ? '»' : '«'}</button></div>` +
    NAV.map(([id, label, ic]) => `<button class="nav-btn ${ST.view === id ? 'active' : ''}" onclick="A.go('${id}')" title="${label}" aria-label="${label}"><span class="ic">${ic}</span><span class="lbl">${label}</span></button>`).join('') +
    `<div id="busy" aria-live="polite"></div>
    <div class="aside-status">
      <div><span class="dot ${sq ? 'ok' : ''}"></span>${sq ? `${L(`${sq} jogadores`, `${sq} players`)}${ST.myClub ? ' · ' + esc(ST.myClub) : ''}` : 'Sem plantel'}</div>
      <div><span class="dot ${op ? 'ok' : ''}"></span>${op ? 'Adversário carregado' : 'Sem adversário'}</div>
      ${DESKTOP ? `<div><span class="dot ${ST.auto.save && !ST.auto.saveErr ? 'ok' : ''}"></span>Save: ${SAVE_BUSY ? 'a ler…' : ST.auto.saveErr ? 'erro (ver Definições)' : ST.auto.save ? 'automático' : 'manual'}</div>
      <div><span class="dot ${ST.auto.on && ST.f9Found ? 'ok' : ''}"></span>F9: ${!ST.f9Found ? 'plugin não encontrado' : ST.auto.on ? 'automático' : 'manual'}</div>` : ''}
    </div>
    <div class="aside-foot"><div class="seg lang-seg" role="group" aria-label="Idioma">${[['en', 'EN'], ['pt', 'PT']].map(([k, n]) => `<button class="${LANG === k ? 'on' : ''}" onclick="A.lang('${k}')" aria-pressed="${LANG === k}">${n}</button>`).join('')}</div>
      <div class="lbl" style="margin-top:8px">Arraste qualquer ficheiro (CSV, HTML, .fmf, .json) para a janela.</div></div>`;
}

function tabsHTML(view) {
  return `<div class="tabs" role="tablist">${TABS[view].map(([k, n]) => `<button role="tab" aria-selected="${ST.tabs[view] === k}" class="${ST.tabs[view] === k ? 'on' : ''}" onclick="A.tab('${view}','${k}')">${n}</button>`).join('')}</div>`;
}

function render(scrollTop) {
  const main = document.getElementById('main'); const y = main.scrollTop;
  document.getElementById('nav').innerHTML = renderNav();
  const v = ST.view, tab = ST.tabs[v];
  const isSim = v === 'tactic' && tab === 'sim';
  if (!isSim) cancelAnimationFrame(SIM.raf);
  let body;
  if (v === 'home') body = vHome();
  else if (v === 'team') body = tabsHTML('team') + (tab === 'squad' ? vSquad() : tab === 'gen' ? vGen() : tab === 'xi' ? vXI() : vOpp());
  else if (v === 'tactic') body = tabsHTML('tactic') + (tab === 'analyze' ? vTactic() : tab === 'sim' ? vSim() : tab === 'plans' ? vGamePlans() : tab === 'setpieces' ? vSetPieces() : tab === 'sheet' ? vSheet() : vImport());
  else if (v === 'training') body = vTraining();
  else if (v === 'lab') body = vLab();
  else if (v === 'bible') body = tabsHTML('bible') + (tab === 'roles' ? vRoles() : tab === 'ti' ? vTI() : tab === 'concepts' ? vConcepts() : vBTraining());
  else body = vSettings();
  main.innerHTML = body;
  document.querySelector('.app').classList.toggle('mini', !!ST.ui.navMini);
  paintBusy();
  translateDOM(document.getElementById('nav')); translateDOM(main);
  decoratePanels(v + '/' + (ST.tabs[v] || ''));          // depois de traduzir: o rótulo de acessibilidade já vem no idioma certo
  const ov = document.getElementById('dropov'); if (ov) ov.textContent = T('Largue o ficheiro — plantel (CSV/HTML/JSON), tática .fmf ou cópia .json');
  document.documentElement.lang = LANG;
  main.scrollTop = scrollTop ? 0 : y;
  if (isSim) simStart();
  if (v === 'lab') labPoll();
  if (v === 'bible') initClips(); else stopClips();
}

// ---------- actividade: tudo o que demora mostra que está a trabalhar ----------
// busyStart(chave, texto) → barra no topo + cartão com tempo decorrido; busyUpdate(chave, {p: 0–1, detail}); busyEnd(chave).
// Os botões com data-busy="chave" ficam bloqueados e com indicador enquanto a tarefa corre.
const BUSY = {};
let BUSY_TICK = 0;
function busyStart(key, label, opts = {}) { BUSY[key] = { label, start: Date.now(), p: opts.p ?? null, detail: opts.detail || '', slow: opts.slow || null, slowAfter: opts.slowAfter || 12 }; paintBusy(); }
function busyUpdate(key, patch) { if (BUSY[key]) { Object.assign(BUSY[key], patch); paintBusy(); } }
function busyEnd(key) { delete BUSY[key]; paintBusy(); }
async function withBusy(key, label, fn, opts) {
  busyStart(key, label, opts);
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));   // deixa a janela desenhar o indicador antes de trabalhar
  try { return await fn((p, detail) => busyUpdate(key, { p, ...(detail != null ? { detail } : {}) })); }
  finally { busyEnd(key); }
}
function paintBusy() {
  const keys = Object.keys(BUSY), bar = document.getElementById('topbar'), box = document.getElementById('busy');
  if (!bar || !box) return;
  const one = keys.length === 1 && BUSY[keys[0]].p != null ? BUSY[keys[0]].p : null;
  bar.className = keys.length ? (one != null ? 'on det' : 'on') : '';
  bar.firstElementChild.style.width = one != null ? Math.round(one * 100) + '%' : '';
  box.innerHTML = keys.map(k => { const b = BUSY[k], s = Math.floor((Date.now() - b.start) / 1000);
    const extra = b.slow && s >= b.slowAfter ? b.slow : b.detail;
    const tip = `${b.label}${b.p != null ? ' — ' + Math.round(b.p * 100) + '%' : ''}${extra ? ' — ' + extra : ''}`;
    return `<div class="busy-item" role="status" title="${esc(tip)}"><span class="spin" aria-hidden="true"></span>${b.p != null ? `<span class="busy-pct">${Math.round(b.p * 100)}%</span>` : ''}<div class="busy-body"><b>${esc(b.label)}</b>
      ${b.p != null ? `<div class="busy-bar"><i style="width:${Math.round(b.p * 100)}%"></i></div>` : ''}
      <span class="small muted">${[b.p != null ? Math.round(b.p * 100) + '%' : '', s >= 1 ? s + ' s' : '', extra ? esc(extra) : ''].filter(Boolean).join(' · ') || 'a começar…'}</span></div></div>`; }).join('');
  box.className = keys.length ? 'on' : '';
  document.querySelectorAll('[data-busy]').forEach(el => { const on = keys.includes(el.dataset.busy); el.disabled = on; el.classList.toggle('is-busy', on); el.setAttribute('aria-busy', String(on)); });
  translateDOM(box);
  clearInterval(BUSY_TICK); if (keys.length) BUSY_TICK = setInterval(paintBusy, 500);
}

// ---------- painéis que fecham e abrem (estado guardado por ecrã e título) ----------
function decoratePanels(scope) {
  document.querySelectorAll('#main .panel').forEach(p => {
    const first = p.firstElementChild; if (!first || p.classList.contains('empty') || p.hasAttribute('data-fixed')) return;
    const h = /^H[23]$/.test(first.tagName) ? first : (first.classList.contains('row') || first.classList.contains('score-ring') ? first.querySelector('h2,h3') : null);
    if (!h || !p.children[1]) return;                       // sem corpo, nada para recolher
    const key = scope + '|' + h.textContent.replace(/\s+/g, ' ').trim().slice(0, 60);
    const titleText = h.textContent.replace(/\s+/g, ' ').trim().replace(/^\d+(?=\D)/, '');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'pc-toggle'; btn.textContent = '▾';
    const set = (c) => { p.classList.toggle('collapsed', c); btn.textContent = c ? '▸' : '▾'; btn.setAttribute('aria-expanded', String(!c)); btn.title = c ? L('Expandir', 'Expand') : L('Recolher', 'Collapse'); btn.setAttribute('aria-label', btn.title + ': ' + T(titleText)); };
    btn.onclick = (e) => { e.stopPropagation(); const c = !p.classList.contains('collapsed'); set(c); if (c) ST.ui.collapsed[key] = 1; else delete ST.ui.collapsed[key]; save(); };
    h.prepend(btn); h.classList.add('pc-title'); h.onclick = (e) => { if (e.target === h) btn.click(); };
    p.classList.add('collapsible'); set(!!ST.ui.collapsed[key]);
  });
}

// ---------- ficheiros: rota única para tudo o que entra ----------
function ingestJSON(d, name) {
  const job = jobFromAny(d);
  if (job) { labState().job = job; ST.view = 'lab'; render(true); toast(L('Experiência importada: ', 'Experiment imported: ') + (job.name || job.id)); return; }
  if (d.kind === 'fm27tb-tactic' && d.tactic) { ST.tactic = d.tactic; save(); A.go('tactic', 'analyze'); toast('Tática importada'); }
  else if (d.kind === 'fm27tb-all') { Object.assign(ST, { tactic: d.tactic || ST.tactic, squad: d.squad || ST.squad, opp: d.opp || ST.opp, saved: d.saved || [], myClub: d.myClub || ST.myClub }); save(); render(true); toast('Dados restaurados'); }
  else if (Array.isArray(d) || Array.isArray(d.players)) {
    // JSON de outras ferramentas (ex.: FMLibreEditor): lista de objectos → tabela
    const flat = (o, pre = '', out = {}) => { Object.entries(o || {}).forEach(([k, v]) => { if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, pre + k + '_', out); else out[pre + k] = Array.isArray(v) ? v.join(', ') : v; }); return out; };
    const rows = (Array.isArray(d) ? d : d.players).map(r => flat(r)); const keys = [...new Set(rows.flatMap(r => Object.keys(r)))];
    const csv = [keys.join('\t')].concat(rows.map(r => keys.map(k => String(r[k] ?? '').replace(/\t/g, ' ')).join('\t'))).join('\n');
    ingestSquadText(csv, name); render();
  } else toast('Ficheiro JSON não reconhecido');
}
async function ingestFile(f) {
  const n = f.name.toLowerCase();
  if (n.endsWith('.fmf')) { ST.tabs.tactic = 'import'; ST.view = 'tactic'; render(true); return A.fmf(f); }
  const txt = await withBusy('file', L('A ler ', 'Reading ') + f.name, () => f.text(), { detail: (f.size / 1048576).toFixed(1) + ' MB' });
  busyStart('file', L('A interpretar ', 'Parsing ') + f.name); await new Promise(r => setTimeout(r, 30));
  try { return ingestParsed(txt, f, n); } finally { busyEnd('file'); }
}
function ingestParsed(txt, f, n) {
  if (n.endsWith('.json')) { try { return ingestJSON(JSON.parse(txt), f.name); } catch (e) { return toast('JSON inválido'); } }
  const where = ingestSquadText(txt, f.name);
  if (where) { ST.view = 'team'; ST.tabs.team = where === 'opp' ? 'opp' : 'squad'; }
  render(true);
}
function setupDnD() {
  let depth = 0; const ov = document.getElementById('dropov');
  window.addEventListener('dragenter', (e) => { if (![...e.dataTransfer.types].includes('Files')) return; depth++; ov.classList.add('on'); });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) ov.classList.remove('on'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); depth = 0; ov.classList.remove('on'); [...e.dataTransfer.files].forEach(ingestFile); });
}

// ---------- app instalada: apanha o último F9 do FM View Exporter ----------
let POLLING = false;
async function desktopPoll(force) {
  if (!DESKTOP || (!ST.auto.on && !force) || POLLING) return;
  POLLING = true;
  try {
    const r = await window.__TAURI__.core.invoke('latest_export', { customDir: ST.auto.dir || null, since: ST.auto.mtime || null });
    if (r && r.content) {
      ST.auto.mtime = r.modified; ST.auto.last = r.name;
      busyStart('f9', 'A carregar a exportação F9', { detail: r.name }); await new Promise(res => setTimeout(res, 30));
      let where; try { where = ingestSquadText(r.content, r.name + ' (F9)'); } finally { busyEnd('f9'); }
      save(); if (where) render();
    } else if (force) toast('Nenhuma exportação nova encontrada');
  } catch (e) { if (force) toast('Não consegui ler a pasta de exportação'); }
  POLLING = false;
}
// ---------- app instalada: lê o save (.fm) com o fmsave sempre que o jogo grava ----------
let SAVE_BUSY = false;
async function savePoll(force) {
  if (!DESKTOP || (!ST.auto.save && !force) || SAVE_BUSY) return;
  let info = null;
  try { info = await window.__TAURI__.core.invoke('latest_save', { customDir: ST.auto.saveDir || null }); } catch (e) { return; }
  ST.lastSave = info;
  if (!info) { if (force) toast('Não encontrei saves do FM27 — indique a pasta em Definições'); return; }
  if (!force && info.modified <= (ST.auto.saveMtime || 0)) return;
  SAVE_BUSY = true; ST.auto.saveMtime = info.modified;           // marca já, para não repetir em ciclo se falhar
  busyStart('save', L('A ler o save ', 'Reading save ') + info.name, { detail: (info.size / 1048576).toFixed(0) + ' MB · ' + L('lê uma cópia, o save não é alterado', 'reads a copy, the save is not changed'),
    slow: L('na primeira leitura o fmsave é descarregado e o save inteiro é analisado — pode demorar 1–2 minutos', 'on the first read fmsave is downloaded and the whole save is analysed — it can take 1–2 minutes'), slowAfter: 12 }); render();
  try {
    const r = await window.__TAURI__.core.invoke('export_save', { path: info.path });
    ST.auto.saveErr = ''; ST.auto.saveLast = `${r.save} · ${new Date(r.modified * 1000).toLocaleString('pt-PT')}`;
    ingestSquadText(r.content, r.save + ' (save)', { force: 'squad' });
  } catch (e) { ST.auto.saveErr = String(e); toast('Não consegui ler o save — veja Definições'); }
  SAVE_BUSY = false; busyEnd('save'); save(); render();
}

async function desktopDirs() {
  if (!DESKTOP) return [];
  try { const d = await window.__TAURI__.core.invoke('export_dirs', { customDir: ST.auto.dir || null }); return Array.isArray(d) ? d : []; } catch (e) { return []; }
}

document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href^="https://"]');
  if (!a || !DESKTOP) return;
  e.preventDefault(); window.__TAURI__.core.invoke('open_url', { url: a.href }).catch(() => toast(a.href));
});
window.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); A.navMini(); } });
window.addEventListener('DOMContentLoaded', () => {
  load(); LANG = ST.lang || 'en'; applyTheme(); render(); setupDnD();
  if (DESKTOP) {
    desktopPoll(); setInterval(desktopPoll, 3000); savePoll(); setInterval(savePoll, 10000);
    const chk = () => desktopDirs().then(d => { const f = d.some(x => x[1]); if (f !== ST.f9Found) { ST.f9Found = f; render(); } });
    chk(); setInterval(chk, 30000);
  }
});
