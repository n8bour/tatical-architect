# Build da app instalável — optimizado para ser rápido.
# Os runners Linux estão fixados (ubuntu-24.04 / 22.04) para uma mudança do ubuntu-latest não partir o build.
#  • por defeito só Windows (instalador .exe + executável portátil)
#  • cache do Rust entre execuções (2.ª execução em ~2–3 min)
#  • perfil de release sem LTO e dependências com opt-level 1
#  • a CLI do Tauri vem pré-compilada via npx (sem npm install)
# A cada push para o main: lê a versão de src-tauri/tauri.conf.json e, se o Release v<versão>
# ainda não existir, compila e publica-o com as notas de .github/RELEASE_NOTES.md.
# Se a versão já foi publicada, nada é compilado (subir a versão = publicar).
name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Incluir também macOS e Linux (mais lento)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.p.outputs.platforms }}
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Versão
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          UI=$(sed -n "s/^const VERSION = '\(.*\)';/\1/p" src/ui/state.js)
          if [ "$VER" != "$PKG" ] || [ "$VER" != "$CARGO" ] || [ "$VER" != "$UI" ]; then
            echo "::error::Versões diferentes: tauri.conf.json=$VER package.json=$PKG Cargo.toml=$CARGO src/ui/state.js=$UI"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$VER já publicada — nada a fazer."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do motor
        run: node tests/engine.test.cjs
      - name: Gerar app/index.html
        run: node build.mjs
      - id: p
        name: Escolher plataformas
        run: |
          if [ "${{ github.event.inputs.all_platforms }}" = "true" ]; then
            echo 'platforms=["windows-latest","macos-latest","ubuntu-22.04"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: test
    timeout-minutes: 20
    if: needs.test.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.test.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}
      - name: Dependências Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Gerar app/index.html
        run: node build.mjs
      - name: Compilar
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows-latest) B=nsis ;;
            macos-latest)   B=dmg ;;
            *)              B=appimage ;;
          esac
          npx --yes @tauri-apps/cli@2 build --bundles "$B"
      - name: Juntar ficheiros
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          cp src-tauri/target/release/fm27-tactical-bible.exe "dist/FM27-Tactical-Bible-portatil.exe" 2>/dev/null || true
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: FM27-Tactical-Bible-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Testes de interface (Playwright), em paralelo com o build (~3 min vs ~4 min: não atrasam o release).
  # Limite de 10 min: se algo encravar, falha em vez de bloquear.
  layout:
    needs: test
    if: needs.test.outputs.exists == 'false'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fixado em ubuntu-24.04: o ubuntu-latest passou a 26.04, que o Playwright 1.56 ainda não suporta.
      - name: Instalar Chromium (Playwright)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Gerar app/index.html
        run: node build.mjs
      - name: Verificar layout em inglês (sem sobreposições)
        run: python tests/ui_layout.py
      - name: Verificar layout em português (passagem rápida)
        run: python tests/ui_layout.py
        env:
          LAYOUT_LANG: pt
          LAYOUT_QUICK: '1'
      - name: Verificar indicadores de actividade
        run: python tests/ui_busy.py
      - name: Verificar cobertura de idioma (nada em português com a app em inglês)
        run: python tests/ui_i18n.py
      - name: Verificar nomes do FM em português (nada em inglês com a app em português)
        run: python tests/ui_pt_terms.py
      - name: Auditoria de idioma nos dois sentidos (vocabulário tirado do código)
        run: python tests/ui_lang_audit.py


  # Publica o Release v<versão> (só se ainda não existir; testes, build e layout têm de passar).
  release:
    needs: [test, build, layout]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FM27-Tactical-Bible-*
          path: out
          merge-multiple: true
      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER="${{ needs.test.outputs.version }}"
          ls -la out
          gh release create "v$VER" out/* --target "${{ github.sha }}" \
            --title "FM27 Tactical Bible $VER" --notes-file .github/RELEASE_NOTES.md
