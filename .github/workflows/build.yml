# Build and release pipeline for FM27 Tactical Architect (native Rust + GPUI desktop app).
# Linux runners are pinned to ubuntu-24.04 so runner image upgrades don't break builds.
#  - Default target: Windows (portable .exe + NSIS setup .exe via packaging/installer.nsi)
#  - Optional all_platforms dispatch: adds macOS (.app / .dmg) and Linux (.tar.gz)
#  - On push to main: reads [workspace.package] version from Cargo.toml (must match package.json
#    and src/ui/state.js) and publishes GitHub Release v<version> if it does not already exist.
name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Also build macOS and Linux packages (slower)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['README.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.p.outputs.platforms }}
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        name: Check version sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CARGO=$(awk '/^\[workspace\.package\]/{f=1; next} /^\[/{f=0} f && /^version =/{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          PKG=$(node -p "require('./package.json').version")
          UI=$(sed -n "s/^const VERSION = '\(.*\)';/\1/p" src/ui/state.js)
          if [ -z "$CARGO" ] || [ "$CARGO" != "$PKG" ] || [ "$CARGO" != "$UI" ]; then
            echo "::error::Version mismatch: Cargo.toml=$CARGO package.json=$PKG src/ui/state.js=$UI"
            exit 1
          fi
          echo "version=$CARGO" >> "$GITHUB_OUTPUT"
          if gh release view "v$CARGO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$CARGO already published — skipping release build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libvulkan-dev libfontconfig1-dev libasound2-dev \
            libssl-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-ubuntu-24.04
      - name: Rust workspace tests (ta-core, ta-backend, ta-app)
        run: cargo test --workspace
      - name: Build single-file HTML and run JS engine tests
        run: node build.mjs && npm test
      - id: p
        name: Choose target platforms
        run: |
          if [ "${{ github.event.inputs.all_platforms }}" = "true" ]; then
            echo 'platforms=["windows-latest","macos-latest","ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: test
    timeout-minutes: 60
    if: needs.test.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.test.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.platform }}
      - name: Install Linux GPUI dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libvulkan-dev libfontconfig1-dev libasound2-dev \
            libssl-dev libgtk-3-dev
      - name: Build ta-app (release)
        run: cargo build --release -p ta-app
      - name: Package Windows portable EXE & NSIS installer
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VER="${{ needs.test.outputs.version }}"
          mkdir -p dist
          cp target/release/fm27-tactical-architect.exe "dist/FM27-Tactical-Architect-portable.exe"
          export PATH="$PATH:/c/Program Files (x86)/NSIS:/c/Program Files/NSIS"
          makensis -DVERSION="$VER" packaging/installer.nsi
          ls -la dist
      - name: Package macOS .app & .dmg
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VER="${{ needs.test.outputs.version }}"
          APP="FM27 Tactical Architect.app"
          mkdir -p dist "stage/${APP}/Contents/MacOS" "stage/${APP}/Contents/Resources"
          cp target/release/fm27-tactical-architect "stage/${APP}/Contents/MacOS/fm27-tactical-architect"
          chmod +x "stage/${APP}/Contents/MacOS/fm27-tactical-architect"
          cp assets/icons/icon.icns "stage/${APP}/Contents/Resources/icon.icns"
          cat > "stage/${APP}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>FM27 Tactical Architect</string>
            <key>CFBundleDisplayName</key><string>FM27 Tactical Architect</string>
            <key>CFBundleIdentifier</key><string>com.fm27.tactical-architect</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>fm27-tactical-architect</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          ln -s /Applications stage/Applications
          hdiutil create -volname "FM27 Tactical Architect ${VER}" \
            -srcfolder stage -ov -format UDZO \
            "dist/FM27-Tactical-Architect-${VER}-macos.dmg"
          ls -la dist
      - name: Package Linux tarball
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          VER="${{ needs.test.outputs.version }}"
          PKG="FM27-Tactical-Architect-${VER}-linux-x86_64"
          mkdir -p dist "stage/${PKG}"
          cp target/release/fm27-tactical-architect "stage/${PKG}/fm27-tactical-architect"
          chmod +x "stage/${PKG}/fm27-tactical-architect"
          cp assets/icons/icon.png "stage/${PKG}/icon.png"
          tar -C stage -czf "dist/${PKG}.tar.gz" "${PKG}"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: FM27-Tactical-Architect-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Browser/HTML UI gates (Playwright), in parallel with the native Rust build.
  layout:
    needs: test
    if: needs.test.outputs.exists == 'false'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium (Playwright)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build app/index.html
        run: node build.mjs
      - name: Layout check (English)
        run: python tests/ui_layout.py
      - name: Layout check (Portuguese quick pass)
        run: python tests/ui_layout.py
        env:
          LAYOUT_LANG: pt
          LAYOUT_QUICK: '1'
      - name: Activity indicator checks
        run: python tests/ui_busy.py
      - name: Language coverage check (EN)
        run: python tests/ui_i18n.py
      - name: FM terms check (PT)
        run: python tests/ui_pt_terms.py
      - name: Bidirectional language audit
        run: python tests/ui_lang_audit.py

  # Publish Release v<version> only when all tests, native builds, and layout checks pass.
  release:
    needs: [test, build, layout]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FM27-Tactical-Architect-*
          path: out
          merge-multiple: true
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER="${{ needs.test.outputs.version }}"
          ls -la out
          gh release create "v$VER" out/* --target "${{ github.sha }}" \
            --title "FM27 Tactical Architect $VER" --notes-file .github/RELEASE_NOTES.md
