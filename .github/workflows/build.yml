name: Build FM Tactical Architect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: .
          args: ""

          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "FM-Tactical-Architect-[platform]-[arch]-[bundle]"

      - name: Show build outputs
        shell: pwsh
        run: |
          Write-Host "Build completed."
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse |
            Select-Object FullName
