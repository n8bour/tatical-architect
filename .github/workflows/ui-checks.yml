# Testes de interface (Playwright): layout, indicadores de actividade e idioma.
# Fora do pipeline de release (demoram ~3 min). Corra em Actions → "UI checks" → Run workflow,
# ou abrem sozinhos em pull requests.
name: UI checks

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portão de layout: percorre todos os ecrãs (6 larguras × 3 modos) com um plantel de 62 jogadores.
  # Se houver uma sobreposição ou um erro de JavaScript, este job falha e o Release não é publicado.
  layout:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fixado em ubuntu-24.04: o ubuntu-latest passou a 26.04, que o Playwright 1.56 ainda não suporta.
      - name: Instalar Chromium (Playwright)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Gerar app/index.html
        run: node build.mjs
      - name: Verificar layout em inglês (sem sobreposições)
        run: python tests/ui_layout.py
      - name: Verificar layout em português (passagem rápida)
        run: python tests/ui_layout.py
        env:
          LAYOUT_LANG: pt
          LAYOUT_QUICK: '1'
      - name: Verificar indicadores de actividade
        run: python tests/ui_busy.py
      - name: Verificar cobertura de idioma (nada em português com a app em inglês)
        run: python tests/ui_i18n.py
      - name: Verificar nomes do FM em português (nada em inglês com a app em português)
        run: python tests/ui_pt_terms.py
      - name: Auditoria de idioma nos dois sentidos (vocabulário tirado do código)
        run: python tests/ui_lang_audit.py

